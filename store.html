<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEAOX Powered Apps</title>
    <link rel="icon" type="image/jpeg" href="IMG_20261019_105230.jpg">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .brand-container { text-align: center; margin-bottom: 20px; }
        
        /* Logo Image Setting */
        .brand-img {
            width: 220px;
            mix-blend-mode: multiply; /* White background hatayega */
            margin-bottom: 5px;
        }
        
        .brand-subtitle { color: #555; font-size: 18px; margin-top: 0px; letter-spacing: 1px; }

        .app-card { background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 450px; width: 100%; }
        .app-icon { width: 90px; height: 90px; border-radius: 20px; object-fit: cover; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .app-info h3 { margin: 0 0 10px 0; color: #222; font-size: 24px; }
        .app-info p { margin: 0 0 20px 0; color: #666; font-size: 14px; line-height: 1.5; }
        
        .download-btn { display: block; width: 100%; padding: 12px 20px; background-color: #FFC107; color: #000; text-decoration: none; border-radius: 25px; font-weight: bold; font-size: 16px; border: none; cursor: pointer; transition: background 0.3s; }
        .download-btn:hover { background-color: #FFB300; }

        .progress-container { width: 100%; background-color: #e0e0e0; border-radius: 25px; margin-top: 10px; display: none; overflow: hidden; height: 45px; position: relative; }
        .progress-bar { width: 0%; height: 100%; background-color: #FFC107; transition: width 0.1s; }
        .progress-text { position: absolute; width: 100%; text-align: center; line-height: 45px; font-weight: bold; color: #000; }
    </style>
</head>
<body>

    <div class="brand-container">
        <!-- Yahan aapki image use hui hai -->
        <img src="IMG_20261019_105230.jpg" alt="SEAOX" class="brand-img">
        <p class="brand-subtitle">Powered Apps</p>
    </div>

    <div class="app-card">
        <!-- Yahan Tractor Book ka logo hai -->
        <img src="IMG_20260930_225659.png" alt="App Logo" class="app-icon">
        
        <div class="app-info">
            <h3>Tractor Book</h3>
            <p>An app is now available for all tractor owners to keep track of their accounts right on their mobile phones. Download it and give its features a try!</p>
            
            <button id="downloadBtn" class="download-btn" onclick="startDownload()">Download Now</button>

            <div id="progressContainer" class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
                <div id="progressText" class="progress-text">0%</div>
            </div>
        </div>
    </div>

    <script>
        async function startDownload() {
            const btn = document.getElementById('downloadBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            
            const url = 'https://github.com/rocksatyamkashyap2010-alt/seaox.-in/releases/download/v1.0/TractorBook-1.0.0.1.apk';

            try {
                btn.style.display = 'none'; 
                progressContainer.style.display = 'block'; 
                progressText.innerText = 'Connecting...';

                const response = await fetch(url);
                if (!response.ok) throw new Error('Network issue');

                const total = response.headers.get('content-length');
                let loaded = 0;
                const reader = response.body.getReader();
                const chunks = [];

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    loaded += value.length;
                    
                    if (total) {
                        const percent = Math.round((loaded / total) * 100);
                        progressBar.style.width = percent + '%';
                        progressText.innerText = 'Downloading... ' + percent + '%';
                    } else {
                        progressText.innerText = 'Downloading...';
                    }
                }

                const blob = new Blob(chunks);
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = 'TractorBook.apk';
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(downloadUrl);

                progressText.innerText = 'Download Complete!';
                setTimeout(() => {
                    progressContainer.style.display = 'none';
                    btn.style.display = 'block';
                    btn.innerText = 'Download Again';
                }, 2000);

            } catch (error) {
                window.location.href = url;
                btn.style.display = 'block';
                progressContainer.style.display = 'none';
            }
        }
    </script>
</body>
</html>
