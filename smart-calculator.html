<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEAOX - Fast Calculator</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    
    <!-- Tesseract.js (AI OCR) -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    
    <style>
        body { margin: 0; padding: 10px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { width: 100%; max-width: 500px; display: flex; align-items: center; margin-bottom: 15px; }
        .back-btn { font-size: 24px; color: #333; text-decoration: none; margin-right: 15px; }
        .title { font-size: 20px; font-weight: bold; color: #111; }
        
        .card { background: #fff; padding: 15px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); max-width: 500px; width: 100%; box-sizing: border-box; text-align: center; }
        
        /* Tabs */
        .tabs { display: flex; gap: 5px; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 12px 5px; border: none; border-radius: 8px; background: #f0f0f0; color: #333; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: #1877F2; color: white; box-shadow: 0 4px 10px rgba(24, 119, 242, 0.3); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        input[type="file"] { display: none; }
        
        /* Buttons */
        .btn { padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; width: 100%; color: white; transition: 0.3s; margin-bottom: 10px; }
        .btn-upload { background-color: #00A859; }
        .btn-mic { background-color: #E53935; font-size: 18px; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 4px 10px rgba(229, 57, 53, 0.3); }
        .btn-mic.recording { background-color: #00A859; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        /* Loading Spinner */
        .loader-container { display: none; margin: 15px 0; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #00A859; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Result Area */
        .result-area { text-align: left; margin-top: 10px; background: #f9f9f9; padding: 15px; border-radius: 10px; border: 1px solid #ddd; }
        .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .result-header label { font-size: 14px; font-weight: bold; color: #333; }
        
        textarea { width: 100%; height: 150px; padding: 10px; font-size: 20px; font-family: monospace; border: 2px solid #1877F2; border-radius: 8px; box-sizing: border-box; resize: vertical; margin-bottom: 15px; line-height: 1.5; text-align: right; background: #fff; }
        
        .btn-calc { background: #F39C12; font-size: 18px; }
        
        .total-box { background: #00A859; color: white; padding: 15px; border-radius: 10px; text-align: center; font-size: 32px; font-weight: bold; box-shadow: 0 4px 10px rgba(0, 168, 89, 0.3); margin-top: 15px; display: none;}
        
        #status { font-size: 13px; font-weight: bold; color: #FF9800; margin-top: 10px; }
        #imagePreview { max-width: 100%; max-height: 200px; border-radius: 10px; display: none; margin: 10px auto; }
        .voice-transcript { font-size: 18px; font-weight: bold; color: #1877F2; min-height: 24px; margin-bottom: 10px; padding: 10px; background: #e3f2fd; border-radius: 8px; text-align: left; }
    </style>
</head>
<body>

    <div class="header">
        <a href="menu.html" class="back-btn">←</a>
        <div class="title">Smart Calculator</div>
    </div>

    <div class="card">
        
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('voice')">🎙️ Voice (Accurate)</button>
            <button class="tab-btn" onclick="switchTab('photo')">📸 Photo (AI)</button>
        </div>

        <!-- VOICE TAB -->
        <div id="tab-voice" class="tab-content active">
            <p style="color:#666; font-size:14px; margin-bottom:15px;">Tap Mic. Speak numbers. Say "Plus" to move to next line.</p>
            
            <button class="btn btn-mic" id="micBtn" onclick="startVoice()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="24" height="24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                Start Speaking
            </button>
            <div class="voice-transcript" id="voiceTranscript">...</div>
            <div id="voiceStatus" style="font-size: 13px; font-weight: bold; color: #555; margin-bottom: 10px;"></div>
        </div>

        <!-- PHOTO TAB -->
        <div id="tab-photo" class="tab-content">
            <p style="color:#E53935; font-size:13px; font-weight:bold; margin-bottom:10px;">*Tip: Write numbers clearly with a dark pen.</p>
            <input type="file" id="imageUpload" accept="image/*" capture="environment">
            <button class="btn btn-upload" onclick="document.getElementById('imageUpload').click()">
                📸 Take Photo / Select
            </button>
            <img id="imagePreview" src="" alt="Preview">
            
            <div class="loader-container" id="loaderContainer">
                <div class="loader"></div>
                <div style="font-size: 13px; font-weight: bold; color: #1877F2;">AI padh raha hai... (Please wait)</div>
            </div>
        </div>

        <!-- RESULT AREA -->
        <div class="result-area" id="resultArea" style="display: none;">
            <div class="result-header">
                <label>Check & Edit Numbers:</label>
                <button class="clear-btn" style="background:none; border:none; color:#E53935; font-weight:bold; cursor:pointer;" onclick="clearList()">Clear</button>
            </div>
            
            <textarea id="extractedText" placeholder="Numbers yahan aayenge... (Galti ho toh sudhar lein)" oninput="hideTotal()"></textarea>
            
            <button class="btn btn-calc" onclick="calculateTotal()">🧮 Calculate Total</button>

            <div class="total-box" id="totalAmount">₹ 0</div>
        </div>

        <div id="status"></div>
    </div>

    <script>
        const resultArea = document.getElementById('resultArea');
        const extractedText = document.getElementById('extractedText');
        const totalBox = document.getElementById('totalAmount');

        // ==========================================
        // 1. VOICE RECOGNITION (SMART)
        // ==========================================
        let recognition;
        let isRecording = false;
        let accumulatedText = ""; 
        let silenceTimer = null;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true; 
            recognition.lang = 'en-IN'; 

            recognition.onstart = function() {
                isRecording = true;
                document.getElementById('micBtn').classList.add('recording');
                document.getElementById('micBtn').innerHTML = "🔴 Listening... (Tap to Stop)";
                document.getElementById('voiceStatus').innerText = "Speak now...";
                resultArea.style.display = 'block';
                totalBox.style.display = 'none'; // Hide total until calculated
            };

            recognition.onresult = function(event) {
                let interim = '';
                let final = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        final += event.results[i][0].transcript + " ";
                    } else {
                        interim += event.results[i][0].transcript;
                    }
                }

                if (interim) {
                    document.getElementById('voiceTranscript').innerText = accumulatedText + " " + interim;
                }

                if (final) {
                    accumulatedText += final;
                    
                    // Check for 'plus' or 'add' to create new line
                    if (/plus|add|dhan|जोड़/i.test(final)) {
                        clearTimeout(silenceTimer);
                        processAccumulatedText(); 
                    } else {
                        clearTimeout(silenceTimer);
                        silenceTimer = setTimeout(processAccumulatedText, 1200);
                    }
                }
            };

            recognition.onerror = function(event) {
                document.getElementById('voiceStatus').innerText = "Error: " + event.error;
                if (event.error !== 'no-speech') stopVoice();
            };

            recognition.onend = function() {
                if (isRecording) recognition.start(); 
                else stopVoice();
            };
        }

        function processAccumulatedText() {
            if (accumulatedText.trim() === "") return;

            let textToParse = accumulatedText.toLowerCase()
                                .replace(/plus/g, '\n')
                                .replace(/add/g, '\n')
                                .replace(/dhan/g, '\n')
                                .replace(/जोड़/g, '\n');
            
            let numbers = textToParse.match(/\d+(\.\d+)?/g);
            
            if (numbers) {
                let currentText = extractedText.value.trim();
                let newNumbers = numbers.join("\n");
                extractedText.value = currentText ? currentText + "\n" + newNumbers : newNumbers;
            }

            accumulatedText = "";
            document.getElementById('voiceTranscript').innerText = "✓ Added!";
            totalBox.style.display = 'none'; // Hide total until calculated
        }

        function startVoice() {
            if(isRecording) {
                recognition.stop();
                isRecording = false;
                stopVoice();
            } else {
                extractedText.value = ""; 
                accumulatedText = "";
                document.getElementById('voiceTranscript').innerText = "...";
                recognition.start();
            }
        }

        function stopVoice() {
            isRecording = false;
            document.getElementById('micBtn').classList.remove('recording');
            document.getElementById('micBtn').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="24" height="24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg> Start Speaking`;
            document.getElementById('voiceStatus').innerText = "Stopped.";
        }

        // ==========================================
        // 2. FAST PHOTO OCR (Grayscale + Compressed)
        // ==========================================
        const imageUpload = document.getElementById('imageUpload');
        const imagePreview = document.getElementById('imagePreview');
        const loaderContainer = document.getElementById('loaderContainer');
        const statusDiv = document.getElementById('status');

        imageUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                imagePreview.src = event.target.result;
                imagePreview.style.display = 'block';
            };
            reader.readAsDataURL(file);

            loaderContainer.style.display = 'block';
            resultArea.style.display = 'none';
            statusDiv.innerText = "Optimizing image...";

            try {
                const img = new Image();
                img.src = URL.createObjectURL(file);
                await new Promise(resolve => img.onload = resolve);

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                
                // Resize to 800px for better balance of speed and accuracy
                const MAX_WIDTH = 800; 
                const scale = MAX_WIDTH / img.width;
                canvas.width = MAX_WIDTH;
                canvas.height = img.height * scale;

                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                // Stronger Grayscale & Threshold (Black & White)
                let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    let avg = (data[i] + data[i+1] + data[i+2]) / 3;
                    // Threshold: Make dark pixels darker, light pixels lighter
                    let val = avg > 140 ? 255 : 0; 
                    data[i] = val; data[i+1] = val; data[i+2] = val;
                }
                ctx.putImageData(imgData, 0, 0);

                const compressedImageData = canvas.toDataURL('image/jpeg', 0.9);

                const worker = await Tesseract.createWorker('eng', 1, {
                    logger: m => {
                        if(m.status === 'recognizing text') {
                            statusDiv.innerText = "Scanning: " + Math.round(m.progress * 100) + "%";
                        }
                    }
                });

                await worker.setParameters({
                    tessedit_char_whitelist: '0123456789.',
                    tessedit_pageseg_mode: Tesseract.PSM.SPARSE_TEXT, 
                });

                const { data: { text } } = await worker.recognize(compressedImageData);
                await worker.terminate();

                // Clean text: Remove empty lines and non-number characters
                let cleanText = text.split('\n')
                    .map(line => line.trim())
                    .filter(line => line !== '' && line.length > 0)
                    .join('\n');
                
                extractedText.value = cleanText;
                
                loaderContainer.style.display = 'none';
                statusDiv.innerText = "AI ne photo padh li hai! Ab check karo.";
                statusDiv.style.color = "#00A859";
                resultArea.style.display = 'block';
                totalBox.style.display = 'none'; // Keep total hidden until user clicks calculate

            } catch (error) {
                console.error(error);
                loaderContainer.style.display = 'none';
                statusDiv.innerText = "Error: Photo padhne mein dikkat aayi.";
                statusDiv.style.color = "#E53935";
            }
        });

        // ==========================================
        // 3. CALCULATION & UI
        // ==========================================
        function calculateTotal() {
            let text = extractedText.value;
            let total = 0;
            
            let numbers = text.match(/-?\d+(\.\d+)?/g);

            if (numbers && numbers.length > 0) {
                numbers.forEach(num => {
                    total += parseFloat(num);
                });
                
                totalBox.innerText = "₹ " + total.toLocaleString('en-IN');
                totalBox.style.display = 'block';
            } else {
                totalBox.innerText = "₹ 0";
                totalBox.style.display = 'block';
            }
        }

        function hideTotal() {
            totalBox.style.display = 'none';
        }

        function clearList() {
            extractedText.value = "";
            totalBox.style.display = 'none';
            resultArea.style.display = 'none';
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
