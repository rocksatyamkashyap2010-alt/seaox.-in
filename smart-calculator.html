<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEAOX - Fast Calculator</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    
    <!-- Tesseract.js (Fast OCR Engine) -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    
    <style>
        body { margin: 0; padding: 15px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { width: 100%; max-width: 500px; display: flex; align-items: center; margin-bottom: 15px; }
        .back-btn { font-size: 24px; color: #333; text-decoration: none; margin-right: 15px; }
        .title { font-size: 22px; font-weight: bold; color: #111; }
        
        .card { background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); max-width: 500px; width: 100%; box-sizing: border-box; text-align: center; }
        
        /* Tabs */
        .tabs { display: flex; gap: 10px; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #f0f0f0; color: #333; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: #1877F2; color: white; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        input[type="file"] { display: none; }
        
        /* Buttons */
        .btn { padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; width: 100%; color: white; transition: 0.3s; margin-bottom: 15px; }
        .btn-upload { background-color: #1877F2; }
        .btn-mic { background-color: #E53935; font-size: 18px; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 4px 10px rgba(229, 57, 53, 0.3); }
        .btn-mic.recording { background-color: #00A859; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        /* Loading Spinner */
        .loader-container { display: none; margin: 20px 0; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #00A859; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Result Area */
        .result-area { text-align: left; margin-top: 15px; background: #f9f9f9; padding: 15px; border-radius: 10px; border: 1px solid #eee; }
        textarea { width: 100%; height: 150px; padding: 10px; font-size: 18px; font-family: monospace; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; resize: vertical; margin-bottom: 15px; line-height: 1.5; }
        
        .total-box { background: #00A859; color: white; padding: 15px; border-radius: 10px; text-align: center; font-size: 26px; font-weight: bold; box-shadow: 0 4px 10px rgba(0, 168, 89, 0.3); }
        
        #status { font-size: 14px; font-weight: bold; color: #FF9800; margin-top: 10px; }
        #imagePreview { max-width: 100%; max-height: 200px; border-radius: 10px; display: none; margin: 10px auto; }
    </style>
</head>
<body>

    <div class="header">
        <a href="menu.html" class="back-btn">←</a>
        <div class="title">Fast Calculator</div>
    </div>

    <div class="card">
        
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('voice')">🎙️ Voice (Fastest)</button>
            <button class="tab-btn" onclick="switchTab('photo')">📸 Photo (OCR)</button>
        </div>

        <!-- VOICE TAB -->
        <div id="tab-voice" class="tab-content active">
            <p style="color:#666; font-size:14px; margin-bottom:20px;">Tap the mic and speak numbers (e.g., "200, 500, 452"). AI will add them instantly.</p>
            
            <button class="btn btn-mic" id="micBtn" onclick="startVoice()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="24" height="24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                Start Speaking
            </button>
            <div id="voiceStatus" style="font-size: 14px; font-weight: bold; color: #555; margin-bottom: 10px;"></div>
        </div>

        <!-- PHOTO TAB -->
        <div id="tab-photo" class="tab-content">
            <p style="color:#666; font-size:14px; margin-bottom:20px;">Take a clear photo of your written numbers. (Auto-compress for fast speed).</p>
            
            <input type="file" id="imageUpload" accept="image/*" capture="environment">
            <button class="btn btn-upload" onclick="document.getElementById('imageUpload').click()">
                📸 Select Photo
            </button>
            <img id="imagePreview" src="" alt="Preview">
            
            <div class="loader-container" id="loaderContainer">
                <div class="loader"></div>
                <div style="font-size: 13px; font-weight: bold; color: #1877F2;">AI is reading fast...</div>
            </div>
        </div>

        <!-- RESULT AREA (Common for both) -->
        <div class="result-area" id="resultArea" style="display: none;">
            <label style="font-size: 13px; font-weight: bold; color: #333; display: block; margin-bottom: 5px;">Numbers List (You can edit):</label>
            <textarea id="extractedText" placeholder="Numbers will appear here..."></textarea>
            
            <button class="btn btn-calc" style="background-color: #F39C12;" onclick="calculateTotal()">
                🧮 Calculate Total
            </button>

            <div style="margin-top: 15px;">
                <div style="font-size: 14px; font-weight: bold; color: #555; margin-bottom: 5px; text-align: center;">Total Amount</div>
                <div class="total-box" id="totalAmount">₹ 0</div>
            </div>
        </div>

        <div id="status"></div>
    </div>

    <script>
        // ==========================================
        // 1. VOICE RECOGNITION (FASTEST METHOD)
        // ==========================================
        let recognition;
        let isRecording = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true; // Sunte rahega
            recognition.interimResults = true; // Turant result dega
            recognition.lang = 'en-IN'; // Indian English (samajhne ke liye best)

            recognition.onstart = function() {
                isRecording = true;
                document.getElementById('micBtn').classList.add('recording');
                document.getElementById('micBtn').innerHTML = "🔴 Listening... (Tap to Stop)";
                document.getElementById('voiceStatus').innerText = "Speak your numbers now...";
                document.getElementById('resultArea').style.display = 'block';
            };

            recognition.onresult = function(event) {
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    }
                }
                
                if(finalTranscript) {
                    // Extract numbers from spoken text
                    let numbers = finalTranscript.match(/\d+(\.\d+)?/g);
                    if(numbers) {
                        let currentText = document.getElementById('extractedText').value;
                        let newText = currentText ? currentText + "\n" + numbers.join("\n") : numbers.join("\n");
                        document.getElementById('extractedText').value = newText;
                        calculateTotal(); // Auto calculate
                    }
                }
            };

            recognition.onerror = function(event) {
                document.getElementById('voiceStatus').innerText = "Error: " + event.error;
                stopVoice();
            };

            recognition.onend = function() {
                stopVoice();
            };
        } else {
            document.getElementById('micBtn').innerText = "Voice not supported on this browser";
            document.getElementById('micBtn').disabled = true;
        }

        function startVoice() {
            if(isRecording) {
                recognition.stop();
            } else {
                document.getElementById('extractedText').value = ""; // Clear old
                recognition.start();
            }
        }

        function stopVoice() {
            isRecording = false;
            document.getElementById('micBtn').classList.remove('recording');
            document.getElementById('micBtn').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="24" height="24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg> Start Speaking`;
            document.getElementById('voiceStatus').innerText = "Stopped. Check numbers below.";
        }

        // ==========================================
        // 2. FAST PHOTO OCR (COMPRESSED IMAGE)
        // ==========================================
        const imageUpload = document.getElementById('imageUpload');
        const imagePreview = document.getElementById('imagePreview');
        const loaderContainer = document.getElementById('loaderContainer');
        const resultArea = document.getElementById('resultArea');
        const extractedText = document.getElementById('extractedText');
        const statusDiv = document.getElementById('status');

        imageUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Show preview
            const reader = new FileReader();
            reader.onload = (event) => {
                imagePreview.src = event.target.result;
                imagePreview.style.display = 'block';
            };
            reader.readAsDataURL(file);

            loaderContainer.style.display = 'block';
            resultArea.style.display = 'none';
            statusDiv.innerText = "";

            try {
                // 🚀 SPEED FIX: Resize image before OCR to save memory and time
                const img = new Image();
                img.src = URL.createObjectURL(file);
                await new Promise(resolve => img.onload = resolve);

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Max width 800px (OCR ke liye kaafi hai aur fast hai)
                const MAX_WIDTH = 800;
                const scale = MAX_WIDTH / img.width;
                canvas.width = MAX_WIDTH;
                canvas.height = img.height * scale;

                // Draw image with white background (fix transparency issues)
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                // Convert to compressed data URL
                const compressedImageData = canvas.toDataURL('image/jpeg', 0.8);

                // Run Tesseract on compressed image
                const worker = await Tesseract.createWorker('eng', 1, {
                    logger: m => {
                        if(m.status === 'recognizing text') {
                            statusDiv.innerText = "Scanning: " + Math.round(m.progress * 100) + "%";
                        }
                    }
                });

                await worker.setParameters({
                    tessedit_char_whitelist: '0123456789.-+ /',
                });

                const { data: { text } } = await worker.recognize(compressedImageData);
                await worker.terminate();

                // Clean text
                let cleanText = text.split('\n').map(line => line.trim()).filter(line => line !== '').join('\n');
                extractedText.value = cleanText;
                
                loaderContainer.style.display = 'none';
                statusDiv.innerText = "AI ne photo padh li hai. Niche check karein.";
                statusDiv.style.color = "#00A859";
                resultArea.style.display = 'block';

                if(cleanText.length > 0) calculateTotal();

            } catch (error) {
                console.error(error);
                loaderContainer.style.display = 'none';
                statusDiv.innerText = "Error: Photo padhne mein dikkat aayi. Dobara try karein.";
                statusDiv.style.color = "#E53935";
            }
        });

        // ==========================================
        // 3. CALCULATION LOGIC
        // ==========================================
        function calculateTotal() {
            let text = extractedText.value;
            let total = 0;
            
            let numbers = text.match(/-?\d+(\.\d+)?/g);

            if (numbers && numbers.length > 0) {
                numbers.forEach(num => {
                    total += parseFloat(num);
                });
                
                document.getElementById('totalAmount').innerText = "₹ " + total.toLocaleString('en-IN');
            } else {
                document.getElementById('totalAmount').innerText = "₹ 0";
            }
        }

        // Tabs Switch
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
