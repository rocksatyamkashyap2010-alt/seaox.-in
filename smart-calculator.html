<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEAOX - Smart Calculator</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    
    <!-- Tesseract.js (OCR Engine) -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    
    <style>
        body { margin: 0; padding: 15px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { width: 100%; max-width: 500px; display: flex; align-items: center; margin-bottom: 20px; }
        .back-btn { font-size: 24px; color: #333; text-decoration: none; margin-right: 15px; }
        .title { font-size: 22px; font-weight: bold; color: #111; }
        
        .card { background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); max-width: 500px; width: 100%; box-sizing: border-box; text-align: center; }
        .icon { font-size: 50px; margin-bottom: 10px; }
        h2 { margin: 0 0 10px 0; color: #111; font-size: 20px; }
        p { color: #666; font-size: 13px; margin-bottom: 20px; line-height: 1.4; }

        input[type="file"] { display: none; }
        
        .btn { padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; width: 100%; color: white; transition: 0.3s; margin-bottom: 15px; }
        .btn-upload { background-color: #1877F2; }
        .btn-calc { background-color: #00A859; margin-top: 10px; }
        
        /* Image Preview */
        #imagePreview { max-width: 100%; max-height: 250px; border-radius: 10px; display: none; margin-bottom: 15px; border: 1px solid #ddd; }
        
        /* Loading Spinner */
        .loader-container { display: none; margin: 20px 0; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #00A859; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Results Area */
        .result-area { display: none; text-align: left; margin-top: 20px; background: #f9f9f9; padding: 15px; border-radius: 10px; border: 1px solid #eee; }
        .result-area label { font-size: 13px; font-weight: bold; color: #333; display: block; margin-bottom: 5px; }
        
        textarea { width: 100%; height: 120px; padding: 10px; font-size: 16px; font-family: monospace; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; resize: vertical; margin-bottom: 15px; }
        
        .total-box { background: #00A859; color: white; padding: 15px; border-radius: 10px; text-align: center; font-size: 24px; font-weight: bold; box-shadow: 0 4px 10px rgba(0, 168, 89, 0.3); }
        
        #status { font-size: 14px; font-weight: bold; color: #FF9800; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <a href="menu.html" class="back-btn">←</a>
        <div class="title">Smart Calculator</div>
    </div>

    <div class="card">
        <div class="icon">📸 🧮</div>
        <h2>Photo se Total Nikale</h2>
        <p>Copy mein likhe numbers ki photo khinche. AI unhe padhkar total nikal dega. (Handwriting thodi saaf rakhein).</p>

        <input type="file" id="imageUpload" accept="image/*" capture="environment">
        
        <button class="btn btn-upload" onclick="document.getElementById('imageUpload').click()">
            📸 Take Photo / Select Image
        </button>

        <img id="imagePreview" src="" alt="Preview">

        <div class="loader-container" id="loaderContainer">
            <div class="loader"></div>
            <div style="font-size: 13px; font-weight: bold; color: #1877F2;">AI padh raha hai... Please wait (10-15 sec)</div>
        </div>

        <!-- Result Area -->
        <div class="result-area" id="resultArea">
            <label>Extracted Numbers (Yahan galti sudhar sakte hain):</label>
            <textarea id="extractedText" placeholder="Numbers yahan aayenge..."></textarea>
            
            <button class="btn btn-calc" onclick="calculateTotal()">
                🧮 Calculate Total
            </button>

            <div style="margin-top: 20px;">
                <div style="font-size: 14px; font-weight: bold; color: #555; margin-bottom: 5px; text-align: center;">Total Amount</div>
                <div class="total-box" id="totalAmount">₹ 0</div>
            </div>
        </div>

        <div id="status"></div>
    </div>

    <script>
        const imageUpload = document.getElementById('imageUpload');
        const imagePreview = document.getElementById('imagePreview');
        const loaderContainer = document.getElementById('loaderContainer');
        const resultArea = document.getElementById('resultArea');
        const extractedText = document.getElementById('extractedText');
        const statusDiv = document.getElementById('status');

        imageUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Preview Image
            const reader = new FileReader();
            reader.onload = (event) => {
                imagePreview.src = event.target.result;
                imagePreview.style.display = 'block';
            };
            reader.readAsDataURL(file);

            // Start OCR Process
            loaderContainer.style.display = 'block';
            resultArea.style.display = 'none';
            statusDiv.innerText = "";

            try {
                // Tesseract.js OCR
                const worker = await Tesseract.createWorker('eng', 1, {
                    logger: m => {
                        if(m.status === 'recognizing text') {
                            statusDiv.innerText = "Scanning: " + Math.round(m.progress * 100) + "%";
                        }
                    }
                });

                // Configuration: Sirf numbers aur basic symbols padhne ke liye
                await worker.setParameters({
                    tessedit_char_whitelist: '0123456789.-+ /',
                });

                const { data: { text } } = await worker.recognize(file);
                await worker.terminate();

                // Process the text (Clean up lines)
                let cleanText = text.split('\n').map(line => line.trim()).filter(line => line !== '').join('\n');
                
                extractedText.value = cleanText;
                
                loaderContainer.style.display = 'none';
                statusDiv.innerText = "AI ne photo padh li hai. Niche check karein.";
                statusDiv.style.color = "#00A859";
                resultArea.style.display = 'block';

                // Auto calculate if text found
                if(cleanText.length > 0) calculateTotal();

            } catch (error) {
                console.error(error);
                loaderContainer.style.display = 'none';
                statusDiv.innerText = "Error: Photo padhne mein dikkat aayi. Dobara try karein.";
                statusDiv.style.color = "#E53935";
            }
        });

        // Calculation Logic
        function calculateTotal() {
            let text = extractedText.value;
            let total = 0;
            
            // Regex to find all numbers (including decimals and negative signs)
            let numbers = text.match(/-?\d+(\.\d+)?/g);

            if (numbers && numbers.length > 0) {
                numbers.forEach(num => {
                    total += parseFloat(num);
                });
                
                // Format the total (e.g. 10000 -> 10,000)
                document.getElementById('totalAmount').innerText = "₹ " + total.toLocaleString('en-IN');
            } else {
                document.getElementById('totalAmount').innerText = "₹ 0";
            }
        }
    </script>
</body>
</html>
