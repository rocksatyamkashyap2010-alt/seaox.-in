<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEAOX - Smart Calculator</title>
<link rel="icon" type="image/jpeg" href="favicon.jpg">

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* { box-sizing:border-box; }
body {
    margin:0; padding:12px;
    font-family:'Segoe UI',sans-serif;
    background:#f4f7f6;
    display:flex; flex-direction:column;
    align-items:center; min-height:100vh;
}
.header {
    width:100%; max-width:500px;
    display:flex; align-items:center;
    margin-bottom:15px;
}
.back-btn {
    font-size:25px; color:#333;
    text-decoration:none; margin-right:15px;
}
.title {font-size:21px;font-weight:bold;color:#111;}
.card {
    background:white;padding:16px;
    border-radius:16px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
    max-width:500px;width:100%;
    text-align:center;
}
.tabs {
    display:flex;gap:7px;
    border-bottom:1px solid #eee;
    padding-bottom:12px;margin-bottom:16px;
}
.tab-btn {
    flex:1;padding:12px 5px;
    border:0;border-radius:9px;
    background:#eee;color:#333;
    font-weight:bold;font-size:14px;
    cursor:pointer;
}
.tab-btn.active {background:#1877F2;color:white;}
.tab-content {display:none;}
.tab-content.active {display:block;}

.btn {
    padding:15px;border-radius:10px;
    font-size:16px;font-weight:bold;
    cursor:pointer;border:none;
    width:100%;color:white;margin-bottom:10px;
}
.btn-mic {
    background:#E53935;font-size:18px;
    box-shadow:0 4px 10px rgba(229,57,53,.25);
}
.btn-mic.recording {
    background:#00A859;
    animation:pulse 1.5s infinite;
}
@keyframes pulse {
    50% {transform:scale(1.025);}
}
.language {
    width:100%;padding:12px;
    border:1px solid #ddd;border-radius:8px;
    margin-bottom:12px;font-size:15px;
}
.voice-transcript {
    font-size:16px;color:#1877F2;
    min-height:45px;padding:12px;
    background:#e3f2fd;border-radius:8px;
    text-align:left;margin-bottom:10px;
    overflow-wrap:anywhere;
}
.voice-total {
    background:#00A859;color:white;
    border-radius:12px;padding:15px;
    margin:12px 0;display:none;
}
.voice-total small {display:block;font-size:13px;}
.voice-total strong {font-size:30px;}
.result-area {
    text-align:left;margin-top:12px;
    background:#f9f9f9;padding:13px;
    border-radius:10px;border:1px solid #ddd;
}
.result-header {
    display:flex;justify-content:space-between;
    align-items:center;margin-bottom:10px;
}
textarea {
    width:100%;height:150px;
    padding:10px;font-size:20px;
    font-family:monospace;
    border:2px solid #1877F2;
    border-radius:8px;resize:vertical;
    margin-bottom:12px;line-height:1.5;
    text-align:right;background:white;
}
.btn-calc {background:#F39C12;font-size:18px;}
.btn-upload {background:#00A859;}
.btn-clear {
    background:none;border:none;
    color:#E53935;font-weight:bold;
    cursor:pointer;font-size:14px;
}
.total-box {
    background:#00A859;color:white;
    padding:16px;border-radius:10px;
    text-align:center;font-size:30px;
    font-weight:bold;margin-top:12px;
    display:none;overflow-wrap:anywhere;
}
.loader-container {display:none;margin:18px 0;}
.loader {
    border:4px solid #eee;
    border-top:4px solid #00A859;
    border-radius:50%;width:32px;height:32px;
    animation:spin 1s linear infinite;
    margin:auto;
}
@keyframes spin {to{transform:rotate(360deg);}}
#status {
    font-size:13px;font-weight:bold;
    color:#FF9800;margin-top:10px;
}
#imagePreview {
    max-width:100%;max-height:200px;
    border-radius:10px;display:none;
    margin:10px auto;
}
.hint {font-size:13px;color:#777;line-height:1.6;}
</style>
</head>

<body>

<div class="header">
    <a href="menu.html" class="back-btn">←</a>
    <div class="title">Smart Calculator</div>
</div>

<div class="card">

    <div class="tabs">
        <button class="tab-btn active" data-tab="voice" onclick="switchTab('voice',this)">
            🎙️ Voice
        </button>
        <button class="tab-btn" data-tab="photo" onclick="switchTab('photo',this)">
            📸 Photo
        </button>
    </div>

    <!-- VOICE CALCULATOR -->

    <div id="tab-voice" class="tab-content active">

        <p class="hint">
            Mic दबाएँ और लगातार नंबर बोलें। हर नंबर अपने आप जुड़ता जाएगा।
            उदाहरण: 564 plus 54545 plus 8454
        </p>

        <select id="voiceLanguage" class="language">
            <option value="en-IN">English / Indian English</option>
            <option value="hi-IN">हिंदी</option>
        </select>

        <button class="btn btn-mic" id="micBtn" onclick="toggleVoice()">
            🎙️ Start Speaking
        </button>

        <div class="voice-transcript" id="voiceTranscript">
            आपकी आवाज यहाँ दिखाई देगी...
        </div>

        <div id="voiceStatus" class="hint">
            Ready to calculate
        </div>

        <div class="voice-total" id="voiceTotal">
            <small>LIVE RUNNING TOTAL</small>
            <strong id="voiceTotalValue">₹ 0</strong>
        </div>

        <div class="result-area" id="voiceResult" style="display:none;">
            <div class="result-header">
                <label><b>Recognized Numbers</b></label>
                <button class="btn-clear" onclick="clearVoice()">Clear</button>
            </div>

            <textarea id="voiceNumbers"
                placeholder="आपके बोले हुए नंबर यहाँ आएँगे..."
                oninput="updateVoiceTotal()"></textarea>

            <button class="btn btn-calc" onclick="calculateVoice()">
                🧮 Calculate Total
            </button>
        </div>
    </div>

    <!-- PHOTO CALCULATOR -->

    <div id="tab-photo" class="tab-content">

        <p class="hint" style="color:#E53935;font-weight:bold;">
            पर्ची पर नंबर साफ और गहरे पेन से लिखें।
        </p>

        <input type="file" id="imageUpload"
            accept="image/*" capture="environment"
            style="display:none">

        <button class="btn btn-upload"
            onclick="document.getElementById('imageUpload').click()">
            📸 Take Photo / Select Image
        </button>

        <img id="imagePreview" alt="Photo Preview">

        <div class="loader-container" id="loaderContainer">
            <div class="loader"></div>
            <p id="loadingText" class="hint">AI पर्ची पढ़ रहा है...</p>
        </div>

    </div>

    <!-- COMMON PHOTO RESULT -->

    <div class="result-area" id="photoResult" style="display:none;">

        <div class="result-header">
            <label><b>Check & Edit Numbers</b></label>
            <button class="btn-clear" onclick="clearPhoto()">Clear</button>
        </div>

        <textarea id="extractedText"
            placeholder="Numbers यहाँ आएँगे..."
            oninput="hidePhotoTotal()"></textarea>

        <button class="btn btn-calc" onclick="calculatePhoto()">
            ✅ DONE - Calculate Total
        </button>

        <div class="total-box" id="totalAmount"></div>
    </div>

    <div id="status"></div>
</div>

<script>

// =====================================
// COMMON FUNCTIONS
// =====================================

const $ = id => document.getElementById(id);

function formatMoney(number) {
    return "₹ " + number.toLocaleString("en-IN", {
        maximumFractionDigits: 2
    });
}

function switchTab(tab, button) {
    document.querySelectorAll(".tab-content")
        .forEach(el => el.classList.remove("active"));

    document.querySelectorAll(".tab-btn")
        .forEach(el => el.classList.remove("active"));

    $("tab-" + tab).classList.add("active");
    button.classList.add("active");
}

// =====================================
// 1. VOICE CALCULATOR
// =====================================

const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition = null;
let isRecording = false;
let restartAllowed = false;
let voiceNumbers = [];

function updateVoiceTotal() {
    const values = $("voiceNumbers").value.match(/-?\d+(?:\.\d+)?/g) || [];

    const total = values.reduce((sum, value) => {
        return sum + Number(value);
    }, 0);

    $("voiceTotalValue").innerText = formatMoney(total);
    $("voiceTotal").style.display = values.length ? "block" : "none";
}

// Convert English number words into numbers
function wordsToNumber(text) {

    const words = text.toLowerCase()
        .replace(/[^a-z\s-]/g, " ")
        .replace(/-/g, " ")
        .trim().split(/\s+/)
        .filter(Boolean);

    const units = {
        zero:0, oh:0, one:1, two:2, three:3,
        four:4, five:5, six:6, seven:7,
        eight:8, nine:9, ten:10, eleven:11,
        twelve:12, thirteen:13, fourteen:14,
        fifteen:15, sixteen:16, seventeen:17,
        eighteen:18, nineteen:19,
        twenty:20, thirty:30, forty:40,
        fifty:50, sixty:60, seventy:70,
        eighty:80, ninety:90
    };

    let total = 0;
    let current = 0;
    let found = false;

    for (const word of words) {

        if (word === "and") continue;

        if (units[word] !== undefined) {
            current += units[word];
            found = true;
        }
        else if (word === "hundred") {
            current = (current || 1) * 100;
            found = true;
        }
        else if (word === "thousand") {
            total += (current || 1) * 1000;
            current = 0;
            found = true;
        }
        else if (word === "lakh" || word === "lac") {
            total += (current || 1) * 100000;
            current = 0;
            found = true;
        }
        else if (word === "million") {
            total += (current || 1) * 1000000;
            current = 0;
            found = true;
        }
        else {
            return null;
        }
    }

    return found ? total + current : null;
}

function parseSpeech(text) {

    // If speech recognition gives numeric digits
    const digitMatches = text.match(/\d+(?:\.\d+)?/g);

    if (digitMatches && digitMatches.length) {
        return digitMatches.map(Number);
    }

    // If it gives English number words
    const parts = text.toLowerCase().split(
        /\b(?:plus|add|added|and then|minus|times|multiply)\b/
    );

    const result = [];

    for (const part of parts) {
        const value = wordsToNumber(part);

        if (value !== null) result.push(value);
    }

    return result;
}

function addVoiceNumbers(numbers) {

    if (!numbers.length) return;

    voiceNumbers.push(...numbers);

    $("voiceNumbers").value = voiceNumbers.join("\n");

    $("voiceResult").style.display = "block";
    $("voiceTotal").style.display = "block";

    updateVoiceTotal();

    $("voiceStatus").innerText =
        "✓ " + numbers.length + " new number(s) added";
}

function setupRecognition() {

    if (!SpeechRecognition) {
        $("voiceStatus").innerText =
            "आपका browser Voice Recognition support नहीं करता। Chrome में खोलें।";
        return false;
    }

    recognition = new SpeechRecognition();

    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.lang = $("voiceLanguage").value;

    recognition.onstart = () => {
        isRecording = true;
        $("micBtn").classList.add("recording");
        $("micBtn").innerText = "🔴 Listening... Tap to Stop";
        $("voiceStatus").innerText = "बोलिए, नंबर जुड़ते जाएँगे...";
    };

    recognition.onresult = (event) => {

        let interim = "";
        let added = [];

        // Only process newly finalized results
        for (let i = event.resultIndex; i < event.results.length; i++) {

            const transcript = event.results[i][0].transcript;

            if (event.results[i].isFinal) {
                added.push(transcript);
            } else {
                interim += transcript;
            }
        }

        if (added.length) {

            const finalText = added.join(" ");

            $("voiceTranscript").innerText = finalText;

            const numbers = parseSpeech(finalText);

            addVoiceNumbers(numbers);
        }

        if (interim) {
            $("voiceTranscript").innerText = interim;
        }
    };

    recognition.onerror = (event) => {

        $("voiceStatus").innerText = "Voice: " + event.error;

        if (
            event.error === "not-allowed" ||
            event.error === "service-not-allowed" ||
            event.error === "audio-capture"
        ) {
            restartAllowed = false;
            stopVoice();
        }
    };

    recognition.onend = () => {

        if (restartAllowed) {

            // Restart recognition to continue listening
            setTimeout(() => {
                if (restartAllowed) {
                    try {
                        recognition.start();
                    } catch (error) {
                        // Browser may already be restarting
                    }
                }
            }, 250);

        } else {
            stopVoice();
        }
    };

    return true;
}

function toggleVoice() {

    if (isRecording || restartAllowed) {
        restartAllowed = false;

        try {
            recognition.stop();
        } catch (error) {}

        stopVoice();
        return;
    }

    if (!SpeechRecognition) {
        setupRecognition();
        return;
    }

    voiceNumbers = [];
    $("voiceNumbers").value = "";
    $("voiceResult").style.display = "block";
    $("voiceTotal").style.display = "none";
    $("voiceTranscript").innerText = "Listening...";
    $("voiceStatus").innerText = "Starting microphone...";

    if (!recognition ||
        recognition.lang !== $("voiceLanguage").value) {
        setupRecognition();
    }

    restartAllowed = true;

    try {
        recognition.start();
    } catch (error) {
        $("voiceStatus").innerText =
            "Microphone start नहीं हुआ। दोबारा कोशिश करें।";
    }
}

function stopVoice() {

    isRecording = false;
    restartAllowed = false;

    $("micBtn").classList.remove("recording");
    $("micBtn").innerText = "🎙️ Start Speaking";

    $("voiceStatus").innerText = "Stopped. आपके नंबर सुरक्षित हैं।";
}

function calculateVoice() {

    const numbers = $("voiceNumbers").value.match(/-?\d+(?:\.\d+)?/g) || [];

    const total = numbers.reduce((sum, value) => {
        return sum + Number(value);
    }, 0);

    $("voiceTotalValue").innerText = formatMoney(total);
    $("voiceTotal").style.display = "block";
}

function clearVoice() {

    restartAllowed = false;

    if (recognition && isRecording) {
        try { recognition.stop(); } catch(error) {}
    }

    stopVoice();

    voiceNumbers = [];
    $("voiceNumbers").value = "";
    $("voiceTotal").style.display = "none";
    $("voiceResult").style.display = "none";
    $("voiceTranscript").innerText = "आपकी आवाज यहाँ दिखाई देगी...";
}

// =====================================
// 2. PHOTO CALCULATOR / OCR
// =====================================

let ocrWorker = null;
let ocrLoading = false;

async function getOCRWorker() {

    if (ocrWorker) return ocrWorker;

    if (ocrLoading) {
        while (ocrLoading) {
            await new Promise(resolve => setTimeout(resolve, 100));
        }
        if (ocrWorker) return ocrWorker;
    }

    ocrLoading = true;

    try {
        ocrWorker = await Tesseract.createWorker("eng", 1, {
            logger: message => {

                if (message.status === "recognizing text") {
                    $("loadingText").innerText =
                        "Scanning: " + Math.round(message.progress * 100) + "%";
                }
            }
        });

        await ocrWorker.setParameters({
            tessedit_char_whitelist: "0123456789.,",
            tessedit_pageseg_mode: Tesseract.PSM.SPARSE_TEXT
        });

        return ocrWorker;

    } finally {
        ocrLoading = false;
    }
}

const imageUpload = $("imageUpload");

imageUpload.addEventListener("change", async (event) => {

    const file = event.target.files[0];

    if (!file) return;

    $("loaderContainer").style.display = "block";
    $("photoResult").style.display = "none";
    $("status").innerText = "Preparing photo...";
    $("status").style.color = "#1877F2";

    $("totalAmount").style.display = "none";

    const imageURL = URL.createObjectURL(file);

    try {

        const img = new Image();

        img.src = imageURL;

        await new Promise((resolve, reject) => {
            img.onload = resolve;
            img.onerror = reject;
        });

        $("imagePreview").src = imageURL;
        $("imagePreview").style.display = "block";

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d", {
            willReadFrequently:true
        });

        // Preserve sufficient detail for handwritten numbers
        const maxWidth = 1400;
        const scale = Math.min(1, maxWidth / img.width);

        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);

        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        // Grayscale and contrast enhancement
        const imageData = ctx.getImageData(
            0, 0, canvas.width, canvas.height
        );

        const data = imageData.data;

        for (let i = 0; i < data.length; i += 4) {

            const gray =
                0.299 * data[i] +
                0.587 * data[i+1] +
                0.114 * data[i+2];

            const enhanced = Math.max(
                0, Math.min(255, (gray - 120) * 1.4 + 120)
            );

            data[i] = enhanced;
            data[i+1] = enhanced;
            data[i+2] = enhanced;
        }

        ctx.putImageData(imageData, 0, 0);

        $("loadingText").innerText = "AI पर्ची पढ़ रहा है...";

        const worker = await getOCRWorker();

        const result = await worker.recognize(canvas);

        const recognizedText = result.data.text;

        // Extract every number from OCR output
        const numbers = recognizedText.match(/\d+(?:\.\d+)?/g) || [];

        $("extractedText").value = numbers.join("\n");

        $("loaderContainer").style.display = "none";
        $("photoResult").style.display = "block";

        if (numbers.length) {

            $("status").innerText =
                numbers.length + " numbers मिले। कृपया चेक करें और DONE दबाएँ।";

            $("status").style.color = "#00A859";

        } else {

            $("status").innerText =
                "नंबर नहीं मिले। कृपया साफ फोटो दोबारा लें।";

            $("status").style.color = "#E53935";
        }

    } catch (error) {

        console.error("OCR Error:", error);

        $("loaderContainer").style.display = "none";

        $("status").innerText =
            "Photo पढ़ने में दिक्कत आई। दोबारा कोशिश करें।";

        $("status").style.color = "#E53935";

    } finally {

        URL.revokeObjectURL(imageURL);
        imageUpload.value = "";
    }
});

// =====================================
// 3. PHOTO TOTAL
// =====================================

function calculatePhoto() {

    const text = $("extractedText").value;

    const numbers = text.match(/-?\d+(?:\.\d+)?/g) || [];

    if (!numbers.length) {
        $("status").innerText = "पहले नंबर डालें या फोटो खींचें।";
        $("status").style.color = "#E53935";
        return;
    }

    const total = numbers.reduce((sum, value) => {
        return sum + Number(value);
    }, 0);

    $("totalAmount").innerText = formatMoney(total);
    $("totalAmount").style.display = "block";

    $("status").innerText =
        "✓ Calculation Complete!";

    $("status").style.color = "#00A859";
}

function hidePhotoTotal() {
    $("totalAmount").style.display = "none";
}

function clearPhoto() {

    $("extractedText").value = "";
    $("totalAmount").style.display = "none";
    $("photoResult").style.display = "none";
    $("imagePreview").style.display = "none";
    $("status").innerText = "";
}

</script>

</body>
</html>
