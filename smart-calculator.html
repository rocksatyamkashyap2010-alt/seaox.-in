<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEAOX - Smart Calculator</title>
<link rel="icon" type="image/jpeg" href="favicon.jpg">

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;padding:12px;
font-family:'Segoe UI',Arial,sans-serif;
background:#f4f7f6;
display:flex;flex-direction:column;
align-items:center;min-height:100vh;
}

.header{
width:100%;max-width:500px;
display:flex;align-items:center;
margin-bottom:15px;
}

.back-btn{
font-size:25px;color:#333;
text-decoration:none;margin-right:15px;
}

.title{font-size:21px;font-weight:bold;color:#111}

.card{
background:white;padding:16px;
border-radius:18px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
max-width:500px;width:100%;
text-align:center;
}

.tabs{
display:flex;gap:7px;
border-bottom:1px solid #eee;
padding-bottom:14px;margin-bottom:18px;
}

.tab-btn{
flex:1;padding:14px 5px;
border:0;border-radius:12px;
background:#eee;color:#333;
font-weight:bold;font-size:16px;
cursor:pointer;
}

.tab-btn.active{
background:#1877F2;color:white;
}

.tab-content{display:none}
.tab-content.active{display:block}

.btn{
padding:17px 10px;border-radius:12px;
font-size:17px;font-weight:bold;
cursor:pointer;border:none;
width:100%;color:white;margin-bottom:12px;
}

.btn-mic{
background:#E53935;
box-shadow:0 4px 10px rgba(229,57,53,.2);
}

.btn-mic.recording{
background:#00A859;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
50%{transform:scale(1.025)}
}

.btn-upload{background:#00A859}
.btn-calc{background:#F39C12;font-size:18px}

.hint{
font-size:15px;color:#777;
line-height:1.7;margin-bottom:15px;
}

.language{
width:100%;padding:14px;
border:1px solid #ddd;border-radius:10px;
margin-bottom:14px;font-size:16px;
background:#f1f1f1;
}

.voice-transcript{
font-size:18px;color:#1877F2;
min-height:55px;padding:13px;
background:#e3f2fd;border-radius:10px;
text-align:left;margin:12px 0;
overflow-wrap:anywhere;
}

.voice-total{
background:#00A859;color:white;
border-radius:13px;padding:18px;
margin:14px 0;display:none;
}

.voice-total small{
display:block;font-size:14px;
}

.voice-total strong{
display:block;font-size:36px;
margin-top:5px;
}

.result-area{
text-align:left;margin-top:14px;
background:#f9f9f9;padding:15px;
border-radius:14px;border:1px solid #ddd;
}

.result-header{
display:flex;justify-content:space-between;
align-items:center;margin-bottom:12px;
font-size:17px;
}

textarea{
width:100%;height:155px;
padding:12px;font-size:22px;
font-family:monospace;
border:2px solid #1877F2;
border-radius:10px;resize:vertical;
margin-bottom:13px;line-height:1.6;
text-align:right;background:white;
}

.total-box{
background:#00A859;color:white;
padding:20px;border-radius:12px;
text-align:center;font-size:34px;
font-weight:bold;margin-top:14px;
display:none;overflow-wrap:anywhere;
}

.btn-clear{
background:none;border:none;
color:#E53935;font-weight:bold;
cursor:pointer;font-size:16px;
}

.loader-container{
display:none;margin:20px 0;
}

.loader{
border:4px solid #eee;
border-top:4px solid #00A859;
border-radius:50%;width:36px;height:36px;
animation:spin 1s linear infinite;margin:auto;
}

@keyframes spin{to{transform:rotate(360deg)}}

#status{
font-size:14px;font-weight:bold;
color:#00A859;margin-top:12px;
line-height:1.5;
}

#imagePreview{
max-width:100%;max-height:280px;
border-radius:12px;display:none;
margin:12px auto;
}

input[type=file]{display:none}

@media(max-width:360px){
.title{font-size:18px}
.tab-btn{font-size:14px}
.total-box{font-size:28px}
}
</style>
</head>

<body>

<div class="header">
<a href="menu.html" class="back-btn">←</a>
<div class="title">Smart Calculator</div>
</div>

<div class="card">

<!-- TABS -->

<div class="tabs">
<button class="tab-btn active"
onclick="switchTab('voice',this)">
🎙️ Voice
</button>

<button class="tab-btn"
onclick="switchTab('photo',this)">
📸 Photo
</button>
</div>

<!-- VOICE -->

<div id="tab-voice" class="tab-content active">

<p class="hint">
Mic दबाएँ और लगातार नंबर बोलें।
हर नंबर अपने आप जुड़ता जाएगा।
<br>
उदाहरण: 589 plus 55 plus 855 plus 100
</p>

<select id="voiceLanguage" class="language">
<option value="hi-IN">हिंदी</option>
<option value="en-IN">English / Indian English</option>
</select>

<button class="btn btn-mic" id="micBtn"
onclick="toggleVoice()">
🎙️ Start Speaking
</button>

<div class="voice-transcript" id="voiceTranscript">
आपकी आवाज यहाँ दिखाई देगी...
</div>

<div id="voiceStatus" class="hint">
Ready to calculate
</div>

<div class="voice-total" id="voiceTotal">
<small>LIVE RUNNING TOTAL</small>
<strong id="voiceTotalValue">₹ 0</strong>
</div>

<div class="result-area" id="voiceResult"
style="display:none">

<div class="result-header">
<b>Recognized Numbers</b>
<button class="btn-clear" onclick="clearVoice()">
Clear
</button>
</div>

<textarea id="voiceNumbers"
placeholder="आपके बोले हुए नंबर..."
oninput="updateVoiceTotal()"></textarea>

<button class="btn btn-calc"
onclick="calculateVoice()">
🧮 Calculate Total
</button>

</div>
</div>

<!-- PHOTO -->

<div id="tab-photo" class="tab-content">

<p class="hint" style="color:#D84343;font-weight:bold">
पर्ची पर नंबर साफ और गहरे पेन से लिखें।
</p>

<input type="file" id="imageUpload"
accept="image/*" capture="environment">

<button class="btn btn-upload"
onclick="document.getElementById('imageUpload').click()">
📸 Take Photo / Select Image
</button>

<img id="imagePreview" alt="Photo Preview">

<div class="loader-container" id="loaderContainer">
<div class="loader"></div>
<p id="loadingText" class="hint">
AI पर्ची पढ़ रहा है...
</p>
</div>

</div>

<!-- PHOTO RESULT -->

<div class="result-area" id="photoResult"
style="display:none">

<div class="result-header">
<b>Check & Edit Numbers</b>
<button class="btn-clear" onclick="clearPhoto()">
Clear
</button>
</div>

<textarea id="extractedText"
placeholder="Numbers यहाँ आएँगे..."
oninput="hidePhotoTotal()"></textarea>

<button class="btn btn-calc"
onclick="calculatePhoto()">
✅ DONE - Calculate Total
</button>

<div class="total-box" id="totalAmount"></div>

</div>

<div id="status"></div>

</div>

<script>

// ======================================
// COMMON
// ======================================

const $ = id => document.getElementById(id);

function formatMoney(number){
return "₹ " + number.toLocaleString("en-IN",{
maximumFractionDigits:2
});
}

function switchTab(tab,button){

document.querySelectorAll(".tab-content")
.forEach(el=>el.classList.remove("active"));

document.querySelectorAll(".tab-btn")
.forEach(el=>el.classList.remove("active"));

$("tab-"+tab).classList.add("active");
button.classList.add("active");

}

// ======================================
// VOICE CALCULATOR - DUPLICATE FIX
// ======================================

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

let recognition = null;
let shouldContinue = false;
let sessionId = 0;
let restartTimer = null;
let isRecording = false;

function updateVoiceTotal(){

const numbers=$("voiceNumbers").value.match(
/-?\d+(?:\.\d+)?/g
)||[];

const total=numbers.reduce(
(sum,n)=>sum+Number(n),0
);

$("voiceTotalValue").innerText=formatMoney(total);

$("voiceTotal").style.display=
numbers.length?"block":"none";

}

function addVoiceNumbers(numbers){

if(!numbers.length)return;

const current=$("voiceNumbers").value.trim();

const newText=numbers.join("\n");

$("voiceNumbers").value=
current?current+"\n"+newText:newText;

$("voiceResult").style.display="block";

updateVoiceTotal();

$("voiceStatus").innerText=
"✓ "+numbers.length+" number(s) added successfully";

}

function createVoiceSession(mySession){

const rec=new SpeechRecognition();

rec.lang=$("voiceLanguage").value;
rec.continuous=false;
rec.interimResults=true;
rec.maxAlternatives=1;

let resultProcessed=false;

rec.onstart=()=>{

if(mySession!==sessionId)return;

isRecording=true;

$("micBtn").classList.add("recording");

$("micBtn").innerText=
"🔴 Listening... Tap to Stop";

$("voiceStatus").innerText="Speak your numbers...";

};

rec.onresult=(event)=>{

if(mySession!==sessionId || resultProcessed)return;

let finalText="";
let interimText="";

// Sirf naye final results padho
for(let i=event.resultIndex;i<event.results.length;i++){

const result=event.results[i];

if(result.isFinal){
finalText+=result[0].transcript+" ";
}else{
interimText+=result[0].transcript+" ";
}

}

$("voiceTranscript").innerText=
finalText.trim()||interimText.trim()||"...";

if(!finalText.trim())return;

// Ek event ko sirf ek baar process karo
resultProcessed=true;

const numbers=finalText.match(
/\d+(?:\.\d+)?/g
)||[];

if(numbers.length){

addVoiceNumbers(numbers);

}else{

$("voiceStatus").innerText=
"Number पहचान नहीं आया। दोबारा बोलें।";

}

};

rec.onerror=(event)=>{

if(mySession!==sessionId)return;

$("voiceStatus").innerText=
"Voice error: "+event.error;

if(
event.error==="not-allowed"||
event.error==="service-not-allowed"
){

shouldContinue=false;

}

};

rec.onend=()=>{

if(mySession!==sessionId)return;

isRecording=false;

if(shouldContinue){

clearTimeout(restartTimer);

restartTimer=setTimeout(()=>{

if(
shouldContinue &&
mySession===sessionId
){

startOneVoiceSession(mySession);

}

},400);

}else{

stopVoiceUI();

}

};

return rec;

}

function startOneVoiceSession(mySession){

if(!shouldContinue||mySession!==sessionId)return;

try{

recognition=createVoiceSession(mySession);

recognition.start();

}catch(error){

$("voiceStatus").innerText=
"Mic start nahi hua. Dobara try karein.";

}

}

function toggleVoice(){

if(!SpeechRecognition){

$("voiceStatus").innerText=
"Voice support nahi hai. Android Chrome use karein.";

return;

}

if(shouldContinue){

stopVoice();

return;

}

clearTimeout(restartTimer);

$("voiceNumbers").value="";

$("voiceResult").style.display="block";
$("voiceTotal").style.display="none";

$("voiceTranscript").innerText="Listening...";

shouldContinue=true;

sessionId++;

startOneVoiceSession(sessionId);

}

function stopVoice(){

shouldContinue=false;

sessionId++;

clearTimeout(restartTimer);

if(recognition){

const oldRecognition=recognition;

recognition=null;

try{
oldRecognition.stop();
}catch(error){}

}

stopVoiceUI();

}

function stopVoiceUI(){

isRecording=false;

$("micBtn").classList.remove("recording");

$("micBtn").innerText="🎙️ Start Speaking";

$("voiceStatus").innerText=
"Stopped. Aapke numbers safe hain.";

}

function calculateVoice(){

updateVoiceTotal();

}

function clearVoice(){

stopVoice();

$("voiceNumbers").value="";

$("voiceResult").style.display="none";
$("voiceTotal").style.display="none";

$("voiceTranscript").innerText=
"आपकी आवाज यहाँ दिखाई देगी...";

}

$("voiceLanguage").addEventListener("change",()=>{

if(shouldContinue){
stopVoice();
}

});

// ======================================
// PHOTO OCR
// ======================================

let ocrWorker=null;
let workerLoading=null;

async function getOCRWorker(){

if(ocrWorker)return ocrWorker;

if(workerLoading)return workerLoading;

workerLoading=(async()=>{

const worker=await Tesseract.createWorker("eng",1,{

logger:m=>{

if(m.status==="recognizing text"){

$("loadingText").innerText=
"Scanning: "+Math.round(m.progress*100)+"%";

}

}

});

await worker.setParameters({

tessedit_char_whitelist:"0123456789.",

tessedit_pageseg_mode:
Tesseract.PSM.SINGLE_COLUMN,

preserve_interword_spaces:"1"

});

ocrWorker=worker;

return worker;

})();

try{

return await workerLoading;

}catch(error){

ocrWorker=null;
throw error;

}finally{

workerLoading=null;

}

}

// ======================================
// PHOTO PROCESSING
// ======================================

$("imageUpload").addEventListener("change",async(event)=>{

const file=event.target.files[0];

if(!file)return;

$("loaderContainer").style.display="block";
$("photoResult").style.display="none";

$("totalAmount").style.display="none";

$("status").innerText="Preparing photo...";

$("status").style.color="#1877F2";

const imageURL=URL.createObjectURL(file);

try{

const img=new Image();

img.src=imageURL;

await new Promise((resolve,reject)=>{

img.onload=resolve;
img.onerror=reject;

});

$("imagePreview").src=imageURL;

$("imagePreview").style.display="block";

// Resize image

const canvas=document.createElement("canvas");

const ctx=canvas.getContext("2d",{
willReadFrequently:true
});

const maxWidth=1600;

const scale=Math.min(1,maxWidth/img.width);

canvas.width=Math.round(img.width*scale);
canvas.height=Math.round(img.height*scale);

ctx.drawImage(
img,0,0,canvas.width,canvas.height
);

// Contrast enhancement

const imageData=ctx.getImageData(
0,0,canvas.width,canvas.height
);

const data=imageData.data;

for(let i=0;i<data.length;i+=4){

const gray=
0.299*data[i]+
0.587*data[i+1]+
0.114*data[i+2];

const enhanced=Math.max(
0,Math.min(255,(gray-115)*1.35+115)
);

data[i]=enhanced;
data[i+1]=enhanced;
data[i+2]=enhanced;

}

ctx.putImageData(imageData,0,0);

// OCR

$("loadingText").innerText="AI पर्ची पढ़ रहा है...";

const worker=await getOCRWorker();

const result=await worker.recognize(canvas);

// ======================================
// LINE-WISE NUMBER READING
// ======================================

const lines=result.data.lines||[];

let numbers=[];

if(lines.length){

numbers=lines

.sort((a,b)=>a.bbox.y0-b.bbox.y0)

.map(line=>{

// Same line ke saare digits jodo
return line.text.replace(/[^0-9]/g,"");

})

.filter(n=>n.length>0);

}else{

// Fallback when OCR lines are unavailable
numbers=(result.data.text.match(/\d+/g)||[]);

}

// Display editable numbers

$("extractedText").value=numbers.join("\n");

$("loaderContainer").style.display="none";

$("photoResult").style.display="block";

if(numbers.length){

$("status").innerText=
numbers.length+
" numbers mile. Check karein aur DONE dabayein.";

$("status").style.color="#00A859";

}else{

$("status").innerText=
"Number nahi mile. Clear photo dobara lein.";

$("status").style.color="#E53935";

}

}catch(error){

console.error("OCR Error:",error);

$("loaderContainer").style.display="none";

$("status").innerText=
"Photo read nahi ho payi. Dobara try karein.";

$("status").style.color="#E53935";

}finally{

URL.revokeObjectURL(imageURL);

$("imageUpload").value="";

}

});

// ======================================
// PHOTO TOTAL
// ======================================

function calculatePhoto(){

const text=$("extractedText").value;

const numbers=text.match(
/-?\d+(?:\.\d+)?/g
)||[];

if(!numbers.length){

$("status").innerText=
"Pehle numbers enter karein.";

$("status").style.color="#E53935";

return;

}

const total=numbers.reduce(
(sum,n)=>sum+Number(n),0
);

$("totalAmount").innerText=formatMoney(total);

$("totalAmount").style.display="block";

$("status").innerText="✓ Calculation Complete!";

$("status").style.color="#00A859";

}

function hidePhotoTotal(){

$("totalAmount").style.display="none";

}

function clearPhoto(){

$("extractedText").value="";

$("totalAmount").style.display="none";

$("photoResult").style.display="none";

$("imagePreview").style.display="none";

$("status").innerText="";

}

</script>

</body>
</html>
