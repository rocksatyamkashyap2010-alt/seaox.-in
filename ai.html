<!DOCTYPE html>
<html>
<head>
    <title>Groq Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: Arial; padding: 20px;">

    <h2>Groq AI Test</h2>
    <input type="text" id="userInput" placeholder="Type Hi..." style="width: 100%; padding: 10px; font-size: 16px; margin-bottom: 10px;">
    <button onclick="testAI()" style="width: 100%; padding: 15px; background: blue; color: white; font-size: 18px; border: none; border-radius: 5px;">Send</button>
    
    <div id="output" style="margin-top: 20px; padding: 15px; border: 2px solid black; min-height: 100px; background: #f0f0f0; white-space: pre-wrap;"></div>

    <script>
        // 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
        const API_KEY = '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'; 

        async function testAI() {
            const text = document.getElementById('userInput').value;
            const output = document.getElementById('output');
            output.innerText = "Wait...";

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + API_KEY
                    },
                    body: JSON.stringify({
                        model: 'llama3-8b-8192',
                        messages: [{ role: "user", content: text }]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    output.style.color = "red";
                    output.innerText = "API ERROR: " + data.error.message;
                } else {
                    output.style.color = "green";
                    output.innerText = data.choices[0].message.content;
                }
            } catch (error) {
                output.style.color = "red";
                output.innerText = "NETWORK ERROR: " + error.message;
            }
        }
    </script>
</body>
</html>
