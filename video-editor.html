<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEAOX - Video Trimmer</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 15px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { width: 100%; max-width: 800px; display: flex; align-items: center; margin-bottom: 15px; }
        .back-btn { font-size: 24px; color: #fff; text-decoration: none; margin-right: 15px; }
        .title { font-size: 20px; font-weight: bold; }

        .editor-container { position: relative; width: 100%; max-width: 600px; margin: auto; background: #000; border-radius: 10px; overflow: hidden; display: flex; justify-content: center; align-items: center; min-height: 200px; }
        
        video { width: 100%; max-height: 50vh; display: block; }
        
        /* Visual Crop Box */
        .crop-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; touch-action: none; }
        .crop-box { position: absolute; border: 2px dashed #00A859; background: rgba(0, 168, 89, 0.2); width: 80%; height: 80%; top: 10%; left: 10%; cursor: move; touch-action: none; }
        .crop-box::before, .crop-box::after { content: ''; position: absolute; width: 15px; height: 15px; background: #00A859; border-radius: 50%; }
        .crop-box::before { bottom: -7px; right: -7px; cursor: se-resize; }
        
        /* Timeline Sliders */
        .controls { width: 100%; max-width: 600px; margin-top: 15px; background: #1e1e1e; padding: 15px; border-radius: 10px; }
        .slider-group { margin-bottom: 15px; }
        .slider-group label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; color: #aaa; }
        input[type="range"] { width: 100%; accent-color: #E91E63; }
        
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; background: #E91E63; color: white; margin-top: 10px; transition: 0.3s; }
        .btn:disabled { background: #555; }
        
        input[type="file"] { display: none; }
        .upload-btn { background: #333; color: white; padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 15px; display: block; border: 1px dashed #666; }
        
        #status { font-size: 14px; font-weight: bold; color: #FF9800; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>

    <div class="header">
        <a href="menu.html" class="back-btn">←</a>
        <div class="title">Video Editor</div>
    </div>

    <input type="file" id="videoInput" accept="video/*">
    <label for="videoInput" class="upload-btn">📂 Select Video to Edit</label>

    <div class="editor-container" id="editorArea">
        <video id="videoPreview" playsinline></video>
        <!-- Visual Crop Box -->
        <div class="crop-overlay" id="cropOverlay">
            <div class="crop-box" id="cropBox"></div>
        </div>
    </div>

    <div class="controls" id="controls" style="display: none;">
        
        <div class="slider-group">
            <label><span>Start Time</span> <span id="startVal">0.0s</span></label>
            <input type="range" id="startSlider" min="0" max="100" value="0" step="0.1">
        </div>
        
        <div class="slider-group">
            <label><span>End Time</span> <span id="endVal">0.0s</span></label>
            <input type="range" id="endSlider" min="0" max="100" value="100" step="0.1">
        </div>

        <div class="slider-group">
            <label><span>Crop Width (Drag box corner)</span></label>
        </div>

        <button class="btn" id="processBtn" onclick="processVideo()">
            ✂️ Trim & Download Video
        </button>
        
        <div id="status"></div>
    </div>

    <canvas id="hiddenCanvas" style="display:none;"></canvas>

    <script>
        const videoInput = document.getElementById('videoInput');
        const videoPreview = document.getElementById('videoPreview');
        const controls = document.getElementById('controls');
        const editorArea = document.getElementById('editorArea');
        const cropOverlay = document.getElementById('cropOverlay');
        const cropBox = document.getElementById('cropBox');
        const startSlider = document.getElementById('startSlider');
        const endSlider = document.getElementById('endSlider');
        const startVal = document.getElementById('startVal');
        const endVal = document.getElementById('endVal');
        const statusDiv = document.getElementById('status');
        const processBtn = document.getElementById('processBtn');
        const canvas = document.getElementById('hiddenCanvas');
        const ctx = canvas.getContext('2d');

        let videoDuration = 0;
        let isDragging = false;
        let isResizing = false;
        let startX, startY, startLeft, startTop, startWidth, startHeight;

        // Video Load
        videoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const url = URL.createObjectURL(file);
            videoPreview.src = url;
            
            videoPreview.onloadedmetadata = function() {
                videoDuration = videoPreview.duration;
                startSlider.max = videoDuration;
                endSlider.max = videoDuration;
                endSlider.value = videoDuration;
                
                startVal.innerText = "0.0s";
                endVal.innerText = videoDuration.toFixed(1) + "s";
                
                controls.style.display = 'block';
                cropOverlay.style.display = 'block';
                editorArea.style.height = 'auto';
            };
        });

        // Slider Updates
        startSlider.addEventListener('input', () => {
            if (parseFloat(startSlider.value) >= parseFloat(endSlider.value)) {
                startSlider.value = endSlider.value - 1;
            }
            startVal.innerText = parseFloat(startSlider.value).toFixed(1) + "s";
            videoPreview.currentTime = startSlider.value;
        });

        endSlider.addEventListener('input', () => {
            if (parseFloat(endSlider.value) <= parseFloat(startSlider.value)) {
                endSlider.value = parseFloat(startSlider.value) + 1;
            }
            endVal.innerText = parseFloat(endSlider.value).toFixed(1) + "s";
        });

        // --- Visual Crop Box Logic (Drag & Resize) ---
        cropBox.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            startX = touch.clientX;
            startY = touch.clientY;
            
            // Check if resizing (corner)
            if(e.target === cropBox) {
                isDragging = true;
            } else {
                isResizing = true;
            }
            
            startLeft = cropBox.offsetLeft;
            startTop = cropBox.offsetTop;
            startWidth = cropBox.offsetWidth;
            startHeight = cropBox.offsetHeight;
        });

        // Add a drag handle in the corner
        cropBox.innerHTML = '<div style="position:absolute; bottom:0; right:0; width:20px; height:20px; background:transparent;"></div>';

        cropOverlay.addEventListener('touchmove', (e) => {
            if(!isDragging && !isResizing) return;
            e.preventDefault();
            const touch = e.touches[0];
            const dx = touch.clientX - startX;
            const dy = touch.clientY - startY;

            if (isDragging) {
                cropBox.style.left = (startLeft + dx) + 'px';
                cropBox.style.top = (startTop + dy) + 'px';
            } else if (isResizing) {
                let newWidth = startWidth + dx;
                let newHeight = startHeight + dy;
                if (newWidth > 50) cropBox.style.width = newWidth + 'px';
                if (newHeight > 50) cropBox.style.height = newHeight + 'px';
            }
        });

        cropOverlay.addEventListener('touchend', () => {
            isDragging = false;
            isResizing = false;
        });

        // --- Video Processing ---
        async function processVideo() {
            const start = parseFloat(startSlider.value);
            const end = parseFloat(endSlider.value);

            if (end <= start) {
                alert("End time must be greater than Start time!");
                return;
            }

            processBtn.disabled = true;
            statusDiv.innerText = "Processing... Please wait";
            videoPreview.muted = true; // Audio issues on mobile
            
            // Calculate crop ratios based on video display size vs actual resolution
            const videoRect = videoPreview.getBoundingClientRect();
            const boxRect = cropBox.getBoundingClientRect();
            
            const scaleX = videoPreview.videoWidth / videoRect.width;
            const scaleY = videoPreview.videoHeight / videoRect.height;

            const cw = boxRect.width * scaleX;
            const ch = boxRect.height * scaleY;
            const cx = (boxRect.left - videoRect.left) * scaleX;
            const cy = (boxRect.top - videoRect.top) * scaleY;

            canvas.width = cw;
            canvas.height = ch;

            const stream = canvas.captureStream(30);
            
            // Audio support (works on some browsers)
            try {
                const audioCtx = new AudioContext();
                const source = audioCtx.createMediaElementSource(videoPreview);
                const dest = audioCtx.createMediaStreamDestination();
                source.connect(dest);
                source.connect(audioCtx.destination);
                const audioTrack = dest.stream.getAudioTracks()[0];
                if (audioTrack) stream.addTrack(audioTrack);
            } catch(e) { console.log("Audio capture not supported on this browser"); }

            const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            const chunks = [];

            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'SEAOX_Edited.webm';
                a.click();
                statusDiv.innerText = "Video Downloaded!";
                processBtn.disabled = false;
            };

            videoPreview.currentTime = start;
            await videoPreview.play();
            mediaRecorder.start();

            function drawFrame() {
                if (videoPreview.currentTime >= end || videoPreview.ended) {
                    mediaRecorder.stop();
                    videoPreview.pause();
                    return;
                }
                ctx.drawImage(videoPreview, cx, cy, cw, ch, 0, 0, cw, ch);
                requestAnimationFrame(drawFrame);
            }
            drawFrame();
        }
    </script>
</body>
</html>
