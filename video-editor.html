<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEAOX - Pro Video Editor</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    
    <!-- 100+ Fonts Load -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Open+Sans&family=Lato&family=Montserrat&family=Oswald&family=Raleway&family=Poppins&family=Merriweather&family=Playfair+Display&family=Nunito&family=Ubuntu&family=Rubik&family=Quicksand&family=Barlow&family=Josefin+Sans&family=Teko&family=Dancing+Script&family=Pacifico&family=Caveat&family=Indie+Flower&family=Great+Vibes&family=Lobster&family=Righteous&family=Permanent+Marker&family=Anton&family=Bebas+Neue&family=Comfortaa&family=Kanit&family=Lora&family=Alfa+Slab+One&family=Archivo+Black&family=Bangers&family=Berkshire+Swash&family=Bungee&family=Chivo&family=Cinzel&family=Creepster&family=Domine&family=Dosis&family=Fjalla+One&family=Fredoka+One&family=Gloria+Hallelujah&family=Gochi+Hand&family=Gothic+A1&family=Handlee&family=Heebo&family=Josefin+Slab&family=Kalam&family=Lobster+Two&family=Marck+Script&family=Monoton&family=Neucha&family=Oleo+Script&family=Oxygen&family=Parisienne&family=Patrick+Hand&family=Philosopher&family=Play&family=Questrial&family=Rokkitt&family=Russo+One&family=Signika&family=Special+Elite&family=Sriracha&family=Tangerine&family=Ubuntu+Mono&family=Unica+One&family=Varela+Round&family=Vollkorn&family=VT323&family=Yellowtail&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 10px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .header { width: 100%; max-width: 600px; display: flex; align-items: center; margin-bottom: 10px; }
        .back-btn { font-size: 24px; color: #fff; text-decoration: none; margin-right: 15px; }
        .title { font-size: 18px; font-weight: bold; }

        .editor-container { position: relative; width: 100%; max-width: 600px; background: #000; border-radius: 10px; overflow: hidden; display: flex; justify-content: center; align-items: center; min-height: 200px; }
        video { width: 100%; max-height: 35vh; display: block; }
        
        .draggable { position: absolute; cursor: move; touch-action: none; display: none; }
        #imageOverlay { width: 80px; height: auto; z-index: 10; }
        #textOverlay { color: white; font-size: 24px; font-weight: bold; z-index: 11; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); pointer-events: none; }
        
        /* 🎬 TIMELINE UI 🎬 */
        .timeline-container { width: 100%; max-width: 600px; margin-top: 10px; background: #1e1e1e; border-radius: 8px; padding: 5px; position: relative; overflow: hidden; display: none; }
        .timeline-scroll { display: flex; overflow-x: auto; position: relative; height: 50px; scrollbar-width: none; }
        .timeline-scroll::-webkit-scrollbar { display: none; }
        .timeline-frame { height: 100%; min-width: 60px; border-right: 1px solid #333; object-fit: cover; opacity: 0.6; }
        .playhead { position: absolute; top: 0; bottom: 0; width: 3px; background: #E91E63; left: 0; z-index: 5; box-shadow: 0 0 5px #E91E63; pointer-events: none; }
        .playhead::before { content: ''; position: absolute; top: 0; left: -5px; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid #E91E63; }

        .controls-panel { width: 100%; max-width: 600px; background: #1e1e1e; margin-top: 10px; border-radius: 10px; padding: 15px; display: none; flex-direction: column; gap: 12px; max-height: 40vh; overflow-y: auto; }
        
        .tabs { display: flex; gap: 10px; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 10px; overflow-x: auto; }
        .tab-btn { background: #333; color: #aaa; border: none; padding: 8px 12px; border-radius: 5px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: #E91E63; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: flex; flex-direction: column; gap: 10px; }

        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 12px; color: #aaa; display: flex; justify-content: space-between; }
        input[type="range"] { width: 100%; accent-color: #E91E63; }
        input[type="text"], input[type="file"], select { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #2a2a2a; color: white; font-family: inherit; }
        
        .checkbox-group { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: bold; }
        input[type="checkbox"] { width: 20px; height: 20px; accent-color: #00A859; }

        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; background: #00A859; color: white; margin-top: 10px; transition: 0.3s; }
        .btn:disabled { background: #555; }
        
        .upload-btn { background: #2C3E50; color: white; padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; width: 100%; font-weight: bold; display: block; border: 1px dashed #666; }
        
        #status { font-size: 13px; font-weight: bold; color: #FF9800; text-align: center; margin-top: 10px; }

        /* Font Search & List */
        .font-search-box { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #2a2a2a; color: white; margin-bottom: 5px; }
        .font-list-container { height: 120px; overflow-y: auto; background: #111; border-radius: 5px; border: 1px solid #333; }
        .font-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #222; color: white; }
        .font-item:hover { background: #333; }
        .font-item.selected { background: #E91E63; color: white; }
    </style>
</head>
<body>

    <div class="header">
        <a href="menu.html" class="back-btn">←</a>
        <div class="title">Pro Video Editor</div>
    </div>

    <input type="file" id="videoInput" accept="video/*">
    <label for="videoInput" class="upload-btn" id="uploadLabel">📂 Select Video</label>

    <div class="editor-container" id="editorArea">
        <video id="videoPreview" playsinline></video>
        <img id="imageOverlay" class="draggable" src="" alt="Overlay">
        <div id="textOverlay" class="draggable">Sample Text</div>
    </div>

    <!-- 🎬 TIMELINE UI 🎬 -->
    <div class="timeline-container" id="timelineContainer">
        <div class="timeline-scroll" id="timelineScroll">
            <!-- Frames will be injected here -->
            <div class="playhead" id="playhead"></div>
        </div>
    </div>

    <div class="controls-panel" id="controlsPanel">
        
        <div class="tabs">
            <button class="tab-btn active" onclick="openTab('trim')">✂️ Trim</button>
            <button class="tab-btn" onclick="openTab('audio')">🔊 Audio</button>
            <button class="tab-btn" onclick="openTab('image')">🖼️ Logo</button>
            <button class="tab-btn" onclick="openTab('text')">🔤 Text</button>
        </div>

        <!-- TRIM TAB -->
        <div id="tab-trim" class="tab-content active">
            <div class="input-group">
                <label><span>Start Time</span> <span id="startVal">0.0s</span></label>
                <input type="range" id="startSlider" min="0" max="100" value="0" step="0.1">
            </div>
            <div class="input-group">
                <label><span>End Time</span> <span id="endVal">0.0s</span></label>
                <input type="range" id="endSlider" min="0" max="100" value="100" step="0.1">
            </div>
            <p style="font-size: 11px; color: #aaa;">*Timeline par click karke bhi video ko aage peeche kar sakte hain.</p>
        </div>

        <!-- AUDIO TAB -->
        <div id="tab-audio" class="tab-content">
            <label class="checkbox-group">
                <input type="checkbox" id="includeAudio" checked>
                Include Original Audio
            </label>
            <p style="font-size: 11px; color: #888;">*Agar video mein aawaz hai, toh record hone ke liye isko tick rakhein.</p>
        </div>

        <!-- IMAGE TAB -->
        <div id="tab-image" class="tab-content">
            <input type="file" id="imageInput" accept="image/*">
            <label for="imageInput" class="upload-btn" style="padding: 10px; margin-bottom: 10px;">🖼️ Upload Logo</label>
            <div id="imageControls" style="display: none;">
                <div class="input-group">
                    <label>Logo Show at: <span id="imgStartVal">0</span>s</label>
                    <input type="range" id="imgStartTime" min="0" max="100" value="0">
                </div>
                <div class="input-group">
                    <label>Logo Hide at: <span id="imgEndVal">5</span>s</label>
                    <input type="range" id="imgEndTime" min="0" max="100" value="5">
                </div>
            </div>
        </div>

        <!-- TEXT TAB -->
        <div id="tab-text" class="tab-content">
            <input type="text" id="textInput" placeholder="Type text here..." oninput="updateText()">
            <input type="text" id="fontSearch" class="font-search-box" placeholder="Search font..." oninput="filterFonts()">
            <div id="fontList" class="font-list-container"></div>
            <input type="hidden" id="fontFamily" value="Arial">
            
            <div style="display: flex; gap: 10px; align-items: center; margin-top: 10px;">
                <input type="color" id="textColor" value="#ffffff" onchange="updateText()" style="width: 50px; padding: 2px;">
                <input type="range" id="textSize" min="10" max="100" value="30" oninput="updateText()">
            </div>

            <div id="textControls" style="display: none; margin-top: 10px;">
                <div class="input-group">
                    <label>Text Show at: <span id="txtStartVal">0</span>s</label>
                    <input type="range" id="txtStartTime" min="0" max="100" value="0">
                </div>
                <div class="input-group">
                    <label>Text Hide at: <span id="txtEndVal">5</span>s</label>
                    <input type="range" id="txtEndTime" min="0" max="100" value="5">
                </div>
            </div>
        </div>

        <button class="btn" id="processBtn" onclick="processVideo()">✂️ Process & Download</button>
        <div id="status"></div>
    </div>

    <canvas id="hiddenCanvas" style="display:none;"></canvas>

    <script>
        // --- Elements ---
        const videoInput = document.getElementById('videoInput');
        const videoPreview = document.getElementById('videoPreview');
        const controlsPanel = document.getElementById('controlsPanel');
        const timelineContainer = document.getElementById('timelineContainer');
        const timelineScroll = document.getElementById('timelineScroll');
        const playhead = document.getElementById('playhead');
        
        const startSlider = document.getElementById('startSlider');
        const endSlider = document.getElementById('endSlider');
        const startVal = document.getElementById('startVal');
        const endVal = document.getElementById('endVal');
        
        const imageInput = document.getElementById('imageInput');
        const imageOverlay = document.getElementById('imageOverlay');
        const imgStartTime = document.getElementById('imgStartTime');
        const imgEndTime = document.getElementById('imgEndTime');
        const imageControls = document.getElementById('imageControls');

        const textInput = document.getElementById('textInput');
        const textOverlay = document.getElementById('textOverlay');
        const txtStartTime = document.getElementById('txtStartTime');
        const txtEndTime = document.getElementById('txtEndTime');
        const textControls = document.getElementById('textControls');
        
        let videoDuration = 0;
        let overlayImg = null;

        // --- Tabs Logic ---
        function openTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            event.target.classList.add('active');
        }

        // --- Video Load & Timeline Generation ---
        videoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const url = URL.createObjectURL(file);
            videoPreview.src = url;
            
            videoPreview.onloadedmetadata = function() {
                videoDuration = videoPreview.duration;
                startSlider.max = videoDuration;
                endSlider.max = videoDuration;
                endSlider.value = videoDuration;
                
                imgStartTime.max = videoDuration; imgEndTime.max = videoDuration;
                imgEndTime.value = videoDuration;
                txtStartTime.max = videoDuration; txtEndTime.max = videoDuration;
                txtEndTime.value = videoDuration;

                startVal.innerText = "0.0s";
                endVal.innerText = videoDuration.toFixed(1) + "s";
                
                controlsPanel.style.display = 'flex';
                timelineContainer.style.display = 'block'; // Show Timeline
                document.getElementById('uploadLabel').innerText = "Change Video";

                generateTimeline(); // Call timeline generator
            };
        });

        // TIMELINE GENERATION (Thumbnails)
        async function generateTimeline() {
            const scrollContainer = document.getElementById('timelineScroll');
            // Clear old frames but keep playhead
            Array.from(scrollContainer.children).forEach(child => {
                if(child.id !== 'playhead') child.remove();
            });

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 160; // Thumbnail width
            canvas.height = 90; // Thumbnail height

            const totalFrames = 10; // Generate 10 thumbnails
            const interval = videoDuration / totalFrames;

            for(let i=0; i<totalFrames; i++) {
                const time = i * interval;
                
                // Create a promise to wait for video seeking
                await new Promise(resolve => {
                    videoPreview.currentTime = time;
                    videoPreview.onseeked = resolve;
                });

                ctx.drawImage(videoPreview, 0, 0, canvas.width, canvas.height);
                const dataUrl = canvas.toDataURL('image/jpeg');
                
                const img = document.createElement('img');
                img.src = dataUrl;
                img.className = 'timeline-frame';
                scrollContainer.appendChild(img);
            }
            
            // Reset video to start
            videoPreview.currentTime = 0;
        }

        // --- Timeline Playhead Movement ---
        videoPreview.addEventListener('timeupdate', () => {
            if(videoDuration > 0) {
                const percent = videoPreview.currentTime / videoDuration;
                playhead.style.left = (percent * 100) + '%';
                
                // Auto scroll timeline
                const scrollWidth = timelineScroll.scrollWidth;
                const clientWidth = timelineScroll.clientWidth;
                const scrollPos = (percent * scrollWidth) - (clientWidth / 2);
                timelineScroll.scrollLeft = scrollPos;
            }
        });

        // Click on timeline to seek
        timelineScroll.addEventListener('click', (e) => {
            const rect = timelineScroll.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percent = clickX / rect.width;
            videoPreview.currentTime = percent * videoDuration;
        });

        // --- Sliders Update ---
        startSlider.addEventListener('input', () => {
            if (parseFloat(startSlider.value) >= parseFloat(endSlider.value)) startSlider.value = endSlider.value - 1;
            startVal.innerText = parseFloat(startSlider.value).toFixed(1) + "s";
            videoPreview.currentTime = startSlider.value;
        });
        endSlider.addEventListener('input', () => {
            if (parseFloat(endSlider.value) <= parseFloat(startSlider.value)) endSlider.value = parseFloat(startSlider.value) + 1;
            endVal.innerText = parseFloat(endSlider.value).toFixed(1) + "s";
        });
        
        // Overlay Time Sliders
        imgStartTime.addEventListener('input', () => document.getElementById('imgStartVal').innerText = imgStartTime.value);
        imgEndTime.addEventListener('input', () => document.getElementById('imgEndVal').innerText = imgEndTime.value);
        txtStartTime.addEventListener('input', () => document.getElementById('txtStartVal').innerText = txtStartTime.value);
        txtEndTime.addEventListener('input', () => document.getElementById('txtEndVal').innerText = txtEndTime.value);

        // --- Image Overlay Load ---
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                overlayImg = new Image();
                overlayImg.src = event.target.result;
                imageOverlay.src = event.target.result;
                imageOverlay.style.display = 'block';
                imageOverlay.style.left = '10px';
                imageOverlay.style.top = '10px';
                imageControls.style.display = 'block';
                makeDraggable(imageOverlay);
            };
            reader.readAsDataURL(file);
        });

        // --- Text Overlay & Fonts ---
        function updateText() {
            const txt = textInput.value || "Sample Text";
            textOverlay.innerText = txt;
            textOverlay.style.color = document.getElementById('textColor').value;
            textOverlay.style.fontSize = document.getElementById('textSize').value + "px";
            textOverlay.style.fontFamily = `'${document.getElementById('fontFamily').value}', sans-serif`;
            
            if(txt.length > 0) {
                textOverlay.style.display = 'block';
                textControls.style.display = 'block';
            } else {
                textOverlay.style.display = 'none';
                textControls.style.display = 'none';
            }
        }

        const fontList = [
            "Arial", "Roboto", "Open Sans", "Lato", "Montserrat", "Oswald", "Raleway", "Poppins", "Merriweather", 
            "Playfair Display", "Nunito", "Ubuntu", "Rubik", "Quicksand", "Barlow", "Josefin Sans", "Mukta", 
            "Teko", "Dancing Script", "Pacifico", "Caveat", "Indie Flower", "Shadows Into Light", "Great Vibes", 
            "Satisfy", "Lobster", "Righteous", "Permanent Marker", "Amatic SC", "Anton", "Bebas Neue", "Comfortaa", 
            "Exo 2", "Fira Sans", "Gloria Hallelujah", "Inconsolata", "Jura", "Kanit", "Kaushan Script", 
            "Libre Baskerville", "Lora", "Maven Pro", "Merienda", "Nova Mono", "Orbitron", "Patua One", 
            "Prompt", "Prosto One", "Sacramento", "Space Mono", "Spectral", "Titillium Web", "Yeseva One",
            "Alfa Slab One", "Archivo Black", "Bangers", "Berkshire Swash", "Bungee", "Chivo", "Cinzel", 
            "Creepster", "Domine", "Dosis", "Fjalla One", "Fredoka One", "Gochi Hand", "Gothic A1", "Handlee", 
            "Heebo", "Josefin Slab", "Kalam", "Lobster Two", "Marck Script", "Monoton", "Neucha", "Oleo Script", 
            "Oxygen", "Parisienne", "Patrick Hand", "Philosopher", "Play", "Questrial", "Rokkitt", "Russo One", 
            "Signika", "Special Elite", "Sriracha", "Tangerine", "Ubuntu Mono", "Unica One", "Varela Round", 
            "Vollkorn", "VT323", "Yellowtail"
        ];

        function renderFontList(filterText = "") {
            const container = document.getElementById('fontList');
            container.innerHTML = '';
            
            fontList.forEach(font => {
                if(font.toLowerCase().includes(filterText.toLowerCase())) {
                    const div = document.createElement('div');
                    div.className = 'font-item';
                    div.style.fontFamily = `'${font}', sans-serif`;
                    div.innerText = font;
                    div.onclick = () => {
                        document.getElementById('fontFamily').value = font;
                        document.querySelectorAll('.font-item').forEach(el => el.classList.remove('selected'));
                        div.classList.add('selected');
                        updateText();
                    };
                    container.appendChild(div);
                }
            });
        }
        renderFontList();

        function filterFonts() {
            renderFontList(document.getElementById('fontSearch').value);
        }

        // --- Drag Functionality ---
        function makeDraggable(elmnt) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            elmnt.onmousedown = dragMouseDown;
            elmnt.ontouchstart = dragMouseDown;

            function dragMouseDown(e) {
                e = e || window.event;
                e.preventDefault();
                pos3 = e.touches ? e.touches[0].clientX : e.clientX;
                pos4 = e.touches ? e.touches[0].clientY : e.clientY;
                document.onmouseup = closeDragElement;
                document.ontouchend = closeDragElement;
                document.onmousemove = elementDrag;
                document.ontouchmove = elementDrag;
            }

            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                pos1 = pos3 - clientX;
                pos2 = pos4 - clientY;
                pos3 = clientX;
                pos4 = clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
                document.ontouchend = null;
                document.ontouchmove = null;
            }
        }
        makeDraggable(textOverlay);

        // --- VIDEO PROCESSING ---
        async function processVideo() {
            const start = parseFloat(startSlider.value);
            const end = parseFloat(endSlider.value);
            const keepAudio = document.getElementById('includeAudio').checked;
            
            if (end <= start) { alert("End time > Start time"); return; }

            const processBtn = document.getElementById('processBtn');
            const statusDiv = document.getElementById('status');
            processBtn.disabled = true;
            statusDiv.innerText = "Processing... Please wait";

            const canvas = document.getElementById('hiddenCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = videoPreview.videoWidth;
            canvas.height = videoPreview.videoHeight;

            const stream = canvas.captureStream(30);
            
            if (keepAudio) {
                try {
                    const audioCtx = new AudioContext();
                    const source = audioCtx.createMediaElementSource(videoPreview);
                    const dest = audioCtx.createMediaStreamDestination();
                    source.connect(dest);
                    source.connect(audioCtx.destination);
                    const audioTrack = dest.stream.getAudioTracks()[0];
                    if (audioTrack) stream.addTrack(audioTrack);
                } catch(e) { console.log("Audio capture error"); }
            }

            const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            const chunks = [];

            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'SEAOX_Edited.webm';
                a.click();
                statusDiv.innerText = "Download Complete!";
                processBtn.disabled = false;
            };

            videoPreview.currentTime = start;
            videoPreview.muted = !keepAudio;
            await videoPreview.play();
            mediaRecorder.start();

            const videoRect = videoPreview.getBoundingClientRect();
            const imgRect = imageOverlay.getBoundingClientRect();
            const txtRect = textOverlay.getBoundingClientRect();

            const scaleX = canvas.width / videoRect.width;
            const scaleY = canvas.height / videoRect.height;

            const imgX = (imgRect.left - videoRect.left) * scaleX;
            const imgY = (imgRect.top - videoRect.top) * scaleY;
            const imgW = imgRect.width * scaleX;
            const imgH = imgRect.height * scaleY;

            const txtX = (txtRect.left - videoRect.left) * scaleX;
            const txtY = (txtRect.top - videoRect.top) * scaleY;

            function drawFrame() {
                if (videoPreview.currentTime >= end || videoPreview.ended) {
                    mediaRecorder.stop();
                    videoPreview.pause();
                    return;
                }

                ctx.drawImage(videoPreview, 0, 0, canvas.width, canvas.height);

                if(overlayImg && videoPreview.currentTime >= parseFloat(imgStartTime.value) && videoPreview.currentTime <= parseFloat(imgEndTime.value)) {
                    ctx.drawImage(overlayImg, imgX, imgY, imgW, imgH);
                }

                if(textInput.value && videoPreview.currentTime >= parseFloat(txtStartTime.value) && videoPreview.currentTime <= parseFloat(txtEndTime.value)) {
                    const fontSize = parseInt(document.getElementById('textSize').value) * scaleY;
                    ctx.font = `bold ${fontSize}px "${document.getElementById('fontFamily').value}", sans-serif`;
                    ctx.fillStyle = document.getElementById('textColor').value;
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'top';
                    ctx.shadowColor = 'rgba(0,0,0,0.8)';
                    ctx.shadowBlur = 5;
                    ctx.shadowOffsetX = 2;
                    ctx.shadowOffsetY = 2;
                    ctx.fillText(textInput.value, txtX, txtY);
                    ctx.shadowColor = 'transparent';
                }

                requestAnimationFrame(drawFrame);
            }
            drawFrame();
        }
    </script>
</body>
</html>
