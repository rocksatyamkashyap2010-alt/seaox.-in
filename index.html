<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEAOX - Welcome</title>
    <!-- Favicon (Tab wala chhota logo) -->
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <style>
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; position: relative; overflow: hidden; }
        .container { text-align: center; z-index: 2; }
        
        /* Naya Lamba Logo */
        .logo-img { 
            width: 300px; 
            mix-blend-mode: multiply; /* White background hatayega */
            margin-bottom: 5px;
        }
        
        .welcome { font-size: 28px; color: #333; margin-top: 0px; font-weight: 400; letter-spacing: 1px; }
        .dots { margin-top: 20px; display: flex; justify-content: center; gap: 10px; }
        .dot { width: 12px; height: 12px; background-color: #0066FF; border-radius: 50%; opacity: 0.3; }
        .dot:nth-child(1) { animation: pulse 1.5s infinite; }
        .dot:nth-child(2) { animation: pulse 1.5s infinite 0.5s; }
        .dot:nth-child(3) { animation: pulse 1.5s infinite 1s; }
        @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
        .wave { position: absolute; bottom: -50px; left: -50px; width: 200%; height: 200px; background: #E8F5E9; border-radius: 45%; z-index: 1; animation: rotate 10s linear infinite; }
        .wave2 { position: absolute; bottom: -60px; left: -50px; width: 200%; height: 200px; background: #C8E6C9; border-radius: 40%; z-index: 0; animation: rotate 15s linear infinite reverse; }
        @keyframes rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <!-- Yahan naya logo laga hai -->
        <img src="IMG_20261006_211924.png" alt="SEAOX Logo" class="logo-img">
        <div class="welcome">Welcome</div>
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
    <div class="wave2"></div>
    <div class="wave"></div>
    <script>
        setTimeout(function() {
            window.location.href = 'menu.html';
        }, 3000);
    </script>
</body>
</html>
