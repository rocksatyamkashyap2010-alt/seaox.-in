<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SEAOX - Smart Tools & Apps</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    
    <!-- 🔥 GOOGLE SEARCH KE LIYE DESCRIPTION 🔥 -->

    <meta name="keywords" content="SEAOX, PDF Maker, Video Editor, Tractor Book, Photo Compressor, Smart Calculator, QR Maker, Shivam Kashyap, Satyam Kashyap">

    <!-- 🔥 GOOGLE KE LIYE COMPANY, OWNER & CONTACT DETAILS (Schema Markup) 🔥 -->

    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "SEAOX",
      "url": "https://seaox.in",
      "logo": "https://seaox.in/IMG_20261019_105230.jpg",
      "description": "SEAOX is a digital solutions and technology provider specializing in website development, mobile app creation, custom software development, logo and brand identity design, and AI automation.",
      "email": "seaoxseaox@gmail.com",
      "telephone": "+91-9473991699",
      "founder": [
        {
          "@type": "Person",

          "jobTitle": "CEO"
        },
        {
          "@type": "Person",
          "name": "Satyam Kashyap",
          "jobTitle": "Director Head"
        }
      ],
      "sameAs": [
        "https://www.instagram.com/seaoxofficial",
        "https://x.com/seaoxoffcial",

      ]
    }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #040814; /* Deep Dark Blue */
            height: 100vh;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            position: relative;
        }

        /* Background Glowing Effects */
        .bg-glow-1, .bg-glow-2 {
            position: absolute;
            width: 200vw;
            height: 200vw;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.4;
        }
        .bg-glow-1 {
            top: -100vw;
            left: -50vw;
            background: radial-gradient(circle, rgba(0,229,255,0.4) 0%, transparent 60%);
        }
        .bg-glow-2 {
            bottom: -100vw;
            right: -50vw;
            background: radial-gradient(circle, rgba(157,0,255,0.3) 0%, transparent 60%);
        }

        /* Main Container - Welcome Screen */
        .container {
            z-index: 2;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: opacity 0.5s ease;
        }

        /* Fade out class for welcome screen */
        .fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* S Logo Image */
        .s-logo {
            width: 120px;
            height: 120px;
            border-radius: 28px;
            object-fit: cover;
            box-shadow: 0 10px 40px rgba(0, 229, 255, 0.4), 0 10px 40px rgba(157, 0, 255, 0.4);
            margin-bottom: 20px;
            animation: logoFloat 3s ease-in-out infinite alternate;
        }
        @keyframes logoFloat {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        /* Transparent Text Logo */
        .brand-logo-img {
            width: 250px; 
            max-width: 85%;
            margin-bottom: 20px;
            filter: brightness(1.5) drop-shadow(0 0 10px rgba(0, 229, 255, 0.5));
        }

        /* Welcome Text */
        .welcome-title {
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 10px;
        }
        .welcome-title span {
            display: block;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #00e5ff, #9d00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Tagline */
        .tagline {
            color: #a0b0d0;
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            margin-bottom: 40px;
        }

        /* Glowing Dots */
        .dots {
            display: flex;
            gap: 15px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        .dot:nth-child(1) { background-color: #00e5ff; box-shadow: 0 0 15px #00e5ff; }
        .dot:nth-child(2) { background-color: #1877F2; box-shadow: 0 0 15px #1877F2; animation-delay: 0.3s; }
        .dot:nth-child(3) { background-color: #9d00ff; box-shadow: 0 0 15px #9d00ff; animation-delay: 0.6s; }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }

        /* ========================================= */
        /* 🔥 NAYA ANIMATION SECTION (Black Screen, Boy, Torch) 🔥 */
        /* ========================================= */
        
        .transition-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #000;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .show-black {
            opacity: 1;
            pointer-events: auto;
            transition: opacity 0.4s ease;
        }

        /* Ladke ki Image */
        .boy-img {
            height: 55vh;
            width: auto;
            opacity: 0;
            transform: translateY(20px);
            z-index: 101;
        }

        /* Hi Text */
        .hi-text {
            position: absolute;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            top: 20%;
            opacity: 0;
            transform: scale(0.5);
            z-index: 102;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }

        /* Torch Light Effect */
        .torch-glow {
            position: absolute;
            top: 50%; left: 50%;
            width: 10px; height: 10px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 100px 150px #fff;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0);
            z-index: 103;
        }

        /* Animation Classes to trigger via JS */
        .animate-boy {
            animation: boyIn 0.6s ease forwards;
        }
        @keyframes boyIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-hi {
            animation: hiPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes hiPop {
            to { opacity: 1; transform: scale(1); }
        }

        .animate-torch {
            animation: torchExpand 1.2s ease-in forwards;
        }
        @keyframes torchExpand {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(5); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(50); background-color: #fff; }
        }

    </style>
</head>
<body>

    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <!-- 1. WELCOME SCREEN -->
    <div class="container" id="mainContainer">
        <img src="IMG_20261019_105230.jpg" alt="SEAOX Logo" class="s-logo">
        <img src="1000060185-removebg-preview.png" alt="SEAOX Text" class="brand-logo-img">
        
        <div class="welcome-title">
            Welcome to
            <span>SEAOX</span>
        </div>
        
        <div class="tagline">Smart tools. Simple solutions.</div>
        
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <!-- 2. TRANSITION SCREEN (LADKA + TORCH) -->
    <div class="transition-screen" id="transitionScreen">
        <!-- Yahan tu apne ladke ki image ka naam dalna (PNG hona chahiye) -->
        <img src="boy-transparent.png" alt="Boy" class="boy-img" id="boyImg">
        <div class="hi-text" id="hiText">Hi!</div>
        <div class="torch-glow" id="torchGlow"></div>
    </div>

    <!-- 3. JAVASCRIPT LOGIC (4 Second Timing) -->
    <script>
        // 1. Welcome Screen ko 2 second (2000ms) dikhao
        setTimeout(function() {
            // Welcome screen fade out karo
            document.getElementById('mainContainer').classList.add('fade-out');
            
            // Black screen show karo
            const transScreen = document.getElementById('transitionScreen');
            transScreen.classList.add('show-black');

            // 2. Ladke ko 2.2 second par laao (Black screen ke thik baad)
            setTimeout(() => {
                document.getElementById('boyImg').classList.add('animate-boy');
            }, 200);

            // 3. "Hi" text ko 2.6 second par dikhao
            setTimeout(() => {
                document.getElementById('hiText').classList.add('animate-hi');
            }, 600);

            // 4. Torch Light ko 3.0 second par chalao
            setTimeout(() => {
                document.getElementById('torchGlow').classList.add('animate-torch');
            }, 1000);

            // 5. Exact 4 second (4000ms) par Menu page par redirect karo
            setTimeout(() => {
                window.location.href = 'menu.html';
            }, 2000); // 2s welcome + 2s animation = 4s total

        }, 2000); 
    </script>
</body>
</html>
