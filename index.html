<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Welcome to SEAOX</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #040814; /* Deep Dark Blue */
            height: 100vh;
            overflow: hidden; /* Slide hone par scrollbar na aaye */
            font-family: 'Poppins', sans-serif;
            position: relative;
        }

        /* Background Glowing Effects */
        .bg-glow-1, .bg-glow-2 {
            position: absolute;
            width: 200vw;
            height: 200vw;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.4;
        }
        .bg-glow-1 {
            top: -100vw;
            left: -50vw;
            background: radial-gradient(circle, rgba(0,229,255,0.4) 0%, transparent 60%);
        }
        .bg-glow-2 {
            bottom: -100vw;
            right: -50vw;
            background: radial-gradient(circle, rgba(157,0,255,0.3) 0%, transparent 60%);
        }

        /* Main Container - Full width/height for sliding */
        .container {
            z-index: 2;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            
            /* 🔥 SLIDE ANIMATION SETUP: 2 Second ka smooth slide */
            transition: transform 2s cubic-bezier(0.65, 0, 0.35, 1);
        }

        /* 🔥 Class to trigger the slide left */
        .slide-out {
            transform: translateX(-100vw);
        }

        /* S Logo Image */
        .s-logo {
            width: 120px;
            height: 120px;
            border-radius: 28px;
            object-fit: cover;
            box-shadow: 0 10px 40px rgba(0, 229, 255, 0.4), 0 10px 40px rgba(157, 0, 255, 0.4);
            margin-bottom: 20px;
            animation: logoFloat 3s ease-in-out infinite alternate;
        }
        @keyframes logoFloat {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        /* Transparent Text Logo */
        .brand-logo-img {
            width: 250px; 
            max-width: 85%;
            margin-bottom: 20px;
            filter: brightness(1.5) drop-shadow(0 0 10px rgba(0, 229, 255, 0.5));
        }

        /* Welcome Text */
        .welcome-title {
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 10px;
        }
        .welcome-title span {
            display: block;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #00e5ff, #9d00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Tagline */
        .tagline {
            color: #a0b0d0;
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            margin-bottom: 40px;
        }

        /* Glowing Dots */
        .dots {
            display: flex;
            gap: 15px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        .dot:nth-child(1) {
            background-color: #00e5ff; 
            box-shadow: 0 0 15px #00e5ff;
        }
        .dot:nth-child(2) {
            background-color: #1877F2; 
            box-shadow: 0 0 15px #1877F2;
            animation-delay: 0.3s;
        }
        .dot:nth-child(3) {
            background-color: #9d00ff; 
            box-shadow: 0 0 15px #9d00ff;
            animation-delay: 0.6s;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="container" id="mainContainer">
        
        <!-- S Icon Logo -->
        <img src="IMG_20261019_105230.jpg" alt="SEAOX S Logo" class="s-logo">
        
        <!-- Nayi Transparent SEAOX Text Logo -->
        <img src="1000060185-removebg-preview.png" alt="SEAOX Text Logo" class="brand-logo-img">
        
        <div class="welcome-title">
            Welcome to
            <span>SEAOX</span>
        </div>
        
        <div class="tagline">Smart tools. Simple solutions.</div>
        
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

    </div>

    <script>
        // Page load hone ke 2.5 second baad slide trigger hoga
        setTimeout(function() {
            // Slide left class add karo
            document.getElementById('mainContainer').classList.add('slide-out');
            
            // 2 second (2000ms) ka wait karo jab tak slide poora ho jaye, phir menu kholo
            setTimeout(function() {
                window.location.href = 'menu.html';
            }, 2000); 

        }, 2500); 
    </script>
</body>
</html>
