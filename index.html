<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SEAOX - Smart Tools & Apps</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #040814;
            height: 100vh;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            position: relative;
        }

        /* === 1. WELCOME SCREEN === */
        .bg-glow-1, .bg-glow-2 {
            position: absolute; width: 200vw; height: 200vw;
            border-radius: 50%; filter: blur(100px); z-index: 0; opacity: 0.4;
        }
        .bg-glow-1 { top: -100vw; left: -50vw; background: radial-gradient(circle, rgba(0,229,255,0.4) 0%, transparent 60%); }
        .bg-glow-2 { bottom: -100vw; right: -50vw; background: radial-gradient(circle, rgba(157,0,255,0.3) 0%, transparent 60%); }

        .welcome-container {
            z-index: 10; position: absolute; top: 0; left: 0; width: 100%; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
            transition: opacity 0.8s ease;
        }
        .fade-out { opacity: 0; pointer-events: none; }

        .s-logo {
            width: 120px; height: 120px; border-radius: 28px; object-fit: cover;
            box-shadow: 0 10px 40px rgba(0, 229, 255, 0.4), 0 10px 40px rgba(157, 0, 255, 0.4);
            margin-bottom: 20px; animation: logoFloat 3s ease-in-out infinite alternate;
        }
        @keyframes logoFloat { from { transform: translateY(0); } to { transform: translateY(-10px); } }

        .brand-logo-img { width: 250px; max-width: 85%; margin-bottom: 20px; filter: brightness(1.5) drop-shadow(0 0 10px rgba(0, 229, 255, 0.5)); }
        .welcome-title { color: #ffffff; font-size: 1.8rem; font-weight: 600; line-height: 1.2; margin-bottom: 10px; }
        .welcome-title span {
            display: block; font-size: 2rem; font-weight: 800; letter-spacing: 1px;
            background: linear-gradient(90deg, #00e5ff, #9d00ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .tagline { color: #a0b0d0; font-size: 0.9rem; margin-bottom: 40px; }
        .dots { display: flex; gap: 15px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; animation: pulse 1.5s infinite; }
        .dot:nth-child(1) { background-color: #00e5ff; box-shadow: 0 0 15px #00e5ff; }
        .dot:nth-child(2) { background-color: #1877F2; box-shadow: 0 0 15px #1877F2; animation-delay: 0.3s; }
        .dot:nth-child(3) { background-color: #9d00ff; box-shadow: 0 0 15px #9d00ff; animation-delay: 0.6s; }
        @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.5; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.8); opacity: 0.5; } }


        /* === 2. ANIMATION STAGE === */
        .animation-stage {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #000; z-index: 100;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
            opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
        }
        .animation-stage.active { opacity: 1; pointer-events: auto; }

        /* === 3. 3D LOOKING LADKA (CSS BOY) === */
        .css-boy {
            display: flex; flex-direction: column; align-items: center; position: relative;
            opacity: 0; transform: translateX(-100vw);
        }
        
        .animate-slide-in { animation: slideIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes slideIn {
            0% { opacity: 0; transform: translateX(-100vw); }
            100% { opacity: 1; transform: translateX(0); }
        }

        /* Head with 3D Gradient */
        .head {
            width: 95px; height: 95px; 
            background: radial-gradient(circle at 30% 30%, #ffe0c2, #e2a676);
            border-radius: 50%; position: relative; border: 3px solid #111; z-index: 3;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.2), 0 5px 15px rgba(0,0,0,0.5);
        }
        .hair {
            position: absolute; top: -5px; left: -5px; right: -5px; height: 50px;
            background: linear-gradient(135deg, #333, #000);
            border-radius: 45px 45px 20px 20px;
            clip-path: polygon(0% 100%, 5% 30%, 20% 50%, 40% 10%, 60% 40%, 80% 10%, 95% 40%, 100% 100%);
            box-shadow: inset 0 5px 10px rgba(255,255,255,0.2);
        }
        .eye { position: absolute; top: 45px; width: 12px; height: 14px; background: #111; border-radius: 50%; box-shadow: inset 0 2px 4px #fff; }
        .eye.left { left: 22px; }
        .eye.right { right: 22px; }
        .smile { position: absolute; bottom: 18px; left: 28px; width: 35px; height: 18px; border-bottom: 3px solid #111; border-radius: 0 0 20px 20px; }
        
        /* Torso with 3D Jacket Gradient */
        .torso {
            width: 120px; height: 140px; 
            background: linear-gradient(to right, #b71c1c, #f44336, #b71c1c); /* Red Jacket */
            border-radius: 25px; margin-top: -20px; position: relative; border: 3px solid #111; z-index: 2;
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.4), 0 10px 20px rgba(0,0,0,0.5);
        }
        .shirt-stripe {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 60px; height: 100%;
            background: repeating-linear-gradient(0deg, #fff, #fff 15px, #2ecc71 15px, #2ecc71 30px);
            border-left: 3px solid #111; border-right: 3px solid #111;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }

        /* Arms */
        .arm {
            position: absolute; width: 35px; height: 85px; 
            background: linear-gradient(to right, #b71c1c, #f44336, #b71c1c);
            border-radius: 20px; border: 3px solid #111; top: 10px;
            transform-origin: top center; transition: transform 0.5s ease; z-index: 4;
            box-shadow: inset 0 -5px 10px rgba(0,0,0,0.3);
        }
        .arm.left { left: -25px; }
        .arm.right { right: -25px; }
        .hand {
            position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%);
            width: 28px; height: 28px; background: radial-gradient(circle at 30% 30%, #ffe0c2, #e2a676);
            border-radius: 50%; border: 3px solid #111;
        }

        /* Legs */
        .legs { display: flex; gap: 15px; margin-top: -10px; z-index: 1; }
        .leg {
            width: 45px; height: 100px; background: linear-gradient(to right, #1a252f, #34495e, #1a252f);
            border-radius: 10px 10px 5px 5px; border: 3px solid #111; position: relative;
            box-shadow: inset 0 -10px 10px rgba(0,0,0,0.5);
        }
        .shoe {
            position: absolute; bottom: -15px; left: -8px; right: -8px; height: 30px;
            background: linear-gradient(to right, #d32f2f, #f44336);
            border-radius: 15px; border: 3px solid #111;
            box-shadow: 0 5px 10px rgba(0,0,0,0.6);
        }

        /* Torch */
        .torch {
            position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%) translateY(20px);
            width: 20px; height: 40px; 
            background: linear-gradient(to right, #f39c12, #f1c40f, #f39c12); 
            border-radius: 5px; border: 3px solid #111;
            opacity: 0; transition: all 0.5s ease; z-index: 5;
        }
        .torch::before {
            content: ''; position: absolute; top: -10px; left: -2px; right: -2px; height: 10px;
            background: #fff; border-radius: 5px 5px 0 0; border: 3px solid #111; border-bottom: none;
            box-shadow: 0 0 10px #fff; /* Glass glow */
        }
        .torch.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Hi Bubble (3D Effect) */
        .hi-bubble {
            position: absolute; top: -60px; right: -100px; background: #fff; color: #000;
            padding: 10px 25px; border-radius: 25px; font-weight: 900; font-size: 35px;
            font-family: 'Montserrat', sans-serif; opacity: 0; transform: scale(0);
            box-shadow: 5px 5px 0px #111; border: 3px solid #111; z-index: 10;
        }
        .hi-bubble::after {
            content: ''; position: absolute; bottom: -15px; left: 20px;
            border-width: 15px 15px 0; border-style: solid; border-color: #fff transparent transparent transparent;
            filter: drop-shadow(0 3px 0 #111);
        }

        /* Light Beam */
        .light-beam {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%) scale(0);
            width: 10px; height: 10px; background: #fff; border-radius: 50%;
            box-shadow: 0 0 80px 80px #fff; opacity: 0; z-index: 105;
        }

        /* === ANIMATION CLASSES === */
        .wave-hand { animation: wave 0.6s ease-in-out infinite alternate; }
        @keyframes wave { 0% { transform: rotate(0deg); } 100% { transform: rotate(-140deg); } }
        
        .point-torch { transform: rotate(-100deg); } 
        
        .pop-hi { animation: popHi 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popHi { 0% { opacity: 0; transform: scale(0); } 100% { opacity: 1; transform: scale(1); } }
        
        .expand-light { animation: expandLight 2.5s ease-in forwards; }
        @keyframes expandLight {
            0% { opacity: 1; transform: translateX(-50%) scale(1); }
            100% { opacity: 1; transform: translateX(-50%) scale(400); } 
        }

    </style>
</head>
<body>

    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <!-- WELCOME SCREEN -->
    <div class="welcome-container" id="welcomeScreen">
        <img src="IMG_20261019_105230.jpg" alt="SEAOX Logo" class="s-logo">
        <img src="1000060185-removebg-preview.png" alt="SEAOX Text" class="brand-logo-img">
        <div class="welcome-title">Welcome to<span>SEAOX</span></div>
        <div class="tagline">Smart tools. Simple solutions.</div>
        <div class="dots">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
    </div>

    <!-- ANIMATION STAGE -->
    <div class="animation-stage" id="animationStage">
        <div class="css-boy" id="boy">
            
            <div class="hi-bubble" id="hiBubble">Hi!</div>
            
            <!-- Head -->
            <div class="head">
                <div class="hair"></div>
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="smile"></div>
            </div>
            
            <!-- Torso -->
            <div class="torso">
                <div class="shirt-stripe"></div>
                
                <!-- Left Arm (Torch) -->
                <div class="arm left" id="leftArm">
                    <div class="hand"></div>
                    <div class="torch" id="torch">
                        <div class="light-beam" id="lightBeam"></div>
                    </div>
                </div>
                
                <!-- Right Arm (Wave) -->
                <div class="arm right" id="rightArm">
                    <div class="hand"></div>
                </div>
            </div>

            <!-- Legs -->
            <div class="legs">
                <div class="leg"><div class="shoe"></div></div>
                <div class="leg"><div class="shoe"></div></div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC (Slow & Steady Timing) -->
    <script>
        // Total Animation Time: ~9 Seconds (Taaki sab kuch araam se dikhe)
        
        setTimeout(function() {
            // 1. Welcome fade out, Black screen in
            document.getElementById('welcomeScreen').classList.add('fade-out');
            document.getElementById('animationStage').classList.add('active');
            
            // 2. 0.5s baad Ladka Left se slide hoga
            setTimeout(() => {
                document.getElementById('boy').classList.add('animate-slide-in');
            }, 500);

            // 3. 2.5s par Hath uthayega aur "Hi" bolega
            setTimeout(() => {
                document.getElementById('rightArm').classList.add('wave-hand');
                document.getElementById('hiBubble').classList.add('pop-hi');
            }, 2500);

            // 4. 4.5s par Hath niche karke torch nikalega
            setTimeout(() => {
                document.getElementById('rightArm').classList.remove('wave-hand'); 
                document.getElementById('hiBubble').style.opacity = 0; // Bubble gayab
                
                document.getElementById('torch').classList.add('show'); // Torch show
                document.getElementById('leftArm').classList.add('point-torch'); // Torch point karega
            }, 4500);

            // 5. 5.5s par Torch ON hoga (Light dheere se failna shuru)
            setTimeout(() => {
                document.getElementById('lightBeam').classList.add('expand-light');
            }, 5500);

            // 6. 8.0s par (Jab light puri screen cover kar chuki hogi), Menu page open hoga
            setTimeout(() => {
                window.location.href = 'menu.html';
            }, 8000); 

        }, 2000); // 2 second ka Welcome screen
    </script>
</body>
</html>
