<style>
@property --angle {
    syntax: "<angle>";
    initial-value: 0deg;
    inherits: false;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Inter', sans-serif;
    background: #f8f9fa;
    padding: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
}

.app-container {
    width: 100%;
    max-width: 500px;
}

/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding: 0 5px;
}

.header-logo {
    width: 120px;
    mix-blend-mode: multiply;
}

.header-icons {
    display: flex;
    gap: 8px;
}

.icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    text-decoration: none;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    opacity: 0;
    animation: popOut 0.4s cubic-bezier(0.2,0.8,0.2,1) forwards;
}

.header-icons > *:nth-child(4) { animation-delay: .1s; }
.header-icons > *:nth-child(3) { animation-delay: .2s; }
.header-icons > *:nth-child(2) { animation-delay: .3s; }
.header-icons > *:nth-child(1) { animation-delay: .4s; }

@keyframes popOut {
    0% { opacity: 0; transform: translateX(40px) scale(.5); }
    100% { opacity: 1; transform: translateX(0) scale(1); }
}

.icon-btn:active { transform: scale(.9); }
.icon-btn.insta { background: #1877F2; }
.icon-btn.wa { background: #25D366; }
.icon-btn.x { background: #000; }
.icon-btn.chat {
    background: #E4E6EB;
    color: #333;
    font-size: 18px;
    cursor: pointer;
}

.icon-btn svg {
    width: 20px;
    height: 20px;
    fill: white;
}

/* IMAGE SLIDER */

.slider-container {
    width: 100%;
    overflow: hidden;
    border-radius: 20px;
    position: relative;
    margin-bottom: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,.1);
    background: #FFD700;
}

.slider-track {
    display: flex;
    transition: transform .6s ease-in-out;
    width: 100%;
    align-items: stretch;
    touch-action: pan-y;
}

.slide {
    min-width: 100%;
    width: 100%;
    background: #FFD700;
    padding: 20px 15px;
    display: flex;
    align-items: center;
    text-decoration: none;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
}

/* Yellow banner curved shape */

.slide::after {
    content: '';
    position: absolute;
    top: 0;
    right: -50px;
    width: 150px;
    height: 100%;
    background: #0B3B5C;
    border-top-left-radius: 100px;
    border-bottom-left-radius: 40px;
    z-index: 1;
}

/* Image slides */

.slide.image-slide {
    padding: 0;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
}

.slide.image-slide::after {
    display: none;
}

.slide.image-slide img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
    border-radius: 0;
}

.slide-content {
    display: flex;
    align-items: center;
    width: 100%;
    position: relative;
    z-index: 2;
    gap: 15px;
    padding-right: 60px;
}

.slide-icon {
    width: 85px;
    height: 85px;
    background: #FFF8B0;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-shrink: 0;
    font-size: 40px;
    box-shadow: 0 4px 10px rgba(0,0,0,.1);
    overflow: hidden;
}

.slide-text {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.slide-title {
    font-size: 22px;
    font-weight: 800;
    color: #0B3B5C;
    margin-bottom: 5px;
}

.slide-sub {
    font-size: 13px;
    color: #0B3B5C;
    line-height: 1.3;
    font-weight: 500;
    opacity: .9;
}

.download-badge {
    display: inline-block;
    background: rgba(11,59,92,.1);
    color: #0B3B5C;
    font-size: 11px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 12px;
    margin-top: 8px;
    width: fit-content;
}

.slide-arrow {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    width: 40px;
    height: 40px;
    background: rgba(255,255,255,.1);
    border: 2px solid rgba(255,255,255,.2);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 3;
}

.slide-arrow svg {
    width: 20px;
    height: 20px;
    fill: white;
}

/* GRID */

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    width: 100%;
}

.card {
    border-radius: 18px;
    text-decoration: none;
    min-height: 125px;
    opacity: 0;
    transform: translateY(50px);
    background: conic-gradient(from var(--angle), #FFD700, #00BFFF, #FFD700);
    padding: 3px;
    animation:
        slideUpFade .8s cubic-bezier(.2,.8,.2,1) forwards,
        rotateBorder 3s linear infinite;
}

.card-inner {
    background: #fff;
    border-radius: 15px;
    width: 100%;
    height: 100%;
    padding: 15px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.card:active .card-inner {
    background: #f5f5f5;
}

@keyframes rotateBorder {
    to { --angle: 360deg; }
}

@keyframes slideUpFade {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.card:nth-child(1) { animation-delay: .2s, 0s; }
.card:nth-child(2) { animation-delay: .5s, 0s; }
.card:nth-child(3) { animation-delay: .8s, 0s; }
.card:nth-child(4) { animation-delay: 1.1s, 0s; }
.card:nth-child(5) { animation-delay: 1.4s, 0s; }
.card:nth-child(6) { animation-delay: 1.7s, 0s; }
.card:nth-child(7) { animation-delay: 2s, 0s; }
.card:nth-child(8) { animation-delay: 2.3s, 0s; }

.icon-box {
    width: 40px;
    height: 40px;
    background: #E3F2FD;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 10px;

.icon-box svg {

    fill: #1877F2;

.card-bottom {

    align-items: flex-end;

.card-arrow {

/* CONTACT MODAL */

.modal-overlay {

    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,.6);

    justify-content: center;
    align-items: center;

.modal-content {

    max-width: 350px;

.close-btn {

.modal-content h2 {

.modal-content p {

}
</style>

<!-- JAVASCRIPT -->

<script>

/* AUTOMATIC IMAGE SLIDER */

const track = document.getElementById('sliderTrack');
const slides = document.querySelectorAll('.slide');

let currentIndex = 0;
let slideInterval;

/* Update slide */

function updateSlider() {
    track.style.transform =
        `translateX(-${currentIndex * 100}%)`;
}

/* Next slide */

function nextSlide() {
    currentIndex = (currentIndex + 1) % slides.length;
    updateSlider();
}

/* Start automatic slider */

function startAutoSlide() {
    stopAutoSlide();
    slideInterval = setInterval(nextSlide, 3000);
}

/* Stop slider */

function stopAutoSlide() {
    clearInterval(slideInterval);
}

/* Start */

startAutoSlide();

/* Pause when user touches slider */

track.addEventListener('touchstart', stopAutoSlide);

track.addEventListener('touchend', startAutoSlide);

track.addEventListener('mouseenter', stopAutoSlide);

track.addEventListener('mouseleave', startAutoSlide);

/* CONTACT MODAL */

function openModal() {
    document.getElementById('contactModal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('contactModal').style.display = 'none';
}

window.onclick = function(event) {
    const modal = document.getElementById('contactModal');

    if (event.target === modal) {
        modal.style.display = 'none';
    }
};

</script>
