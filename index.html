<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SEAOX - Tools</title>
<link rel="icon" type="image/jpeg" href="favicon.jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
@property --angle {
 syntax: "<angle>";
 initial-value: 0deg;
 inherits: false;
}

* {
 box-sizing: border-box;
 margin: 0;
 padding: 0;
}

body {
 font-family: 'Inter', sans-serif;
 background: #f8f9fa;
 padding: 15px;
 display: flex;
 flex-direction: column;
 align-items: center;
 min-height: 100vh;
 overflow-x: hidden;
}

.app-container {
 width: 100%;
 max-width: 500px;
}

/* HEADER */

.header {
 display: flex;
 justify-content: space-between;
 align-items: center;
 margin-bottom: 20px;
 padding: 0 5px;
}

.header-logo {
 width: 145px;
 max-width: 38%;
 object-fit: contain;
 mix-blend-mode: multiply;
}

.header-icons {
 display: flex;
 align-items: center;
 gap: 9px;
}

.icon-btn {
 width: 48px;
 height: 48px;
 border-radius: 50%;
 display: flex;
 justify-content: center;
 align-items: center;
 text-decoration: none;
 box-shadow: 0 3px 9px rgba(0,0,0,.08);
 flex-shrink: 0;
 opacity: 0;
 animation: popOut .5s ease forwards;
 transition: transform .2s;
}

.header-icons > *:nth-child(1) { animation-delay: .1s; }
.header-icons > *:nth-child(2) { animation-delay: .2s; }
.header-icons > *:nth-child(3) { animation-delay: .3s; }
.header-icons > *:nth-child(4) { animation-delay: .4s; }

@keyframes popOut {
 from { opacity: 0; transform: translateX(30px) scale(.7); }
 to { opacity: 1; transform: translateX(0) scale(1); }
}

.icon-btn:active {
 transform: scale(.88);
}

.icon-btn.insta { background: #1877F2; }
.icon-btn.wa { background: #25D366; }
.icon-btn.x { background: #000; }
.icon-btn.chat {
 background: #E4E6EB;
 cursor: pointer;
}

.icon-btn svg {
 width: 25px;
 height: 25px;
 fill: white;
}

/* SLIDER */

.slider-container {
 width: 100%;
 height: auto;
 min-height: 220px;
 overflow: hidden;
 border-radius: 22px;
 position: relative;
 margin-bottom: 30px;
 box-shadow: 0 8px 22px rgba(0,0,0,.10);
 background: #FFD700;
 isolation: isolate;
}

.slider-track {
 display: flex;
 width: 100%;
 height: 100%;
 transition: transform .75s cubic-bezier(.22,.61,.36,1);
 will-change: transform;
}

.slide {
 flex: 0 0 100%;
 width: 100%;
 min-width: 100%;
 min-height: 220px;
 height: auto;
 background: #FFD700;
 padding: 20px 15px;
 display: flex;
 align-items: center;
 text-decoration: none;
 position: relative;
 overflow: hidden;
 color: inherit;
 -webkit-tap-highlight-color: transparent;
}

/* Yellow first banner */

.slide.yellow-slide::after {
 content: '';
 position: absolute;
 top: 0;
 right: -35px;
 width: 170px;
 height: 100%;
 background: #0B3B5C;
 border-top-left-radius: 110px;
 border-bottom-left-radius: 45px;
 z-index: 1;
}

.slide-content {
 display: flex;
 align-items: center;
 width: 100%;
 position: relative;
 z-index: 2;
 gap: 15px;
 padding-right: 55px;
}

.slide-icon {
 width: 95px;
 height: 95px;
 background: white;
 border-radius: 50%;
 display: flex;
 justify-content: center;
 align-items: center;
 flex-shrink: 0;
 overflow: hidden;
 box-shadow: 0 4px 12px rgba(0,0,0,.12);
}

.slide-icon img {
 width: 100%;
 height: 100%;
 object-fit: cover;
}

.slide-text {
 flex: 1;
 display: flex;
 flex-direction: column;
}

.slide-title {
 font-size: 23px;
 font-weight: 800;
 color: #0B3B5C;
 margin-bottom: 6px;
}

.slide-sub {
 font-size: 13px;
 color: #0B3B5C;
 line-height: 1.4;
 font-weight: 600;
}

.download-badge {
 display: inline-block;
 background: rgba(11,59,92,.12);
 color: #0B3B5C;
 font-size: 12px;
 font-weight: 800;
 padding: 7px 12px;
 border-radius: 20px;
 margin-top: 10px;
 width: fit-content;
}

.slide-arrow {
 position: absolute;
 right: 15px;
 top: 50%;
 transform: translateY(-50%);
 width: 43px;
 height: 43px;
 background: rgba(255,255,255,.13);
 border: 2px solid rgba(255,255,255,.25);
 border-radius: 50%;
 display: flex;
 justify-content: center;
 align-items: center;
 z-index: 3;
}

.slide-arrow svg {
 width: 23px;
 height: 23px;
 fill: none;
 stroke: white;
 stroke-width: 2;
}

/* IMAGE SLIDES */

.slide.image-slide {
 padding: 0;
 min-height: 220px;
 height: auto;
 display: flex;
 align-items: stretch;
 justify-content: center;
 background: #FFD700;
}

.slide.image-slide::after {
 display: none;
}

.slide.image-slide img {
 display: block;
 width: 100%;
 height: 100%;
 min-height: 220px;
 object-fit: cover;
 object-position: center;
 border-radius: 0;
}

/* IMAGE PLACEHOLDER FALLBACK */

.slide.image-slide img:not([src]),
.slide.image-slide img[src=""] {
 display: none;
}

/* GRID */

.grid {
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 15px;
 width: 100%;
}

.card {
 border-radius: 20px;
 text-decoration: none;
 min-height: 155px;
 opacity: 0;
 transform: translateY(40px);
 background: conic-gradient(
 from var(--angle),
 #8BC34A,
 #00BFFF,
 #FFD700,
 #8BC34A
 );
 padding: 4px;
 animation:
 slideUpFade .8s cubic-bezier(.2,.8,.2,1) forwards,
 rotateBorder 4s linear infinite;
}

.card-inner {
 background: #fff;
 border-radius: 16px;
 width: 100%;
 height: 100%;
 min-height: 147px;
 padding: 15px;
 display: flex;
 flex-direction: column;
 justify-content: space-between;
}

.card:active .card-inner {
 background: #f1f5f9;
}

@keyframes rotateBorder {
 to { --angle: 360deg; }
}

@keyframes slideUpFade {
 to {
 opacity: 1;
 transform: translateY(0);
 }
}

.card:nth-child(1) { animation-delay: .1s,0s; }
.card:nth-child(2) { animation-delay: .2s,0s; }
.card:nth-child(3) { animation-delay: .3s,0s; }
.card:nth-child(4) { animation-delay: .4s,0s; }
.card:nth-child(5) { animation-delay: .5s,0s; }
.card:nth-child(6) { animation-delay: .6s,0s; }
.card:nth-child(7) { animation-delay: .7s,0s; }
.card:nth-child(8) { animation-delay: .8s,0s; }

.icon-box {
 width: 52px;
 height: 52px;
 background: #E3F2FD;
 border-radius: 13px;
 display: flex;
 justify-content: center;
 align-items: center;
 margin-bottom: 10px;
}

.icon-box svg {
 width: 25px;
 height: 25px;
 fill: #1877F2;
}

.card-bottom {
 display: flex;
 justify-content: space-between;
 align-items: flex-end;
 gap: 5px;
}

.card-title {
 font-size: 15px;
 font-weight: 800;
 color: #111;
 line-height: 1.3;
}

.card-arrow {
 color: #1877F2;
 font-size: 23px;
 font-weight: bold;
}

/* CONTACT MODAL */

.modal-overlay {
 display: none;
 position: fixed;
 inset: 0;
 width: 100%;
 height: 100%;
 background: rgba(0,0,0,.65);
 z-index: 1000;
 justify-content: center;
 align-items: center;
}

.modal-content {
 background: #fff;
 width: 85%;
 max-width: 350px;
 border-radius: 18px;
 padding: 28px 20px;
 text-align: center;
 position: relative;
}

.close-btn {
 position: absolute;
 top: 10px;
 right: 15px;
 font-size: 27px;
 font-weight: bold;
 color: #888;
 cursor: pointer;
}

.modal-content h2 {
 color: #333;
 font-size: 23px;
 margin-bottom: 12px;
}

.modal-content p {
 color: #666;
 font-size: 14px;
 margin-bottom: 20px;
 font-weight: 500;
 line-height: 1.5;
}

.send-msg-btn {
 display: block;
 background: #1877F2;
 color: white;
 text-decoration: none;
 padding: 15px;
 border-radius: 11px;
 font-size: 16px;
 font-weight: bold;
}

/* MOBILE */

@media(max-width:380px) {
 .header-logo { width: 115px; }

 .slide-title { font-size: 19px; }
 .slide-sub { font-size: 12px; }
 .card { min-height: 140px; }
 .card-inner { min-height: 132px; }
}
</style>
</head>

<script>

// SMOOTH AUTO SLIDER - NO DOTS - NO STOPPING

const track = document.getElementById('sliderTrack');
const slides = Array.from(track.children);

let currentIndex = 0;
let sliderTimer = null;
let isMoving = false;

function moveSlider() {

 if (isMoving) return;

 isMoving = true;
 currentIndex++;

 track.style.transition = 'transform .75s cubic-bezier(.22,.61,.36,1)';
 track.style.transform = `translateX(-${currentIndex * 100}%)`;
}

track.addEventListener('transitionend', function() {

 if (currentIndex >= slides.length - 1) {

   // Last promotional image ke baad smoothly first par
   track.style.transition = 'none';
   currentIndex = 0;
   track.style.transform = 'translateX(0)';

   // Browser ko reset apply karne ka time
   requestAnimationFrame(() => {
     requestAnimationFrame(() => {
       track.style.transition = 'transform .75s cubic-bezier(.22,.61,.36,1)';
       isMoving = false;
     });
   });

 } else {
   isMoving = false;
 }

});

// Har 3 second mein automatic slide
function startSlider() {
 clearInterval(sliderTimer);
 sliderTimer = setInterval(moveSlider, 3000);
}

startSlider();

// Contact modal

function openModal() {
 document.getElementById('contactModal').style.display = 'flex';
}

function closeModal() {
 document.getElementById('contactModal').style.display = 'none';
}

window.addEventListener('click', function(event) {
 const modal = document.getElementById('contactModal');
 if (event.target === modal) {
   closeModal();
 }
});

</script>
