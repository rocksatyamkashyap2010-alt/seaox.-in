.glow {

    pointer-events: none;

.glow.one {

.glow.two {

}

.stars {

}

.star {

    height: 3px;
    border-radius: 50%;
    background: #48eaff;
    box-shadow: 0 0 9px #00d9ff;

}

@keyframes twinkle {

    to { opacity: 1; transform: scale(1.5); }

                    <defs>
                        <linearGradient id="gradient"
                            x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00eaff"/>
                            <stop offset="50%" stop-color="#2478ff"/>
                            <stop offset="100%" stop-color="#bd22ff"/>
                        </linearGradient>
                    </defs>

                    <circle class="track"
                        cx="100" cy="100" r="90"/>

                    <circle class="progress"
                        id="progress"
                        cx="100" cy="100" r="90"/>
                </svg>

                <div class="percentage">
                    <span id="number">0</span><span class="percent-sign">%</span>
                </div>

            </div>

            <div class="loading-status" id="status">
                Initializing...
            </div>

            <div class="bottom-message">
                Please wait while we get things ready.
            </div>

        </section>

        <div class="powered">
            Powered by SEAOX
        </div>

    </main>
</div>

<script>

/* STAR BACKGROUND */

const stars = document.getElementById('stars');

for (let i = 0; i < 45; i++) {
    const star = document.createElement('span');
    star.className = 'star';

    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 3 + 's';
    star.style.opacity = Math.random();

    stars.appendChild(star);
}

/* LOADING SYSTEM */

const number = document.getElementById('number');
const progress = document.getElementById('progress');
const status = document.getElementById('status');

const circumference = 2 * Math.PI * 90;

progress.style.strokeDasharray = circumference;
progress.style.strokeDashoffset = circumference;

const messages = [
    { limit: 20, text: 'Initializing...' },
    { limit: 45, text: 'Loading Smart Tools...' },
    { limit: 70, text: 'Preparing Digital Experience...' },
    { limit: 90, text: 'Almost Ready...' },
    { limit: 100, text: 'Welcome to SEAOX!' }
];

const startTime = performance.now();
const duration = 3000;

let redirected = false;

function updateLoading(currentTime) {

    if (redirected) return;

    const elapsed = currentTime - startTime;
    const percent = Math.min(100, Math.floor((elapsed / duration) * 100));

    number.textContent = percent;

    progress.style.strokeDashoffset =
        circumference - (percent / 100) * circumference;

    const currentMessage = messages.find(item => percent <= item.limit);
    if (currentMessage) {
        status.textContent = currentMessage.text;
    }

    if (percent >= 100) {
        redirected = true;

        // Open menu immediately after loading
        window.location.replace('menu.html');
        return;
    }

    requestAnimationFrame(updateLoading);
}

/* Preload next page */
const nextPage = document.createElement('link');
nextPage.rel = 'prefetch';
nextPage.href = 'menu.html';
document.head.appendChild(nextPage);

/* Start loading */
requestAnimationFrame(updateLoading);

</script>
