
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#040817">
<title>SEAOX.in</title>

<link rel="icon" type="image/jpeg" href="favicon.jpg">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(ellipse at center, #14245a, #070d25 55%, #02040c);
    color: white;
}

.glow {
    position: absolute;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    filter: blur(100px);
    opacity: .35;
    pointer-events: none;
}

.glow1 {
    background: #006aff;
    top: -100px;
    left: -100px;
}

.glow2 {
    background: #a000ff;
    bottom: -100px;
    right: -100px;
}

.container {
    min-height: 100vh;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
    position: relative;
    z-index: 2;
    transition: opacity .4s, transform .4s;
}

/* ORIGINAL ROUND S LOGO */

.main-logo {
    width: 125px;
    height: 125px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 20px;
    border: 2px solid #00dcff;
    box-shadow: 0 0 20px #007bff, 0 0 40px #003bff;
    animation: float 3s infinite alternate ease-in-out;
}

@keyframes float {
    to { transform: translateY(-8px); }
}

/* ORIGINAL SEAOX WORDMARK */

.brand-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    margin-bottom: 8px;
    max-width: 95%;
}

.brand-image {
    width: 230px;
    max-width: 75vw;
    height: auto;
    object-fit: contain;
    display: block;
}

.brand-in {
    font-family: 'Montserrat', sans-serif;
    font-size: clamp(20px, 6vw, 30px);
    font-weight: 900;
    color: #00dfff;
    text-shadow: 0 0 12px #008cff;
    white-space: nowrap;
}

.subtitle {
    color: #a8c4e8;
    font-size: 11px;
    letter-spacing: 4px;
    margin-bottom: 38px;
}

/* LOADING CARD */

.loading-card {
    width: 100%;
    max-width: 330px;
    padding: 25px 15px;
    border-radius: 25px;
    background: linear-gradient(145deg, #12375b, #0a102e);
    border: 1px solid rgba(0,220,255,.4);
    box-shadow: 0 0 30px rgba(0,130,255,.2);
    display: flex;
    align-items: center;
    flex-direction: column;
}

.message {
    font-size: 14px;
    color: #d1eaff;
    margin-bottom: 20px;
}

/* CIRCULAR LOADER */

.progress-wrapper {
    width: 220px;
    height: 220px;
    position: relative;
}

.progress-svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
}

.track {
    fill: none;
    stroke: rgba(255,255,255,.1);
    stroke-width: 10;
}

.progress {
    fill: none;
    stroke: url(#gradient);
    stroke-width: 10;
    stroke-linecap: round;
    stroke-dasharray: 565.49;
    stroke-dashoffset: 565.49;
    filter: drop-shadow(0 0 8px #00e5ff);
}

.progress-content {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.percent {
    font-family: 'Montserrat', sans-serif;
    font-size: 55px;
    font-weight: 900;
    text-shadow: 0 0 20px #008cff;
}

.status {
    font-size: 13px;
    color: #a8eaff;
}

.wait {
    color: #8da6cb;
    font-size: 12px;
    margin-top: 20px;
}

.powered {
    position: absolute;
    bottom: 25px;
    font-size: 11px;
    letter-spacing: 2px;
    color: #8195bb;
}

.powered span {
    color: #00e5ff;
    font-weight: 700;
}

.fade {
    opacity: 0;
    transform: scale(1.04);
}

@media(max-height: 650px) {
    .main-logo {
        width: 85px;
        height: 85px;
    }

    .subtitle {
        margin-bottom: 18px;
    }

    .progress-wrapper {
        width: 170px;
        height: 170px;
    }

    .percent {
        font-size: 43px;
    }

    .loading-card {
        padding: 15px;
    }
}
</style>
</head>

<body>

<div class="glow glow1"></div>
<div class="glow glow2"></div>

<div class="container" id="main">

    <!-- 1. FAVICON S LOGO -->
    <img
        src="favicon.jpg"
        class="main-logo"
        alt="SEAOX Logo"
    >

    <!-- 2. ORIGINAL SEAOX NAME IMAGE + .IN -->
    <div class="brand-row">

        <img
            src="IMG_20261006_211924.png"
            class="brand-image"
            alt="SEAOX"
        >

        <span class="brand-in">.in</span>

    </div>

    <div class="subtitle">
        SMART TOOLS & DIGITAL SOLUTIONS
    </div>

    <!-- 3. LOADING ANIMATION -->
    <div class="loading-card">

        <div class="message">
            हमारी सामग्री लोड की जा रही है...
        </div>

        <div class="progress-wrapper">

            <svg class="progress-svg" viewBox="0 0 200 200">

                <defs>
                    <linearGradient id="gradient">
                        <stop offset="0%" stop-color="#00e5ff"/>
                        <stop offset="50%" stop-color="#1685ff"/>
                        <stop offset="100%" stop-color="#c000ff"/>
                    </linearGradient>
                </defs>

                <circle class="track"
                    cx="100" cy="100" r="90"/>

                <circle class="progress"
                    id="progressBar"
                    cx="100" cy="100" r="90"/>

            </svg>

            <div class="progress-content">
                <div class="percent">
                    <span id="percent">1</span>%
                </div>

                <div class="status" id="status">
                    लोड हो रहा है...
                </div>
            </div>

        </div>

        <div class="wait">
            कृपया प्रतीक्षा करें
        </div>

    </div>

    <div class="powered">
        POWERED BY <span>SEAOX</span>
    </div>

</div>

<script>

const duration = 3000;
const circumference = 2 * Math.PI * 90;

const bar = document.getElementById("progressBar");
const number = document.getElementById("percent");
const status = document.getElementById("status");
const main = document.getElementById("main");

let start = null;

function loading(timestamp) {

    if (!start) start = timestamp;

    const elapsed = timestamp - start;
    const progress = Math.min(elapsed / duration, 1);

    const value = Math.max(1, Math.floor(progress * 100));

    number.textContent = value;

    bar.style.strokeDashoffset =
        circumference * (1 - progress);

    if (progress < 1) {
        requestAnimationFrame(loading);
    } else {
        number.textContent = 100;
        status.textContent = "लोडिंग पूरी हुई!";

        setTimeout(() => {
            main.classList.add("fade");

            setTimeout(() => {
                window.location.replace("menu.html");
            }, 400);

        }, 100);
    }
}

requestAnimationFrame(loading);

</script>

</body>
</html>
