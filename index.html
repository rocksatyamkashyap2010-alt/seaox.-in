<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SEAOX - Smart Tools & Apps</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    
    <meta name="description" content="SEAOX Powered Apps: PDF Maker • Video Editor • Photo Compressor • Screenshot Editor • Invoice Generator • Protect PDF • QR Code Maker • Smart Calculator. Download Tractor Book App!">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #040814;
            height: 100vh;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            position: relative;
        }

        /* ========================================= */
        /* 1. WELCOME SCREEN CSS */
        /* ========================================= */
        .bg-glow-1, .bg-glow-2 {
            position: absolute; width: 200vw; height: 200vw;
            border-radius: 50%; filter: blur(100px); z-index: 0; opacity: 0.4;
        }
        .bg-glow-1 { top: -100vw; left: -50vw; background: radial-gradient(circle, rgba(0,229,255,0.4) 0%, transparent 60%); }
        .bg-glow-2 { bottom: -100vw; right: -50vw; background: radial-gradient(circle, rgba(157,0,255,0.3) 0%, transparent 60%); }

        .welcome-container {
            z-index: 10; position: absolute; top: 0; left: 0; width: 100%; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
            transition: opacity 0.8s ease;
        }
        .fade-out { opacity: 0; pointer-events: none; }

        .s-logo {
            width: 120px; height: 120px; border-radius: 28px; object-fit: cover;
            box-shadow: 0 10px 40px rgba(0, 229, 255, 0.4), 0 10px 40px rgba(157, 0, 255, 0.4);
            margin-bottom: 20px; animation: logoFloat 3s ease-in-out infinite alternate;
        }
        @keyframes logoFloat { from { transform: translateY(0); } to { transform: translateY(-10px); } }

        .brand-logo-img { width: 250px; max-width: 85%; margin-bottom: 20px; filter: brightness(1.5) drop-shadow(0 0 10px rgba(0, 229, 255, 0.5)); }
        .welcome-title { color: #ffffff; font-size: 1.8rem; font-weight: 600; line-height: 1.2; margin-bottom: 10px; }
        .welcome-title span {
            display: block; font-size: 2rem; font-weight: 800; letter-spacing: 1px;
            background: linear-gradient(90deg, #00e5ff, #9d00ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .tagline { color: #a0b0d0; font-size: 0.9rem; margin-bottom: 40px; }
        .dots { display: flex; gap: 15px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; animation: pulse 1.5s infinite; }
        .dot:nth-child(1) { background-color: #00e5ff; box-shadow: 0 0 15px #00e5ff; }
        .dot:nth-child(2) { background-color: #1877F2; box-shadow: 0 0 15px #1877F2; animation-delay: 0.3s; }
        .dot:nth-child(3) { background-color: #9d00ff; box-shadow: 0 0 15px #9d00ff; animation-delay: 0.6s; }
        @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.5; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.8); opacity: 0.5; } }


        /* ========================================= */
        /* 2. BLACK SCREEN ANIMATION STAGE */
        /* ========================================= */
        .animation-stage {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #000; z-index: 100;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
            opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
        }
        .animation-stage.active { opacity: 1; pointer-events: auto; }

        /* ========================================= */
        /* 3. CUSTOM CSS LADKA (Boy Design) */
        /* ========================================= */
        .css-boy {
            display: flex; flex-direction: column; align-items: center; position: relative;
            opacity: 0; transform: translateX(-100vw);
        }
        .animate-slide-in { animation: slideIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes slideIn {
            0% { opacity: 0; transform: translateX(-100vw); }
            100% { opacity: 1; transform: translateX(0); }
        }

        /* Head */
        .head {
            width: 90px; height: 90px; background-color: #fcd2b3;
            border-radius: 45px; position: relative; border: 3px solid #222; z-index: 3;
        }
        .hair {
            position: absolute; top: -5px; left: -5px; right: -5px; height: 45px;
            background-color: #222; border-radius: 45px 45px 0 0;
            clip-path: polygon(0% 100%, 10% 20%, 30% 40%, 50% 0%, 70% 40%, 90% 20%, 100% 100%);
        }
        .eye { position: absolute; top: 45px; width: 10px; height: 12px; background-color: #222; border-radius: 50%; }
        .eye.left { left: 20px; }
        .eye.right { right: 20px; }
        .smile { position: absolute; bottom: 20px; left: 25px; width: 40px; height: 20px; border-bottom: 3px solid #222; border-radius: 0 0 20px 20px; }

        /* Torso */
        .torso {
            width: 110px; height: 130px; background-color: #e74c3c; /* Red jacket */
            border-radius: 20px; margin-top: -15px; position: relative; border: 3px solid #222; z-index: 2;
        }
        .shirt-stripe {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 50px; height: 100%;
            background: repeating-linear-gradient(0deg, #fff, #fff 15px, #2ecc71 15px, #2ecc71 30px);
            border-left: 2px solid #222; border-right: 2px solid #222;
        }

        /* Arms */
        .arm {
            position: absolute; width: 30px; height: 80px; background-color: #e74c3c;
            border-radius: 15px; border: 3px solid #222; top: 10px;
            transform-origin: top center; transition: transform 0.5s ease; z-index: 4;
        }
        .arm.left { left: -25px; }
        .arm.right { right: -25px; }
        .hand {
            position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
            width: 25px; height: 25px; background-color: #fcd2b3; border-radius: 50%; border: 3px solid #222;
        }

        /* Legs & Shoes */
        .legs { display: flex; gap: 15px; margin-top: -10px; z-index: 1; }
        .leg {
            width: 40px; height: 90px; background-color: #2c3e50;
            border-radius: 10px 10px 5px 5px; border: 3px solid #222; position: relative;
        }
        .shoe {
            position: absolute; bottom: -15px; left: -5px; right: -5px; height: 25px;
            background-color: #e74c3c; border-radius: 10px; border: 3px solid #222;
        }

        /* Torch */
        .torch {
            position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%) translateY(20px);
            width: 18px; height: 35px; background-color: #f1c40f; border-radius: 4px; border: 3px solid #222;
            opacity: 0; transition: all 0.5s ease; z-index: 5;
        }
        .torch::before { /* glass */
            content: ''; position: absolute; top: -8px; left: 0; right: 0; height: 8px;
            background-color: #fff; border-radius: 4px 4px 0 0; border: 3px solid #222; border-bottom: none;
        }
        .torch.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Hi Bubble */
        .hi-bubble {
            position: absolute; top: -40px; right: -100px; background: #fff; color: #000;
            padding: 10px 25px; border-radius: 20px; font-weight: 900; font-size: 32px;
            font-family: 'Montserrat', sans-serif; opacity: 0; transform: scale(0);
            box-shadow: 0 5px 15px rgba(255,255,255,0.3); border: 3px solid #222; z-index: 10;
        }
        .hi-bubble::after {
            content: ''; position: absolute; bottom: -15px; left: 20px;
            border-width: 15px 15px 0; border-style: solid; border-color: #fff transparent transparent transparent;
            filter: drop-shadow(0 3px 0 #222);
        }

        /* Light Beam */
        .light-beam {
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%) scale(0);
            width: 10px; height: 10px; background: #fff; border-radius: 50%;
            box-shadow: 0 0 50px 50px #fff; opacity: 0; z-index: 105;
        }

        /* ========================================= */
        /* 4. ANIMATION CLASSES (Trigger via JS) */
        /* ========================================= */
        .wave-hand { animation: wave 0.6s ease-in-out infinite alternate; }
        @keyframes wave { 0% { transform: rotate(0deg); } 100% { transform: rotate(-140deg); } }
        
        .point-torch { transform: rotate(-100deg); } /* Arm pointing towards screen */
        
        .pop-hi { animation: popHi 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popHi { 0% { opacity: 0; transform: scale(0); } 100% { opacity: 1; transform: scale(1); } }
        
        .expand-light { animation: expandLight 2s ease-in forwards; }
        @keyframes expandLight {
            0% { opacity: 1; transform: translateX(-50%) scale(1); }
            100% { opacity: 1; transform: translateX(-50%) scale(400); } /* 400x scale puri screen white kar dega */
        }
    </style>
</head>
<body>

    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <!-- 1. WELCOME SCREEN -->
    <div class="welcome-container" id="welcomeScreen">
        <img src="IMG_20261019_105230.jpg" alt="SEAOX Logo" class="s-logo">
        <img src="1000060185-removebg-preview.png" alt="SEAOX Text" class="brand-logo-img">
        
        <div class="welcome-title">
            Welcome to
            <span>SEAOX</span>
        </div>
        <div class="tagline">Smart tools. Simple solutions.</div>
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <!-- 2. BLACK ANIMATION STAGE -->
    <div class="animation-stage" id="animationStage">
        
        <!-- CSS Ladka -->
        <div class="css-boy" id="boy">
            <div class="hi-bubble" id="hiBubble">Hi!</div>
            
            <div class="head">
                <div class="hair"></div>
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="smile"></div>
            </div>
            
            <div class="torso">
                <div class="shirt-stripe"></div>
                
                <!-- Left Arm (Torch wala) -->
                <div class="arm left" id="leftArm">
                    <div class="hand"></div>
                    <div class="torch" id="torch">
                        <div class="light-beam" id="lightBeam"></div>
                    </div>
                </div>
                
                <!-- Right Arm (Hath hilane wala) -->
                <div class="arm right" id="rightArm">
                    <div class="hand"></div>
                </div>
            </div>

            <div class="legs">
                <div class="leg"><div class="shoe"></div></div>
                <div class="leg"><div class="shoe"></div></div>
            </div>
        </div>
    </div>

    <!-- 3. JAVASCRIPT TIMING LOGIC -->
    <script>
        // Total Time: ~7.5 Seconds (Welcome + Ladka aana + Hi + Torch + Light + Screen Open)
        
        // 1. 2 Second baad Welcome fade out
        setTimeout(function() {
            document.getElementById('welcomeScreen').classList.add('fade-out');
            document.getElementById('animationStage').classList.add('active');
            
            // 2. 0.5 Second baad Ladka left se aayega
            setTimeout(() => {
                document.getElementById('boy').classList.add('animate-slide-in');
            }, 500);

            // 3. Ladka rukne ke baad (1.5s), Hath uthayega aur "Hi" bolega
            setTimeout(() => {
                document.getElementById('rightArm').classList.add('wave-hand');
                document.getElementById('hiBubble').classList.add('pop-hi');
            }, 2000);

            // 4. Fir 2 second baad (Total 4s), hath niche karke torch nikalega
            setTimeout(() => {
                document.getElementById('rightArm').classList.remove('wave-hand'); // Hath niche
                document.getElementById('hiBubble').style.opacity = 0; // Bubble gayab
                
                document.getElementById('torch').classList.add('show'); // Torch show
                document.getElementById('leftArm').classList.add('point-torch'); // Torch point karega
            }, 4000);

            // 5. Torch point karne ke 1 second baad (Total 5s), Torch Light ON
            setTimeout(() => {
                document.getElementById('lightBeam').classList.add('expand-light');
            }, 5000);

            // 6. Light failne ke baad (Total 7s), Menu page open
            setTimeout(() => {
                window.location.href = 'menu.html';
            }, 7000); 

        }, 2000); 
    </script>
</body>
</html>
