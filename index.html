<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050817">

<title>SEAOX.in | Innovation that makes life easier</title>

<link rel="icon" type="image/jpeg" href="favicon.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --cyan: #00e5ff;
    --blue: #1685ff;
    --purple: #a855f7;
    --bg: #050817;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: 'Inter', sans-serif;
    color: white;
    background: var(--bg);
}

/* ===== PREMIUM BACKGROUND ===== */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(ellipse at 50% 28%,
        #132b65 0%,
        #0a1539 35%,
        #050817 75%,
        #02040c 100%);
}

.glow {
    position: absolute;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    filter: blur(110px);
    opacity: .25;
    pointer-events: none;
}

.glow-one {
    background: #007bff;
    top: -200px;
    left: -170px;
}

.glow-two {
    background: #791aff;
    bottom: -230px;
    right: -170px;
}

.glow-three {
    background: #00d9ff;
    top: 40%;
    left: 60%;
    width: 250px;
    height: 250px;
    opacity: .09;
}

/* Subtle grid */

.grid-background {
    position: absolute;
    inset: 0;
    opacity: .12;

    background-image:
        linear-gradient(rgba(80,150,255,.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(80,150,255,.12) 1px, transparent 1px);

    background-size: 45px 45px;

    mask-image: linear-gradient(
        to bottom,
        black,
        transparent 90%
    );
}

/* Particles */

.particles {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.particle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #69eaff;
    box-shadow: 0 0 12px #00cfff;
    animation: particleFloat 4s ease-in-out infinite alternate;
}

@keyframes particleFloat {
    from {
        transform: translateY(0) scale(.7);
        opacity: .2;
    }
    to {
        transform: translateY(-25px) scale(1.4);
        opacity: .9;
    }
}

/* ===== MAIN CONTENT ===== */

.main-container {
    position: relative;
    z-index: 2;

    width: 100%;
    max-width: 480px;
    min-height: 100vh;

    margin: auto;
    padding: 30px 22px 65px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    transition: opacity .5s ease, transform .5s ease;
}

/* ===== ORIGINAL S LOGO ===== */

.logo-box {
    width: 116px;
    height: 116px;
    border-radius: 50%;
    overflow: hidden;

    margin-bottom: 20px;

    border: 1px solid rgba(0,225,255,.85);

    box-shadow:
        0 0 12px rgba(0,225,255,.6),
        0 0 35px rgba(0,100,255,.35),
        inset 0 0 15px rgba(0,225,255,.2);

    animation: logoFloat 4s ease-in-out infinite alternate;
}

.logo-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 50%;
}

@keyframes logoFloat {
    to {
        transform: translateY(-6px);
    }
}

/* ===== SEAOX BRAND ===== */

.brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    width: 100%;
    margin-bottom: 13px;
}

.brand-image {
    width: 235px;
    max-width: 70%;
    height: auto;
    object-fit: contain;
    display: block;
}

.brand-in {
    font-family: 'Montserrat', sans-serif;
    font-size: clamp(21px, 6vw, 29px);
    font-weight: 900;
    color: #bd8aff;

    background: linear-gradient(
        120deg,
        #00e5ff,
        #3885ff,
        #c16aff
    );

    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* ===== TAGLINE ===== */

.tagline {
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.5px;
    line-height: 1.6;

    color: #b7c9e8;

    margin-bottom: 43px;
}

/* ===== LOADING CARD ===== */

.loading-card {
    position: relative;
    width: 100%;
    max-width: 370px;

    padding: 32px 18px 29px;

    border-radius: 28px;

    background: linear-gradient(
        145deg,
        rgba(22,52,91,.72),
        rgba(9,16,43,.82)
    );

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    border: 1px solid rgba(0,210,255,.24);

    box-shadow:
        0 20px 60px rgba(0,0,0,.3),
        0 0 35px rgba(0,130,255,.09),
        inset 0 1px 0 rgba(255,255,255,.08);

    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Top glowing line */

.loading-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 15%;
    width: 70%;
    height: 1px;

    background: linear-gradient(
        90deg,
        transparent,
        #00e5ff,
        #a855f7,
        transparent
    );

    box-shadow: 0 0 12px #00cfff;
}

.loading-heading {
    color: #e1edff;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .2px;
    text-align: center;
    margin-bottom: 28px;
}

.loading-description {
    font-size: 12px;
    color: #829bc4;
    margin-top: 7px;
    text-align: center;
}

/* ===== CIRCULAR PROGRESS ===== */

.progress-wrapper {
    width: 225px;
    height: 225px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.progress-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    transform: rotate(-90deg);
}

.progress-track {
    fill: none;
    stroke: rgba(255,255,255,.09);
    stroke-width: 9;
}

.progress-ring {
    fill: none;
    stroke: url(#ringGradient);
    stroke-width: 9;
    stroke-linecap: round;

    stroke-dasharray: 565.49;
    stroke-dashoffset: 565.49;

    filter:
        drop-shadow(0 0 5px #00dfff)
        drop-shadow(0 0 13px rgba(0,130,255,.5));
}

.progress-center {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.percentage {
    font-family: 'Montserrat', sans-serif;
    font-size: 64px;
    font-weight: 900;
    line-height: 1;

    background: linear-gradient(
        180deg,
        #ffffff,
        #a9dfff
    );

    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;

    filter: drop-shadow(0 0 15px rgba(0,180,255,.3));
}

.percent-symbol {
    font-size: 30px;
}

.status {
    color: #a9d9ff;
    font-size: 13px;
    font-weight: 500;
    margin-top: 12px;
    letter-spacing: .3px;
}

/* ===== BOTTOM AREA ===== */

.wait-text {
    color: #8499bc;
    font-size: 12px;
    letter-spacing: .6px;
    margin-top: 29px;
    text-align: center;
}

.powered {
    position: absolute;
    bottom: 24px;

    font-size: 10px;
    letter-spacing: 2.5px;
    color: #7187ac;
    font-weight: 600;
}

.powered span {
    color: #48dfff;
}

/* ===== TRANSITION ===== */

.exit {
    opacity: 0;
    transform: scale(1.035);
}

/* ===== RESPONSIVE ===== */

@media (max-height: 750px) {

    .main-container {
        padding-top: 15px;
        padding-bottom: 48px;
    }

    .logo-box {
        width: 88px;
        height: 88px;
        margin-bottom: 13px;
    }

    .tagline {
        margin-bottom: 24px;
    }

    .loading-card {
        padding: 20px 15px;
    }

    .progress-wrapper {
        width: 180px;
        height: 180px;
    }

    .percentage {
        font-size: 51px;
    }

    .loading-heading {
        margin-bottom: 15px;
    }

    .wait-text {
        margin-top: 15px;
    }
}

@media (max-height: 600px) {

    .logo-box {
        width: 65px;
        height: 65px;
        margin-bottom: 8px;
    }

    .brand-image {
        width: 175px;
    }

    .tagline {
        margin-bottom: 12px;
        font-size: 11px;
    }

    .progress-wrapper {
        width: 135px;
        height: 135px;
    }

    .percentage {
        font-size: 40px;
    }

    .loading-card {
        padding: 12px;
    }

    .loading-heading {
        margin-bottom: 8px;
        font-size: 13px;
    }

    .wait-text {
        margin-top: 8px;
    }
}

</style>
</head>

<body>

<!-- BACKGROUND -->

<div class="background">
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>
    <div class="glow glow-three"></div>
    <div class="grid-background"></div>
    <div class="particles" id="particles"></div>
</div>

<!-- MAIN SCREEN -->

<main class="main-container" id="main">

    <!-- ORIGINAL S LOGO -->

    <div class="logo-box">
        <img src="favicon.jpg" alt="SEAOX Logo">
    </div>

    <!-- ORIGINAL BRAND IMAGE -->

    <div class="brand">

        <img
            src="IMG_20261006_211924.png"
            alt="SEAOX"
            class="brand-image"
        >

        <span class="brand-in">.in</span>

    </div>

    <!-- TAGLINE -->

    <div class="tagline">
        Innovation that makes life easier.
    </div>

    <!-- LOADING CARD -->

    <section class="loading-card">

        <div class="loading-heading">
            Preparing your experience
        </div>

        <div class="progress-wrapper">

            <svg class="progress-svg" viewBox="0 0 200 200">

                <defs>
                    <linearGradient
                        id="ringGradient"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%"
                    >
                        <stop offset="0%" stop-color="#00e5ff"/>
                        <stop offset="50%" stop-color="#2585ff"/>
                        <stop offset="100%" stop-color="#a855f7"/>
                    </linearGradient>
                </defs>

                <circle
                    class="progress-track"
                    cx="100"
                    cy="100"
                    r="90"
                />

                <circle
                    class="progress-ring"
                    id="progressRing"
                    cx="100"
                    cy="100"
                    r="90"
                />

            </svg>

            <div class="progress-center">

                <div class="percentage">
                    <span id="percent">1</span><span class="percent-symbol">%</span>
                </div>

                <div class="status" id="status">
                    Loading...
                </div>

            </div>

        </div>

        <div class="wait-text" id="waitText">
            Please wait while we get things ready.
        </div>

    </section>

    <!-- FOOTER -->

    <div class="powered">
        POWERED BY <span>SEAOX</span>
    </div>

</main>

<script>

/* ===== PARTICLES ===== */

const particleBox = document.getElementById("particles");

for(let i = 0; i < 40; i++) {

    const particle = document.createElement("span");

    particle.className = "particle";

    particle.style.left = Math.random() * 100 + "%";
    particle.style.top = Math.random() * 100 + "%";

    particle.style.animationDelay =
        Math.random() * 4 + "s";

    particle.style.animationDuration =
        (3 + Math.random() * 3) + "s";

    particleBox.appendChild(particle);
}

/* ===== 3 SECOND LOADING ===== */

const duration = 3000;
const circumference = 2 * Math.PI * 90;

const ring = document.getElementById("progressRing");
const percent = document.getElementById("percent");
const status = document.getElementById("status");
const waitText = document.getElementById("waitText");
const main = document.getElementById("main");

let startTime = null;
let redirected = false;

function updateLoading(timestamp) {

    if(startTime === null) {
        startTime = timestamp;
    }

    const elapsed = timestamp - startTime;

    const progress = Math.min(elapsed / duration, 1);

    const value = Math.min(
        100,
        Math.max(1, Math.floor(progress * 100))
    );

    percent.textContent = value;

    ring.style.strokeDashoffset =
        circumference * (1 - progress);

    if(progress < 1) {

        requestAnimationFrame(updateLoading);

    } else {

        percent.textContent = "100";
        status.textContent = "Ready!";
        waitText.textContent = "Welcome to SEAOX";

        if(!redirected) {

            redirected = true;

            setTimeout(() => {

                main.classList.add("exit");

                setTimeout(() => {

                    window.location.replace("menu.html");

                }, 500);

            }, 250);

        }
    }
}

requestAnimationFrame(updateLoading);

</script>

</body>
</html>
