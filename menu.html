<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEAOX - Menu</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <style>
        body { margin: 0; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #ffffff; display: flex; flex-direction: column; align-items: center; }
        
        /* Top Header */
        .header { width: 100%; max-width: 450px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .logo-img { width: 160px; mix-blend-mode: multiply; }
        .menu-icon { font-size: 32px; color: #333; cursor: pointer; padding: 5px; }

        /* Yellow App Box */
        .app-box { width: 100%; max-width: 450px; height: 400px; background-color: #FFD700; border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-decoration: none; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .app-box:active { transform: scale(0.98); }
        
        /* Realistic Phone Frame */
        .app-icon { margin-bottom: 20px; display: flex; justify-content: center; }
        
        .iphone-frame {
            width: 130px;
            height: 260px; 
            background: #1a1a1a; 
            border-radius: 22px;
            border: 4px solid #333; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 15px 25px rgba(0,0,0,0.3), 0 0 0 1px #555;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Side Buttons */
        .iphone-frame::before { content: ''; position: absolute; left: -6px; top: 50px; width: 2px; height: 15px; background: #444; border-radius: 3px 0 0 3px; box-shadow: 0 25px 0 #444, 0 50px 0 #444; }
        .iphone-frame::after { content: ''; position: absolute; right: -6px; top: 60px; width: 2px; height: 30px; background: #444; border-radius: 0 3px 3px 0; }

        /* Screen inside Phone */
        .phone-screen {
            width: 114px;
            height: 244px;
            background: linear-gradient(180deg, #111, #222); 
            border-radius: 18px;
            overflow: hidden; 
            position: relative;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 28px 10px 30px 10px; /* Bottom padding badha diya nav bar ke liye */
            box-sizing: border-box;
        }

        /* Dynamic Island */
        .phone-screen::before {
            content: '';
            position: absolute;
            top: 8px; left: 50%; transform: translateX(-50%);
            width: 45px; height: 12px;
            background: #000; border-radius: 15px; z-index: 10;
            box-shadow: inset 0 0 2px rgba(255,255,255,0.1);
        }

        /* Square App Icons */
        .mini-app {
            width: 100%;
            aspect-ratio: 1 / 1; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* Tractor Book App */
        .real-app {
            background: #ffffff;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.6); z-index: 5;
            border: 1px solid #eee; padding: 1px;
        }
        .real-app img { width: 100%; height: 100%; object-fit: contain; border-radius: 7px; }

        /* NAYA: Android Navigation Bar (Neeche ke buttons) */
        .android-nav {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%;
            height: 22px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            border-bottom-left-radius: 18px;
            border-bottom-right-radius: 18px;
            z-index: 10;
        }

        /* Nav Icons Design (Gray color ke) */
        .nav-icon {
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        
        .icon-square { width: 8px; height: 8px; border: 2px solid #aaa; border-radius: 2px; }
        .icon-circle { width: 8px; height: 8px; border: 2px solid #aaa; border-radius: 50%; }
        .icon-triangle { width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-right: 9px solid #aaa; transform: translateX(-1px); }

        .app-text { font-size: 50px; font-weight: 900; color: #111; letter-spacing: 2px; margin-top: 5px; }

        /* Green Contact Box */
        .contact-box { width: 100%; max-width: 450px; background-color: #00A859; border-radius: 20px; padding: 20px; box-sizing: border-box; display: flex; align-items: center; gap: 15px; text-decoration: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.2s; margin-bottom: 20px; }
        .contact-box:active { transform: scale(0.98); }
        .contact-icon { font-size: 50px; color: white; }
        .contact-text { color: white; font-size: 18px; font-weight: bold; line-height: 1.4; }

        /* Blue Instagram Box */
        .instagram-box { width: 100%; max-width: 450px; background-color: #1877F2; border-radius: 20px; padding: 20px; box-sizing: border-box; display: flex; align-items: center; gap: 15px; text-decoration: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .instagram-box:active { transform: scale(0.98); }
        .instagram-icon svg { width: 45px; height: 45px; fill: white; }
        .instagram-text { color: white; font-size: 24px; font-weight: bold; letter-spacing: 1px; }

        /* Modal (Popup) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #fff; width: 85%; max-width: 350px; border-radius: 15px; padding: 25px 20px; text-align: center; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2); animation: popUp 0.3s ease-out; }
        @keyframes popUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; font-weight: bold; color: #888; cursor: pointer; }
        .modal-content h2 { margin-top: 0; color: #333; font-size: 22px; }
        .modal-content p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .send-msg-btn { display: block; background-color: #ff3333; color: white; text-decoration: none; padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; box-shadow: 0 4px 10px rgba(255, 51, 51, 0.3); transition: background 0.3s; }
        .send-msg-btn:hover { background-color: #cc0000; }
        .hindi-note { font-size: 13px; color: #555; margin-top: 15px; line-height: 1.4; font-style: italic; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>

    <div class="header">
        <img src="IMG_20261006_211924.png" alt="SEAOX Logo" class="logo-img">

    </div>

                    <div class="mini-app real-app">

                    <div class="mini-app" style="background: #E040FB;"></div>

                    <div class="mini-app" style="background: #00E5FF;"></div>
                    <div class="mini-app" style="background: #FF9100;"></div>
                    <div class="mini-app" style="background: #2979FF;"></div>

                    <!-- NAYA: Navigation Bar (Square, Circle, Triangle) -->
                    <div class="android-nav">
                        <div class="nav-icon"><div class="icon-square"></div></div>
                        <div class="nav-icon"><div class="icon-circle"></div></div>
                        <div class="nav-icon"><div class="icon-triangle"></div></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="app-text">APP</div>
    </a>

    <a href="mailto:seaoxseaox@gmail.com?subject=Website/App Development Inquiry" class="contact-box">

            Want to build a website, app, or software?<br>
            Let's talk!
        </div>

    <a href="https://www.instagram.com/seaoxofficial" target="_blank" class="instagram-box">

                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>

    <div id="contactModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">×</span>
            <h2>Contact Us</h2>
            <p>Have a question or want to build an app? Click below to send us a message.</p>

            <p class="hindi-note">*किसी भी तरह का यदि हमारे एप्लीकेशन में अप्डेट चाहिए या फिर कोई फीचर्स एड करना हो तो आप हमें मेल कर सकते है</p>

    <script>
        function openModal() { document.getElementById('contactModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('contactModal').style.display = 'none'; }
        window.onclick = function(event) {
            var modal = document.getElementById('contactModal');
            if (event.target == modal) { modal.style.display = 'none'; }
        }
    </script>
</body>
</html>
