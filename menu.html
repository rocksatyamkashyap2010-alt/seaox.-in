<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEAOX - Menu</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <style>
        body { margin: 0; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #ffffff; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        
        /* Top Header */
        .header { width: 100%; max-width: 450px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .logo-img { width: 160px; mix-blend-mode: multiply; }
        
        /* Top right icon (Contact/Message Icon) */
        .menu-icon { font-size: 30px; color: #333; cursor: pointer; padding: 5px; background: #f0f0f0; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* Common Button Style */
        .btn-box { 
            width: 100%; 
            max-width: 450px; 
            height: 85px; 
            border-radius: 20px; 
            padding: 0 20px; 
            box-sizing: border-box; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            text-decoration: none; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            transition: transform 0.2s; 
            cursor: pointer;
        }
        .btn-box:active { transform: scale(0.98); }
        
        .btn-icon { display: flex; align-items: center; justify-content: center; width: 50px; height: 50px; }
        .btn-text { font-weight: bold; }

        /* 1. APP Box (Yellow) */
        .app-box { background-color: #FFD700; }
        .app-box .btn-text { color: #111; font-size: 28px; letter-spacing: 1px; }

        /* 2. PDF Maker Box (Red) */
        .pdf-box { background-color: #E53935; }
        .pdf-box svg { width: 40px; height: 40px; fill: white; }
        .pdf-box .btn-text { color: white; font-size: 24px; letter-spacing: 0.5px; }

        /* 3. Compressor Box (Chocolate) */
        .compressor-box { background-color: #D2691E; }
        .compressor-box svg { width: 40px; height: 40px; fill: white; }
        .compressor-box .btn-text { color: white; font-size: 24px; letter-spacing: 0.5px; }

        /* 4. Screenshot Editor Box (Orange) */
        .editor-box { background-color: #FF9800; }
        .editor-box svg { width: 40px; height: 40px; fill: white; }
        .editor-box .btn-text { color: white; font-size: 20px; letter-spacing: 0.5px; }

        /* 5. Instagram Box (Blue) */
        .instagram-box { background-color: #1877F2; }
        .instagram-box svg { width: 45px; height: 45px; fill: white; }
        .instagram-box .btn-text { color: white; font-size: 24px; letter-spacing: 1px; }

        /* Popup Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #fff; width: 85%; max-width: 350px; border-radius: 15px; padding: 25px 20px; text-align: center; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2); animation: popUp 0.3s ease-out; }
        @keyframes popUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; font-weight: bold; color: #888; cursor: pointer; }
        .modal-content h2 { margin-top: 0; color: #333; font-size: 22px; }
        .modal-content p { color: #666; font-size: 15px; margin-bottom: 20px; font-weight: bold; line-height: 1.4; }
        .send-msg-btn { display: block; background-color: #ff3333; color: white; text-decoration: none; padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; box-shadow: 0 4px 10px rgba(255, 51, 51, 0.3); transition: background 0.3s; }
        .send-msg-btn:hover { background-color: #cc0000; }
        .hindi-note { font-size: 13px; color: #555; margin-top: 15px; line-height: 1.4; font-style: italic; border-top: 1px solid #eee; padding-top: 15px; font-weight: normal; }
    </style>
</head>
<body>

    <div class="header">
        <img src="IMG_20261006_211924.png" alt="SEAOX Logo" class="logo-img">
        <!-- Upar wala chat icon jo popup kholega -->
        <div class="menu-icon" onclick="openModal()">💬</div>
    </div>

    <!-- 1. APP Button (Yellow) -->
    <a href="store.html" class="btn-box app-box">
        <div class="btn-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                <line x1="12" y1="18" x2="12.01" y2="18"></line>
            </svg>
        </div>
        <div class="btn-text">APP</div>
    </a>

    <!-- 2. PDF Maker Button (Red) -->
    <a href="pdf-tool.html" class="btn-box pdf-box">
        <div class="btn-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/>
                <path d="M14 2v6h6" stroke="#E53935" stroke-width="2"/>
                <path d="M8 13h8M8 17h8M8 9h2" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
        </div>
        <div class="btn-text">PDF Maker</div>
    </a>

    <!-- 3. Image Compressor Button (Chocolate) -->
    <a href="image-compressor.html" class="btn-box compressor-box">
        <div class="btn-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
                <path d="M12 8v4m0 0v4m0-4h4m-4 0H8" stroke="#D2691E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <div class="btn-text">Compressor</div>
    </a>

    <!-- 4. Screenshot Editor Button (Orange) -->
    <a href="image-editor.html" class="btn-box editor-box">
        <div class="btn-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
            </svg>
        </div>
        <div class="btn-text">Screenshot Editor</div>
    </a>

    <!-- 5. Instagram Button (Blue) -->
    <a href="https://www.instagram.com/seaoxofficial" target="_blank" class="btn-box instagram-box">
        <div class="btn-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
            </svg>
        </div>
        <div class="btn-text">Instagram</div>
    </a>

    <!-- Popup Modal -->
    <div id="contactModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">×</span>
            <h2>Contact Us</h2>
            <p>Want to build a website, app, or software? Let's talk!</p>
            <a href="mailto:seaoxseaox@gmail.com?subject=New Message from SEAOX Website&body=Hello SEAOX Team," class="send-msg-btn">
                📩 Send Message
            </a>
            <p class="hindi-note">*किसी भी तरह का यदि हमारे एप्लीकेशन में अप्डेट चाहिए या फिर कोई फीचर्स एड करना हो तो आप हमें मेल कर सकते है</p>
        </div>
    </div>

    <script>
        function openModal() { document.getElementById('contactModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('contactModal').style.display = 'none'; }
        window.onclick = function(event) {
            var modal = document.getElementById('contactModal');
            if (event.target == modal) { modal.style.display = 'none'; }
        }
    </script>
</body>
</html>
