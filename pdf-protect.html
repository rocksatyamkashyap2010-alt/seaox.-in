<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEAOX - 100% Secure PDF</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    
    <!-- @cantoo/pdf-lib: Yeh library original PDF ke andar direct password lock lagati hai -->
    <script src="https://cdn.jsdelivr.net/npm/@cantoo/pdf-lib@1.17.4/dist/pdf-lib.min.js"></script>
    
    <style>
        body { margin: 0; padding: 15px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { width: 100%; max-width: 500px; display: flex; align-items: center; margin-bottom: 20px; }
        .back-btn { font-size: 24px; color: #333; text-decoration: none; margin-right: 15px; }
        .title { font-size: 22px; font-weight: bold; color: #111; }
        
        .card { background: #fff; padding: 25px 20px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); max-width: 400px; width: 100%; text-align: center; box-sizing: border-box; }
        .icon { font-size: 60px; margin-bottom: 10px; }
        h2 { margin: 0 0 10px 0; color: #111; font-size: 22px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; line-height: 1.4; }

        input[type="file"] { display: none; }
        .select-btn { background-color: #E0E0E0; color: #333; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; width: 100%; margin-bottom: 15px; transition: 0.3s; }
        .select-btn:hover { background-color: #d0d0d0; }
        
        .input-group { display: flex; flex-direction: column; margin-bottom: 20px; text-align: left; }
        .input-group label { font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #333; }
        .input-group input { padding: 12px; border: 2px solid #00A859; border-radius: 8px; font-size: 16px; font-weight: bold; text-align: center; letter-spacing: 1px;}
        
        .btn { padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; width: 100%; color: white; background-color: #2C3E50; transition: 0.3s; }
        .btn:disabled { background-color: #ccc; }
        
        #status { font-size: 14px; font-weight: bold; color: #E53935; margin-top: 15px; min-height: 20px; line-height: 1.5; }
        
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #2C3E50; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 10px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <a href="menu.html" class="back-btn">←</a>
        <div class="title">Protect PDF</div>
    </div>

    <div class="card">
        <div class="icon">🔒</div>
        <h2>Password Protect</h2>
        <p>Select a PDF file, set a secret password, and download it securely. (No quality loss).</p>

        <!-- File Input -->
        <input type="file" id="pdfInput" accept="application/pdf">
        
        <button class="select-btn" onclick="document.getElementById('pdfInput').click()">
            📂 Select PDF File
        </button>
        
        <div id="fileName" style="font-size: 13px; color: #00A859; font-weight: bold; margin-bottom: 15px; word-break: break-all;"></div>

        <div class="input-group">
            <label>Set Secret Password:</label>
            <input type="text" id="passwordInput" placeholder="Enter Password..." autocomplete="off">
        </div>

        <button class="btn" id="protectBtn" onclick="protectPDF()">
            🔒 Lock & Download PDF
        </button>
        
        <div class="loader" id="loader"></div>
        <div id="status"></div>
    </div>

    <script>
        // PDFLib object ko access karo
        const { PDFDocument } = PDFLib;

        const pdfInput = document.getElementById('pdfInput');
        const fileNameDiv = document.getElementById('fileName');
        
        pdfInput.addEventListener('change', function(e) {
            if(e.target.files.length > 0) {
                fileNameDiv.innerText = "Selected: " + e.target.files[0].name;
            }
        });

        async function protectPDF() {
            const file = pdfInput.files[0];
            const password = document.getElementById('passwordInput').value;
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('protectBtn');
            const loader = document.getElementById('loader');

            if (!file) {
                statusDiv.style.color = "#E53935";
                statusDiv.innerText = "Please select a PDF file!";
                return;
            }
            if (!password) {
                statusDiv.style.color = "#E53935";
                statusDiv.innerText = "Please enter a password!";
                return;
            }

            btn.disabled = true;
            btn.innerText = "Locking PDF... Please wait";
            loader.style.display = "block";
            statusDiv.style.color = "#FF9800";
            statusDiv.innerText = "Reading original file...";

            try {
                // 1. Original PDF ko ArrayBuffer mein read karo
                const arrayBuffer = await file.arrayBuffer();

                // 2. PDF Document load karo (Bina image banaye, direct file edit karenge)
                const pdfDoc = await PDFDocument.load(arrayBuffer);

                // 3. Password Lock lagao (Original PDF format mein)
                pdfDoc.encrypt({
                    userPassword: password, // Yeh password popup mein maangega
                    ownerPassword: password + "_SEAOX_MASTER", // Admin key
                    permissions: {
                        printing: 'highResolution',
                        modifying: false,
                        copying: false,
                        annotating: false,
                        fillingForms: false,
                        contentAccessibility: true,
                        documentAssembly: false,
                    }
                });

                // 4. Locked PDF save karo
                statusDiv.innerText = "Saving locked PDF...";
                const pdfBytes = await pdfDoc.save();

                // 5. Download trigger karo
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'Locked_' + file.name;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);

                statusDiv.style.color = "#00A859";
                statusDiv.innerText = "Success! PDF is locked. Try opening it, it will ask for password.";
                
            } catch (error) {
                console.error(error);
                statusDiv.style.color = "#E53935";
                // Agar file pehle se locked hai to error aayega
                if(error.message.includes("encrypted") || error.message.includes("password")) {
                    statusDiv.innerText = "Error: This PDF is already protected.";
                } else {
                    statusDiv.innerText = "Error: File might be corrupted or invalid.";
                }
            } finally {
                btn.disabled = false;
                btn.innerText = "🔒 Lock & Download PDF";
                loader.style.display = "none";
            }
        }
    </script>
</body>
</html>
