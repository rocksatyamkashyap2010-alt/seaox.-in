<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEAOX - Protect PDF</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    
    <!-- pdf-lib (Original PDF Encryption - No White Screen) -->
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    
    <style>
        body { margin: 0; padding: 15px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { width: 100%; max-width: 500px; display: flex; align-items: center; margin-bottom: 20px; }
        .back-btn { font-size: 24px; color: #333; text-decoration: none; margin-right: 15px; }
        .title { font-size: 22px; font-weight: bold; color: #111; }
        
        .card { background: #fff; padding: 25px 20px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); max-width: 400px; width: 100%; text-align: center; box-sizing: border-box; }
        .icon { font-size: 60px; margin-bottom: 10px; }
        h2 { margin: 0 0 10px 0; color: #111; font-size: 22px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; line-height: 1.4; }

        input[type="file"] { display: none; }
        .select-btn { background-color: #E0E0E0; color: #333; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; width: 100%; margin-bottom: 15px; transition: 0.3s; }
        .select-btn:hover { background-color: #d0d0d0; }
        
        .input-group { display: flex; flex-direction: column; margin-bottom: 20px; text-align: left; }
        .input-group label { font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #333; }
        .input-group input { padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        
        .btn { padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; width: 100%; color: white; background-color: #2C3E50; transition: 0.3s; }
        .btn:disabled { background-color: #ccc; }
        
        #status { font-size: 14px; font-weight: bold; color: #E53935; margin-top: 15px; min-height: 20px; line-height: 1.5; }
        
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #2C3E50; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 10px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <a href="menu.html" class="back-btn">←</a>
        <div class="title">Protect PDF</div>
    </div>

    <div class="card">
        <div class="icon">🔒</div>
        <h2>Password Protect</h2>
        <p>Select one or multiple PDF files, set a password, and download securely.</p>

        <!-- Multiple File Selection Enabled -->
        <input type="file" id="pdfInput" accept="application/pdf" multiple>
        
        <button class="select-btn" onclick="document.getElementById('pdfInput').click()">
            📂 Select PDF File(s)
        </button>
        
        <div id="fileName" style="font-size: 13px; color: #00A859; font-weight: bold; margin-bottom: 15px; word-break: break-all;"></div>

        <div class="input-group">
            <label>Set Password:</label>
            <input type="text" id="passwordInput" placeholder="Enter secret password...">
        </div>

        <button class="btn" id="protectBtn" onclick="protectPDF()">
            🔒 Protect & Download
        </button>
        
        <div class="loader" id="loader"></div>
        <div id="status"></div>
    </div>

    <script>
        const { PDFDocument } = PDFLib;
        const pdfInput = document.getElementById('pdfInput');
        const fileNameDiv = document.getElementById('fileName');
        
        pdfInput.addEventListener('change', function(e) {
            if(e.target.files.length > 0) {
                if(e.target.files.length === 1) {
                    fileNameDiv.innerText = "Selected: " + e.target.files[0].name;
                } else {
                    fileNameDiv.innerText = e.target.files.length + " Files Selected";
                }
            }
        });

        async function protectPDF() {
            const files = pdfInput.files;
            const password = document.getElementById('passwordInput').value;
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('protectBtn');
            const loader = document.getElementById('loader');

            if (files.length === 0) {
                statusDiv.style.color = "#E53935";
                statusDiv.innerText = "Please select a PDF file first!";
                return;
            }
            if (!password) {
                statusDiv.style.color = "#E53935";
                statusDiv.innerText = "Please enter a password!";
                return;
            }

            btn.disabled = true;
            btn.innerText = "Processing...";
            loader.style.display = "block";
            statusDiv.style.color = "#FF9800";

            let successCount = 0;

            try {
                // Loop through all selected files
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    statusDiv.innerText = `Processing: ${file.name} (${i + 1}/${files.length})...`;

                    // Read file as ArrayBuffer
                    const arrayBuffer = await file.arrayBuffer();

                    // Load original PDF
                    const pdfDoc = await PDFDocument.load(arrayBuffer);

                    // Save with Encryption (No quality loss, very fast)
                    const protectedPdfBytes = await pdfDoc.save({
                        userPassword: password, // Password user will enter to open
                        ownerPassword: password + "_SEAOX", // Admin password
                        permissions: {
                            printing: 'highResolution',
                            modifying: false,
                            copying: false,
                            annotating: false,
                            fillingForms: false,
                            contentAccessibility: true,
                            documentAssembly: false,
                        }
                    });

                    // Create Blob and trigger download
                    const blob = new Blob([protectedPdfBytes], { type: 'application/pdf' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'Protected_' + file.name;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    URL.revokeObjectURL(url);

                    successCount++;

                    // Thoda delay taaki mobile browser multiple downloads allow kare
                    await new Promise(resolve => setTimeout(resolve, 1000));
                }

                statusDiv.style.color = "#00A859";
                statusDiv.innerText = `Success! ${successCount} File(s) Protected & Downloaded.`;
                
            } catch (error) {
                console.error(error);
                statusDiv.style.color = "#E53935";
                statusDiv.innerText = "Error: File might be corrupted or already password protected.";
            } finally {
                btn.disabled = false;
                btn.innerText = "🔒 Protect & Download";
                loader.style.display = "none";
            }
        }
    </script>
</body>
</html>
