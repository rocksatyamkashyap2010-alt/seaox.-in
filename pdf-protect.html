<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEAOX - 100% Secure PDF</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    
    <!-- PDF.js (Read PDF) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- jsPDF with Encryption Support -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        body { margin: 0; padding: 15px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { width: 100%; max-width: 500px; display: flex; align-items: center; margin-bottom: 20px; }
        .back-btn { font-size: 24px; color: #333; text-decoration: none; margin-right: 15px; }
        .title { font-size: 22px; font-weight: bold; color: #111; }
        
        .card { background: #fff; padding: 25px 20px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); max-width: 400px; width: 100%; text-align: center; box-sizing: border-box; }
        .icon { font-size: 60px; margin-bottom: 10px; }
        h2 { margin: 0 0 10px 0; color: #111; font-size: 22px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; line-height: 1.4; }

        input[type="file"] { display: none; }
        .select-btn { background-color: #E0E0E0; color: #333; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; width: 100%; margin-bottom: 15px; transition: 0.3s; }
        
        .input-group { display: flex; flex-direction: column; margin-bottom: 20px; text-align: left; }
        .input-group label { font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #333; }
        .input-group input { padding: 12px; border: 2px solid #00A859; border-radius: 8px; font-size: 18px; font-weight: bold; letter-spacing: 2px; text-align: center; }
        
        .btn { padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; width: 100%; color: white; background-color: #2C3E50; transition: 0.3s; }
        .btn:disabled { background-color: #ccc; }
        
        #status { font-size: 14px; font-weight: bold; color: #E53935; margin-top: 15px; min-height: 20px; line-height: 1.5; }
        
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #2C3E50; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 10px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <a href="menu.html" class="back-btn">←</a>
        <div class="title">Protect PDF</div>
    </div>

    <div class="card">
        <div class="icon">🔐</div>
        <h2>100% Secure PDF</h2>
        <p>Set a password. The PDF will ask for this password before opening anywhere.</p>

        <!-- File Input -->
        <input type="file" id="pdfInput" accept="application/pdf">
        
        <button class="select-btn" onclick="document.getElementById('pdfInput').click()">
            📂 Select PDF File
        </button>
        
        <div id="fileName" style="font-size: 13px; color: #00A859; font-weight: bold; margin-bottom: 15px; word-break: break-all;"></div>

        <div class="input-group">
            <label>Set Secret Password:</label>
            <input type="text" id="passwordInput" placeholder="Enter Password..." autocomplete="off">
        </div>

        <button class="btn" id="protectBtn" onclick="protectPDF()">
            🔒 Lock & Download PDF
        </button>
        
        <div class="loader" id="loader"></div>
        <div id="status"></div>
    </div>

    <script>
        // Setup PDF.js Worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const pdfInput = document.getElementById('pdfInput');
        const fileNameDiv = document.getElementById('fileName');
        
        pdfInput.addEventListener('change', function(e) {
            if(e.target.files.length > 0) {
                fileNameDiv.innerText = "Selected: " + e.target.files[0].name;
            }
        });

        async function protectPDF() {
            const file = pdfInput.files[0];
            const password = document.getElementById('passwordInput').value;
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('protectBtn');
            const loader = document.getElementById('loader');

            if (!file) {
                statusDiv.style.color = "#E53935";
                statusDiv.innerText = "Please select a PDF file!";
                return;
            }
            if (!password) {
                statusDiv.style.color = "#E53935";
                statusDiv.innerText = "Please enter a password!";
                return;
            }

            btn.disabled = true;
            btn.innerText = "Locking PDF... Please wait";
            loader.style.display = "block";
            statusDiv.style.color = "#FF9800";
            statusDiv.innerText = "Reading original file...";

            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                
                // High Quality Scale (2.0)
                const firstPage = await pdf.getPage(1);
                const viewport = firstPage.getViewport({ scale: 2.0 }); 
                const docWidth = viewport.width;
                const docHeight = viewport.height;

                // Create PDF with Encryption
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({
                    orientation: docWidth > docHeight ? 'landscape' : 'portrait',
                    unit: 'px',
                    format: [docWidth, docHeight],
                    encryption: {
                        userPassword: password, // User must enter this
                        ownerPassword: password + "_SEAOX_MASTER", // Master key
                        userPermissions: [] // No editing, no copying
                    }
                });

                // Process all pages
                for (let i = 1; i <= pdf.numPages; i++) {
                    statusDiv.innerText = `Processing page ${i} of ${pdf.numPages}...`;
                    
                    const page = await pdf.getPage(i);
                    const pageViewport = page.getViewport({ scale: 2.0 }); // High quality

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = pageViewport.height;
                    canvas.width = pageViewport.width;

                    // Draw White Background (Prevents White/Blank PDF)
                    context.fillStyle = '#ffffff';
                    context.fillRect(0, 0, canvas.width, canvas.height);

                    // Render page to canvas
                    await page.render({ canvasContext: context, viewport: pageViewport }).promise;
                    
                    // Wait for canvas to settle
                    await new Promise(resolve => setTimeout(resolve, 150));

                    // Convert to image
                    const imgData = canvas.toDataURL('image/jpeg', 0.9);

                    // Safety Check
                    if (imgData === 'data:,' || imgData.length < 500) {
                        throw new Error("Image render failed. Please try again.");
                    }

                    if (i > 1) {
                        doc.addPage([docWidth, docHeight], docWidth > docHeight ? 'landscape' : 'portrait');
                    }
                    
                    doc.addImage(imgData, 'JPEG', 0, 0, docWidth, docHeight);
                    
                    // Cleanup memory for mobile
                    canvas.width = 0;
                    canvas.height = 0;
                }

                statusDiv.innerText = "Applying Password Lock...";
                
                // Save and download
                doc.save('Locked_' + file.name);

                statusDiv.style.color = "#00A859";
                statusDiv.innerText = "Success! PDF is locked. Try opening it, it will ask for password.";
                
            } catch (error) {
                console.error(error);
                statusDiv.style.color = "#E53935";
                statusDiv.innerText = "Error: " + error.message;
            } finally {
                btn.disabled = false;
                btn.innerText = "🔒 Lock & Download PDF";
                loader.style.display = "none";
            }
        }
    </script>
</body>
</html>
