<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEAOX - UPI QR Generator</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8f9fa; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            padding: 20px;
        }
        
        .header { 
            width: 100%; max-width: 500px; 
            display: flex; align-items: center; 
            margin-bottom: 20px; 
        }
        .back-btn { 
            font-size: 24px; color: #333; text-decoration: none; 
            margin-right: 15px; font-weight: bold;
        }
        .title { font-size: 20px; font-weight: 700; color: #111; }

        .card { 
            background: #ffffff; 
            width: 100%; max-width: 400px; 
            padding: 25px 20px; 
            border-radius: 20px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.06); 
            text-align: center;
        }

        .input-group { 
            display: flex; flex-direction: column; 
            margin-bottom: 15px; text-align: left; 
        }
        .input-group label { 
            font-size: 13px; font-weight: 600; 
            color: #555; margin-bottom: 6px; 
        }
        .input-group input { 
            padding: 12px 15px; 
            border: 1.5px solid #e0e0e0; 
            border-radius: 10px; 
            font-size: 15px; 
            font-family: inherit;
            outline: none;
            transition: 0.3s;
        }
        .input-group input:focus { border-color: #1877F2; }

        .btn { 
            width: 100%; padding: 14px; 
            background: #1877F2; color: white; 
            border: none; border-radius: 10px; 
            font-size: 16px; font-weight: 700; 
            cursor: pointer; margin-top: 10px;
            transition: 0.3s;
        }
        .btn:hover { background: #0b5cbe; }

        /* QR Display Area */
        #qr-container { 
            margin-top: 25px; 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            padding-top: 20px;
            border-top: 1px dashed #ddd;
        }
        #qrcode { 
            padding: 15px; 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 15px;
        }
        
        .download-btn { 
            background: #00A859; 
            color: white; 
            text-decoration: none; 
            padding: 12px 25px; 
            border-radius: 10px; 
            font-weight: 700; 
            font-size: 15px;
            display: inline-block;
            cursor: pointer;
            border: none;
        }

        .note { font-size: 12px; color: #888; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="header">
        <a href="menu.html" class="back-btn">←</a>
        <div class="title">UPI QR Generator</div>
    </div>

    <div class="card">
        <p style="color: #666; font-size: 14px; margin-bottom: 20px;">
            Enter your UPI ID and amount to generate a fixed payment QR code.
        </p>

        <div class="input-group">
            <label>UPI ID (e.g. 9876543210@paytm)</label>
            <input type="text" id="upiId" placeholder="Enter UPI ID" autocomplete="off">
        </div>

        <div class="input-group">
            <label>Payee Name (Optional)</label>
            <input type="text" id="payeeName" placeholder="Enter Name" value="SEAOX">
        </div>

        <div class="input-group">
            <label>Amount (₹)</label>
            <input type="number" id="amount" placeholder="e.g. 500" autocomplete="off">
        </div>

        <button class="btn" onclick="generateQR()">Generate Payment QR</button>

        <!-- QR Code Container -->
        <div id="qr-container">
            <div id="qrcode"></div>
            <button class="download-btn" onclick="downloadQR()">Download QR Code</button>
            <p class="note">Amount: ₹<span id="displayAmount"></span></p>
        </div>
    </div>

    <script>
        function generateQR() {
            const upiId = document.getElementById('upiId').value.trim();
            const payeeName = document.getElementById('payeeName').value.trim() || 'SEAOX';
            const amount = document.getElementById('amount').value.trim();

            if (!upiId) {
                alert("Kripya UPI ID daalein!");
                return;
            }
            if (!amount || amount <= 0) {
                alert("Kripya valid Amount daalein!");
                return;
            }

            // UPI URL Format: upi://pay?pa=UPI_ID&pn=NAME&am=AMOUNT&cu=INR
            const upiUrl = `upi://pay?pa=${encodeURIComponent(upiId)}&pn=${encodeURIComponent(payeeName)}&am=${amount}&cu=INR`;

            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = ""; // Clear old QR

            // Generate QR Code
            new QRCode(qrContainer, {
                text: upiUrl,
                width: 200,
                height: 200,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            // Show container
            document.getElementById('qr-container').style.display = 'flex';
            document.getElementById('displayAmount').innerText = amount;
        }

        function downloadQR() {
            const qrContainer = document.getElementById('qrcode');
            const canvas = qrContainer.querySelector('canvas');
            const img = qrContainer.querySelector('img');

            let url = "";
            if (canvas) {
                url = canvas.toDataURL("image/png");
            } else if (img) {
                url = img.src;
            }

            if (url) {
                const a = document.createElement('a');
                a.href = url;
                a.download = `UPI_QR_${document.getElementById('amount').value}.png`;
                document.body.appendChild(a);
                a.click();
                a.remove();
            }
        }
    </script>
</body>
</html>
