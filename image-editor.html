<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEAOX - Pro Screenshot Editor</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    
    <!-- Base Fonts (Fast Load) -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Open+Sans&family=Lato&family=Montserrat&family=Oswald&family=Raleway&family=Poppins&family=Merriweather&family=Playfair+Display&family=Nunito&family=Ubuntu&family=Rubik&family=Quicksand&family=Barlow&family=Josefin+Sans&display=swap" rel="stylesheet">
    
    <style>
        body { margin: 0; padding: 10px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .back-btn { font-size: 24px; color: #333; text-decoration: none; margin-right: 15px; }
        .title { font-size: 20px; font-weight: bold; color: #111; flex: 1; }
        
        .undo-btn { background: #555; color: white; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        
        .card { background: #fff; padding: 10px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); max-width: 500px; width: 100%; box-sizing: border-box; }
        
        .canvas-container { width: 100%; display: flex; justify-content: center; background: #e0e0e0; border-radius: 10px; overflow: hidden; margin-bottom: 10px; position: relative; }
        canvas { max-width: 100%; max-height: 40vh; display: block; cursor: crosshair; }
        
        .toolbar { display: flex; flex-direction: column; gap: 8px; }
        .tool-row { display: flex; gap: 8px; align-items: center; background: #f8f9fa; padding: 8px; border-radius: 8px; border: 1px solid #ddd; flex-wrap: wrap; }
        
        .btn { background-color: #1877F2; color: white; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; border: none; width: 100%; text-align: center; }
        .btn.upload { background-color: #00A859; margin-bottom: 10px; }
        .btn.download { background-color: #E53935; margin-top: 10px; }
        
        input[type="file"] { display: none; }
        .input-text { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        .input-color { width: 35px; height: 35px; padding: 0; border: none; border-radius: 5px; cursor: pointer; }
        .input-range { flex: 1; min-width: 80px; }
        .select-tool { padding: 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; background: white; flex: 1; font-weight: bold;}
        .checkbox-label { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: bold; }
        
        /* Font Search & List UI */
        .font-search-box { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; margin-bottom: 5px; box-sizing: border-box; }
        
        /* Yahan Height Badha Di Hai Taaki Zyada Fonts Dikhein */
        .font-list-container { height: 250px; overflow-y: auto; border: 1px solid #ddd; border-radius: 5px; background: white; }
        
        .font-item { padding: 12px 10px; cursor: pointer; border-bottom: 1px solid #eee; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
        .font-item:hover { background: #f0f0f0; }
        .font-item.selected { background: #e3f2fd; color: #1877F2; font-weight: bold; }
        
        /* Loader for Fonts */
        .font-loader { font-size: 10px; color: #999; display: none; }
        .font-item.loading .font-loader { display: block; }
    </style>
</head>
<body>

    <div class="header">
        <a href="menu.html" class="back-btn">←</a>
        <div class="title">Screenshot Editor</div>
        <button class="undo-btn" onclick="undo()">↩ Undo</button>
    </div>

    <div class="card">
        <input type="file" id="imageLoader" accept="image/*">
        <button class="btn upload" onclick="document.getElementById('imageLoader').click()">Select Screenshot</button>

        <div class="canvas-container">
            <canvas id="editorCanvas"></canvas>
        </div>

        <div class="toolbar">
            <div class="tool-row">
                <select id="toolSelect" class="select-tool">
                    <option value="box">🧹 Erase</option>
                    <option value="text">✍️ Add Text</option>
                </select>
            </div>

            <div class="tool-row" id="boxControls">
                <span style="font-size: 12px; font-weight: bold;">Color:</span>
                <input type="color" id="boxColor" class="input-color" value="#ffffff">
                <span style="font-size: 12px; font-weight: bold;">Size:</span>
                <input type="range" id="boxSize" class="input-range" min="10" max="200" value="60">
            </div>

            <div class="tool-row" id="textControls" style="display: none; flex-direction: column; align-items: stretch;">
                
                <div style="display: flex; gap: 8px; width: 100%; margin-bottom: 5px;">
                    <input type="text" id="textInput" class="input-text" placeholder="Type text here..." oninput="drawCanvas()">
                    <input type="color" id="textColor" class="input-color" value="#000000" oninput="drawCanvas()">
                </div>
                
                <!-- Visual Font Search -->
                <input type="text" id="fontSearch" class="font-search-box" placeholder="Search from 200+ fonts..." onkeyup="filterFonts()">
                <div id="fontList" class="font-list-container"></div>
                <input type="hidden" id="fontFamily" value="Arial">

                <div style="display: flex; gap: 8px; width: 100%; align-items: center; margin-top: 5px;">
                    <label class="checkbox-label">
                        <input type="checkbox" id="isBold" checked onchange="drawCanvas()"> Bold
                    </label>
                    <span style="font-size: 12px;">Size:</span>
                    <input type="range" id="textSize" class="input-range" min="10" max="150" value="30" oninput="drawCanvas()">
                </div>
            </div>

            <button class="btn download" onclick="downloadImage()">Download Edited Photo</button>
        </div>
    </div>

        // Dynamic Font Loading Function
        function loadFontDynamically(fontName) {
            // Agar font pehle se loaded nahi hai to link banao
            const fontId = 'font-' + fontName.replace(/\s+/g, '-').toLowerCase();
            if (!document.getElementById(fontId)) {
                const link = document.createElement('link');
                link.id = fontId;
                link.rel = 'stylesheet';
                link.href = `https://fonts.googleapis.com/css2?family=${fontName.replace(/\s+/g, '+')}&display=swap`;
                document.head.appendChild(link);
            }
        }

        // Render Visual Font List
        function renderFontList(filterText = "") {
            const container = document.getElementById('fontList');
            container.innerHTML = '';
            
            let count = 0;
            fontList.forEach(font => {
                if(font.toLowerCase().includes(filterText.toLowerCase())) {
                    const div = document.createElement('div');
                    div.className = 'font-item';
                    div.style.fontFamily = `'${font}', sans-serif`;
                    div.innerHTML = `<span>${font}</span><span class="font-loader">⟳</span>`;
                    
                    div.onclick = () => {
                        document.getElementById('fontFamily').value = font;
                        document.querySelectorAll('.font-item').forEach(el => el.classList.remove('selected'));
                        div.classList.add('selected');
                        
                        // Font dynamically load karo jab click ho
                        div.classList.add('loading');
                        loadFontDynamically(font);
                        
                        // Thoda wait karke draw karo taaki font load ho jaye
                        setTimeout(() => {
                            drawCanvas();
                            div.classList.remove('loading');
                        }, 300);
                    };
                    container.appendChild(div);
                    count++;
                }
            });
            
            if(count === 0) {
                container.innerHTML = '<div style="padding:10px; color:#999;">No font found.</div>';
            }
        }
        
        renderFontList(); // Initial load

        function filterFonts() {
            renderFontList(document.getElementById('fontSearch').value);
        }

        // Tool Switch
        document.getElementById('toolSelect').addEventListener('change', function(e) {
            if(e.target.value === 'box') {
                document.getElementById('boxControls').style.display = 'flex';
                document.getElementById('textControls').style.display = 'none';
            } else {
                document.getElementById('boxControls').style.display = 'none';
                document.getElementById('textControls').style.display = 'flex';
            }
        });

        // Load Image
        document.getElementById('imageLoader').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    originalImage = img;
                    canvas.width = img.width;
                    canvas.height = img.height;
                    objects = []; 
                    drawCanvas();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Tap on Canvas
        canvas.addEventListener('click', function(e) {
            if (!originalImage) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);
            const tool = document.getElementById('toolSelect').value;

            if (tool === 'box') {
                const color = document.getElementById('boxColor').value;
                const size = parseInt(document.getElementById('boxSize').value); 
                objects.push({ type: 'box', x: x - (size/2), y: y - (size/2), w: size, h: size, color: color });
            } else {
                const text = document.getElementById('textInput').value;
                if(!text) { alert("Please type text first!"); return; }
                objects.push({
                    type: 'text', x: x, y: y, text: text,
                    color: document.getElementById('textColor').value,
                    size: document.getElementById('textSize').value,
                    font: document.getElementById('fontFamily').value,
                    bold: document.getElementById('isBold').checked
                });
            }
            drawCanvas();
        });

        function drawCanvas() {
            if (!originalImage) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(originalImage, 0, 0);

            objects.forEach(obj => {
                if (obj.type === 'box') {
                    ctx.fillStyle = obj.color;
                    ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
                } else if (obj.type === 'text') {
                    const weight = obj.bold ? 'bold' : 'normal';
                    ctx.font = `${weight} ${obj.size}px '${obj.font}', sans-serif`;
                    ctx.fillStyle = obj.color;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(obj.text, obj.x, obj.y);
                }
            });
        }

        function undo() {
            if (objects.length > 0) { objects.pop(); drawCanvas(); } 
        }

        function downloadImage() {
            if (!originalImage) return;
            const link = document.createElement('a');
            link.download = 'SEAOX_Edited.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.click();
        }
