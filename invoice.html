<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEAOX - Professional Receipt Generator</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    
    <!-- jsPDF Library (Direct PDF banane ke liye) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body { margin: 0; padding: 15px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; }
        .header { max-width: 800px; margin: 0 auto 20px auto; display: flex; align-items: center; }
        .back-btn { font-size: 24px; color: #333; text-decoration: none; margin-right: 15px; }
        .title { font-size: 22px; font-weight: bold; color: #111; }

        .form-container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .section-title { background: #f8f9fa; padding: 10px; border-left: 4px solid #FFC107; font-weight: bold; margin-bottom: 15px; border-radius: 4px; margin-top: 20px; color: #333; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .input-group { display: flex; flex-direction: column; margin-bottom: 10px; }
        .input-group label { font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #555; }
        .input-group input { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; font-family: inherit; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        th, td { padding: 8px; border: 1px solid #ddd; text-align: left; font-size: 14px; }
        th { background: #f4f4f4; color: #333; }
        .item-input { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
        
        .btn { padding: 12px 20px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; transition: 0.3s; }
        .btn-add { background: #00A859; margin-top: 5px; }
        .btn-generate { background: #6B46C1; width: 100%; margin-top: 25px; padding: 15px; font-size: 18px; display: flex; justify-content: center; align-items: center; gap: 10px;}
        .btn-generate:hover { background: #553c9a; }
        
        /* Hidden QR container for generation */
        #qr-hidden { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <a href="menu.html" class="back-btn">←</a>
        <div class="title">Receipt Generator</div>
    </div>

    <div class="form-container">
        <!-- 1. Business Details -->
        <div class="section-title">1. Business Details</div>
        <div class="grid-2">
            <div class="input-group"><label>Shop Name *</label><input type="text" id="shopName" placeholder="Enter Shop Name"></div>
            <div class="input-group"><label>Mobile No. *</label><input type="text" id="shopMobile" placeholder="Enter Mobile Number"></div>
            <div class="input-group" style="grid-column: span 2;"><label>Address *</label><input type="text" id="shopAddress" placeholder="Enter Full Address"></div>
            <div class="input-group" style="grid-column: span 2;"><label>UPI ID (For QR Code)</label><input type="text" id="shopUpi" placeholder="e.g. 9876543210@paytm or shop@okaxis"></div>
        </div>

        <!-- 2. Receipt Details -->
        <div class="section-title">2. Receipt Details</div>
        <div class="grid-2">
            <div class="input-group"><label>Receipt No. *</label><input type="text" id="invNo" value="SEAOX/001"></div>
            <div class="input-group"><label>Date *</label><input type="date" id="invDate"></div>
        </div>

        <!-- 3. Customer Details -->
        <div class="section-title">3. Customer Details</div>
        <div class="grid-2">
            <div class="input-group"><label>Customer Name *</label><input type="text" id="custName" placeholder="Enter Customer Name"></div>
            <div class="input-group"><label>Mobile No. *</label><input type="text" id="custMobile" placeholder="Enter Mobile Number"></div>
            <div class="input-group" style="grid-column: span 2;"><label>Address</label><input type="text" id="custAddress" placeholder="Enter Customer Address"></div>
        </div>

        <!-- 4. Item Details -->
        <div class="section-title">4. Item Details</div>
        <table id="itemsTable">
            <thead>
                <tr>
                    <th width="5%">No.</th>
                    <th width="45%">Item Description</th>
                    <th width="15%">Qty</th>
                    <th width="15%">Rate (₹)</th>
                    <th width="20%">Amount (₹)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td><input type="text" class="item-input item-desc" placeholder="Item Name"></td>
                    <td><input type="number" class="item-input item-qty" value="1" oninput="calcTotal()"></td>
                    <td><input type="number" class="item-input item-rate" value="0" oninput="calcTotal()"></td>
                    <td class="item-amount">0.00</td>
                </tr>
            </tbody>
        </table>
        <button class="btn btn-add" onclick="addRow()">+ Add Item</button>

        <button class="btn btn-generate" onclick="generatePDF()" id="genBtn">
            📄 Generate Receipt (PDF)
        </button>
    </div>

    <!-- Hidden QR Code generator div -->
    <div id="qr-hidden"></div>

    <script>
        // Default Date setup
        document.getElementById('invDate').valueAsDate = new Date();

        // Naya item add karne ka function
        function addRow() {
            const tbody = document.querySelector('#itemsTable tbody');
            const rowCount = tbody.rows.length + 1;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${rowCount}</td>
                <td><input type="text" class="item-input item-desc" placeholder="Item Name"></td>
                <td><input type="number" class="item-input item-qty" value="1" oninput="calcTotal()"></td>
                <td><input type="number" class="item-input item-rate" value="0" oninput="calcTotal()"></td>
                <td class="item-amount">0.00</td>
            `;
            tbody.appendChild(tr);
            calcTotal();
        }

        // Total calculate karne ka function (Form ke liye)
        function calcTotal() {
            const rows = document.querySelectorAll('#itemsTable tbody tr');
            rows.forEach(row => {
                const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
                const rate = parseFloat(row.querySelector('.item-rate').value) || 0;
                const amount = qty * rate;
                row.querySelector('.item-amount').innerText = amount.toFixed(2);
            });
        }

        // Main PDF Generator Function
        async function generatePDF() {
            const btn = document.getElementById('genBtn');
            btn.innerText = "Generating PDF... Please wait";
            btn.disabled = true;

            // 1. Data Collect karo
            const shopName = document.getElementById('shopName').value || "SHOP NAME";
            const shopMobile = document.getElementById('shopMobile').value || "-";
            const shopAddress = document.getElementById('shopAddress').value || "-";
            const shopUpi = document.getElementById('shopUpi').value;

            const custName = document.getElementById('custName').value || "-";
            const custMobile = document.getElementById('custMobile').value || "-";
            const custAddress = document.getElementById('custAddress').value || "-";

            const invNo = document.getElementById('invNo').value || "-";
            const invDate = document.getElementById('invDate').value || "-";

            // Items Array banayo
            const items = [];
            let totalAmount = 0;
            const rows = document.querySelectorAll('#itemsTable tbody tr');
            
            rows.forEach((row) => {
                const desc = row.querySelector('.item-desc').value || "-";
                const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
                const rate = parseFloat(row.querySelector('.item-rate').value) || 0;
                const amount = qty * rate;
                
                items.push([desc, qty, rate.toFixed(2), amount.toFixed(2)]);
                totalAmount += amount;
            });

            // 2. QR Code Generate karo (Agar UPI ID daali hai)
            let qrDataUrl = null;
            if(shopUpi.trim() !== "" && totalAmount > 0) {
                const qrDiv = document.getElementById('qr-hidden');
                qrDiv.innerHTML = ''; // Clear old
                const upiUrl = `upi://pay?pa=${shopUpi}&pn=${encodeURIComponent(shopName)}&am=${totalAmount.toFixed(2)}&cu=INR`;
                
                new QRCode(qrDiv, {
                    text: upiUrl,
                    width: 120,
                    height: 120,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });

                // Wait thoda sa taaki QR render ho jaye
                await new Promise(r => setTimeout(r, 300));
                
                const canvas = qrDiv.querySelector('canvas');
                if(canvas) {
                    qrDataUrl = canvas.toDataURL("image/png");
                }
            }

            // 3. PDF Create karo (jsPDF library)
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4'); // A4 size, portrait

            // Colors
            const primaryColor = [255, 193, 7]; // Yellowish
            const textColor = [33, 33, 33]; // Dark Grey
            
            // --- HEADER ---
            doc.setFont("helvetica", "bold");
            doc.setFontSize(24);
            doc.setTextColor(textColor[0], textColor[1], textColor[2]);
            doc.text(shopName.toUpperCase(), 14, 25);

            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.text("Mobile: " + shopMobile, 14, 32);
            doc.text("Address: " + shopAddress, 14, 37);
            
            // Yellow Line
            doc.setDrawColor(primaryColor[0], primaryColor[1], primaryColor[2]);
            doc.setLineWidth(1.5);
            doc.line(14, 42, 196, 42);

            // --- INVOICE TITLE ---
            doc.setFont("helvetica", "bold");
            doc.setFontSize(18);
            doc.text("RECEIPT", 14, 55);
            
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.text("Receipt No: " + invNo, 150, 50);
            doc.text("Date: " + invDate, 150, 56);

            // --- CUSTOMER DETAILS ---
            doc.setFont("helvetica", "bold");
            doc.text("Bill To:", 14, 70);
            
            doc.setFont("helvetica", "normal");
            doc.text("Name: " + custName, 14, 76);
            doc.text("Mobile: " + custMobile, 14, 82);
            doc.text("Address: " + custAddress, 14, 88);

            // --- ITEMS TABLE (Using AutoTable) ---
            doc.autoTable({
                startY: 100,
                head: [['No.', 'Item Description', 'Qty', 'Rate (Rs)', 'Amount (Rs)']],
                body: items.map((item, index) => [index + 1, ...item]),
                theme: 'grid',
                headStyles: { fillColor: primaryColor, textColor: textColor, fontStyle: 'bold' },
                styles: { fontSize: 10, textColor: textColor, cellPadding: 4 },
                columnStyles: {
                    0: { cellWidth: 15, halign: 'center' },
                    1: { cellWidth: 80 },
                    2: { cellWidth: 20, halign: 'center' },
                    3: { cellWidth: 30, halign: 'right' },
                    4: { cellWidth: 35, halign: 'right' }
                }
            });

            // Yahan pata karo table kahan khatam hui
            let finalY = doc.lastAutoTable.finalY + 10;

            // --- TOTALS ---
            doc.setFont("helvetica", "bold");
            doc.setFontSize(14);
            doc.text("Total Amount: Rs " + totalAmount.toFixed(2), 130, finalY);

            // --- QR CODE ---
            if(qrDataUrl) {
                doc.addImage(qrDataUrl, 'PNG', 14, finalY - 15, 30, 30);
                doc.setFontSize(8);
                doc.setFont("helvetica", "normal");
                doc.text("Scan to Pay", 14, finalY + 18);
            }

            // --- FOOTER ---
            doc.setDrawColor(200, 200, 200);
            doc.line(14, 270, 196, 270);
            
            doc.setFontSize(10);
            doc.setTextColor(100, 100, 100);
            doc.text("Thank You! Visit Again.", 105, 280, { align: "center" });
            doc.text("Powered by SEAOX", 105, 285, { align: "center" });

            // --- SAVE PDF ---
            doc.save('seaox.pdf');

            // Button reset karo
            btn.innerText = "📄 Generate Receipt (PDF)";
            btn.disabled = false;
        }
    </script>
</body>
</html>
